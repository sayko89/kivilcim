<script>
/* ===== Paket 2: HAFIZA ===== */

/* --- N-Geri --- */
(function(){
const {register,pick,quiz,YN}=K;
register({id:'ngeri',name:'N-Geri',cat:'hafiza',skill:'Çalışma belleği',glyph:'nback',len:'60 saniye',maxLevel:8,
  desc:'Harfler akarken her birinin N adım önceki harfle aynı olup olmadığını söyle.',
  tutorial:()=>['Ekranda harfler tek tek görünür.','Seviye 1–2’de 1-geri (bir önceki harf), 3–5’te 2-geri, sonrasında 3-geri oynanır.',
    'Şu anki harf N adım önceki harfle aynıysa Evet, değilse Hayır de.'],
  keys:'Klavyede ← Hayır, → Evet. Başlangıç harfleri için Boşluk.',
  stats:e=>[['N değeri',e.n+'-geri'],['Eşleşmeleri yakalama',Core.fmtPct(e.hitRate||0)],['Yanlış alarm',e.fa]],
  run(s){
    const n=s.practice?1:s.level<=2?1:s.level<=5?2:3;const pool='BKMRTSLNDP'.split('').slice(0,s.level>=6?10:6);
    const st={h:[]};Object.assign(s.extra,{n,fa:0,tg:0,hits:0});
    quiz(s,{duration:60000,practiceN:5,state:st,okWait:250,badWait:650,
      gen(st){
        const h=st.h;let ch;
        if(h.length>=n&&Math.random()<.33)ch=h[h.length-n];
        else do ch=pick(pool);while(h.length>=n&&ch===h[h.length-n]);
        h.push(ch);
        const card=`<div class="card"><span class="bigch">${ch}</span></div>`;
        if(h.length<=n)return{html:card+`<p class="cap">Aklında tut (${h.length}/${n})</p>`,options:[{label:'Sıradaki',value:'ok',key:' ',keyLabel:'Boşluk'}],correct:'ok',noScore:true};
        const same=ch===h[h.length-1-n];
        return{html:card,options:YN,correct:same?'y':'n',same,cap:`${n} önceki harfle aynı mı?`,explain:`${n} önceki harf ${h[h.length-1-n]} idi.`};
      },
      after(it,right){if(it.same){s.extra.tg++;if(right)s.extra.hits++}else if(!right)s.extra.fa++}
    });
    const oe=s.end.bind(s);s.end=()=>{s.extra.hitRate=s.extra.tg?s.extra.hits/s.extra.tg:0;oe()};
  }});
})();

/* --- Sıra Hafızası --- */
(function(){
const {register,rnd,svg,$$}=K;
const PADS=[['var(--c-blue)','square'],['var(--c-orange)','circle'],['var(--c-green)','triangle'],['var(--c-red)','diamond'],['var(--c-pink)','star'],['var(--c-sky)','hex']];
register({id:'sira',name:'Sıra Hafızası',cat:'hafiza',skill:'Sıralı hafıza',glyph:'pads',len:'yaklaşık 2 dakika, 8 tur',maxLevel:10,
  desc:'Yanan düğmelerin sırasını izle ve aynı sırayla tekrarla. Her doğru turda dizi uzar.',
  tutorial:()=>['Renkli düğmeler sırayla yanacak; her düğmenin kendi şekli ve numarası var.','Işıklar bitince aynı sırayla düğmelere bas.',
    'Doğru tekrarlarsan dizi bir uzar, yanılırsan bir kısalır. Seviye 5’ten sonra 6 düğme olur.'],
  keys:'Klavyede düğme numaraları (1–6) ile basabilirsin.',
  stats:e=>[['En uzun doğru dizi',e.maxLen||'—'],['Doğru tur',`${e.ok}/${e.rounds}`]],
  run(s){
    s.opts.remove();
    const ROUNDS=s.practice?1:8;let round=0;Object.assign(s.extra,{maxLen:0,ok:0,rounds:ROUNDS});
    const k=s.level>=5?6:4,cols=k===6?3:2;
    s.stage.innerHTML=`<div class="simon" style="grid-template-columns:repeat(${cols},1fr)">${PADS.slice(0,k).map((p,i)=>`<button class="pad" data-i="${i}" style="background:${p[0]}" aria-label="Düğme ${i+1}" disabled>${svg(p[1],'#fff')}<b>${i+1}</b></button>`).join('')}</div>`;
    const pads=$$('.pad',s.stage);let phase='wait',seq=[],pos=0,lastT=0;
    const flash=(i,ms)=>{pads[i].classList.add('on');s.later(()=>pads[i].classList.remove('on'),ms)};
    function startRound(){
      const len=s.practice?2:s.level+1;seq=Array.from({length:len},()=>rnd(k));
      phase='show';pos=0;pads.forEach(p=>p.disabled=true);s.progress(1-round/ROUNDS);
      s.hint(`İzle: ${len} adım.`,true);
      const on=Math.max(300,560-s.level*25),gap=180;
      seq.forEach((i,j)=>s.later(()=>flash(i,on),500+j*(on+gap)));
      s.later(()=>{phase='input';pads.forEach(p=>p.disabled=false);lastT=performance.now();s.hint('Şimdi aynı sırayla bas.')},500+len*(on+gap));
    }
    function press(i){
      if(phase!=='input')return;flash(i,180);const now=performance.now();
      if(i===seq[pos]){
        s.hit({rt:now-lastT,sound:false});lastT=now;pos++;
        if(pos===seq.length){phase='done';s.extra.ok++;s.extra.maxLen=Math.max(s.extra.maxLen,seq.length);K.beep(true);
          s.hint('Doğru sıra!',true);s.setLevel(s.level+1);end()}
      }else{
        phase='done';s.miss();s.hint(`Yanlış: ${pos+1}. adımda ${seq[pos]+1} numaralı düğme yanmıştı.`,true);
        flash(seq[pos],700);s.setLevel(s.level-1);end();
      }
    }
    function end(){round++;pads.forEach(p=>p.disabled=true);s.later(()=>{if(round>=ROUNDS){s.progress(0);s.end()}else startRound()},s.practice?1800:1300)}
    pads.forEach(p=>p.onclick=()=>press(+p.dataset.i));
    s.key(e=>{const i=+e.key-1;if(i>=0&&i<k){e.preventDefault();press(i)}});
    startRound();
  }});
})();

/* --- Rakam Dizisi --- */
(function(){
const {register,rnd,$$}=K;
register({id:'rakam',name:'Rakam Dizisi',cat:'hafiza',skill:'Kısa süreli bellek',glyph:'digits',len:'yaklaşık 2 dakika, 6 tur',maxLevel:9,
  desc:'Tek tek gösterilen rakamları hatırla ve yaz. İleri seviyelerde tersten yazman gerekir.',
  tutorial:()=>['Rakamlar tek tek ekranda belirip kaybolacak.','Dizi bitince rakamları aynı sırayla yaz ve Tamam’a bas.',
    'Seviye 5’ten sonra diziyi tersten (sondan başa) yazman istenir.'],
  keys:'Klavyede rakam tuşları, Backspace ve Enter kullanılabilir.',
  stats:e=>[['En uzun doğru dizi',e.maxLen?e.maxLen+' rakam':'—'],['Doğru dizi',`${e.ok}/${e.rounds}`],['Yön',e.mode]],
  run(s){
    const ROUNDS=s.practice?1:6;let round=0;Object.assign(s.extra,{maxLen:0,ok:0,rounds:ROUNDS,mode:'İleri'});
    function cfg(){const lv=s.practice?1:s.level;return lv<=4?{len:lv+2,rev:false}:{len:lv-1,rev:true}}
    function startRound(){
      const c=cfg();if(c.rev)s.extra.mode='Tersten';
      const seq=Array.from({length:c.len},()=>rnd(10));
      s.progress(1-round/ROUNDS);s.opts.innerHTML='';
      s.hint(`${c.len} rakam${c.rev?'; sonra tersten yaz':''}. İzle.`,true);
      const on=Math.max(550,850-s.level*30),gap=250;
      seq.forEach((d,j)=>{s.later(()=>{s.stage.innerHTML=`<div class="card"><span class="bigch">${d}</span></div>`},400+j*(on+gap));s.later(()=>{s.stage.innerHTML=''},400+j*(on+gap)+on)});
      s.later(()=>input(seq,c),400+c.len*(on+gap));
    }
    function input(seq,c){
      let typed=[];const t0=performance.now();
      const want=c.rev?seq.slice().reverse():seq;
      const draw=()=>{s.stage.innerHTML=`<div class="slots">${want.map((_,i)=>`<i class="${typed[i]!=null?'f':''}">${typed[i]??''}</i>`).join('')}</div>`};
      draw();s.hint(c.rev?'Tersten yaz: son rakamdan başla.':'Aynı sırayla yaz.',true);
      s.opts.innerHTML=`<div class="numpad" style="grid-template-columns:repeat(5,1fr)">${[1,2,3,4,5,6,7,8,9,0].map(d=>`<button class="nk" data-d="${d}">${d}</button>`).join('')}
        <button class="nk" data-d="del" style="grid-column:span 2">⌫</button><button class="nk" data-d="ok" style="grid-column:span 3;background:var(--ink);color:var(--bg)">Tamam</button></div>`;
      let done=false;
      const press=d=>{
        if(done)return;
        if(d==='del'){typed.pop();draw();return}
        if(d==='ok'){if(typed.length<want.length)return;check();return}
        if(typed.length<want.length){typed.push(+d);draw();if(typed.length===want.length)s.later(()=>{if(!done)check()},250)}
      };
      function check(){
        done=true;const ok=typed.every((v,i)=>v===want[i]);const rt=performance.now()-t0;
        if(ok){s.hit({rt,points:10*want.length});s.extra.ok++;s.extra.maxLen=Math.max(s.extra.maxLen,want.length);s.hint('Doğru!',true);s.setLevel(s.level+1)}
        else{s.miss();s.hint(`Doğrusu: ${want.join(' ')}`,true);s.setLevel(s.level-1)}
        round++;s.later(()=>{if(round>=ROUNDS){s.progress(0);s.end()}else startRound()},ok?1000:2200);
      }
      $$('.nk',s.opts).forEach(b=>b.onclick=()=>press(b.dataset.d));
      s.key(e=>{if(/^\d$/.test(e.key)){e.preventDefault();press(e.key)}else if(e.key==='Backspace'){e.preventDefault();press('del')}else if(e.key==='Enter'){e.preventDefault();press('ok')}});
    }
    startRound();
  }});
})();

/* --- Kart Eşleştir --- */
(function(){
const {register,shuffle,$$}=K;
const EMO=['🍎','🍌','🍇','🍓','🍒','🍍','🥝','🍋','🥥','🍑','🍐','🍉','🥕','🌽'];
register({id:'kartlar',name:'Kart Eşleştir',cat:'hafiza',skill:'Görsel-uzamsal hafıza',glyph:'cards',len:'yaklaşık 1–2 dakika',maxLevel:9,
  desc:'Kartları ikişer ikişer çevir, aynı resimleri eşleştir. Gördüğün yerleri unutma.',
  tutorial:()=>['Kartlar kapalı. İki kart çevirdiğinde aynıysa açık kalır, farklıysa geri kapanır.',
    'Daha önce gördüğün bir kartın yerini hatırlayıp yine de yanlış eşleştirirsen hafıza hatası sayılır.','Seviye arttıkça kart sayısı artar.'],
  stats:e=>[['Hamle',e.moves],['Hafıza hatası',e.memErr],['Çift sayısı',e.pairs]],
  run(s){
    s.opts.remove();s.stage.classList.add('nofx');
    const pairs=s.practice?3:Math.min(12,3+s.level),cols=pairs<=4?4:pairs<=8?4:6;
    const deck=shuffle(shuffle(EMO.slice()).slice(0,pairs).flatMap(e=>[e,e]));
    Object.assign(s.extra,{moves:0,memErr:0,pairs});
    s.stage.innerHTML=`<div class="mem" style="grid-template-columns:repeat(${cols},1fr);width:min(94vw,${cols*84}px)">${deck.map((_,i)=>`<button class="mc" data-i="${i}" aria-label="Kapalı kart"></button>`).join('')}</div>`;
    const cards=$$('.mc',s.stage),seen=new Set(),done=new Set();let first=null,lock=false,t0=performance.now();
    s.progress(1);s.hint(`${pairs} çift. Bir kart çevir.`);
    function flip(i){
      if(lock||done.has(i)||i===first)return;
      cards[i].classList.add('up');cards[i].textContent=deck[i];cards[i].setAttribute('aria-label',deck[i]);
      if(first==null){first=i;t0=performance.now();return}
      const a=first,b=i;first=null;s.extra.moves++;
      if(deck[a]===deck[b]){
        done.add(a);done.add(b);cards[a].classList.add('done');cards[b].classList.add('done');s.hit({rt:performance.now()-t0});
        s.progress(1-done.size/deck.length);
        if(done.size===deck.length){s.hint(`Bitti! ${s.extra.moves} hamle.`,true);s.bonus(Math.max(0,(pairs*3-s.extra.moves)*5));s.later(()=>s.end(),1200)}
      }else{
        const pairOf=x=>deck.findIndex((d,j)=>d===deck[x]&&j!==x);
        const knew=seen.has(pairOf(a));
        if(knew){s.extra.memErr++;s.miss();s.hint('Bu kartın eşini daha önce görmüştün.',true)}else s.hint('Eşleşmedi.');
        lock=true;cards[a].classList.add('no');cards[b].classList.add('no');
        s.later(()=>{[a,b].forEach(x=>{cards[x].classList.remove('up','no');cards[x].textContent='';cards[x].setAttribute('aria-label','Kapalı kart')});lock=false},850);
      }
      seen.add(a);seen.add(b);
    }
    cards.forEach(c=>c.onclick=()=>flip(+c.dataset.i));
  }});
})();
</script>
<script>
/* ===== Paket 2: DİKKAT ve ESNEKLİK ===== */

/* --- Ok Yönü (flanker) --- */
(function(){
const {register,rnd,quiz}=K;
register({id:'oklar',name:'Ok Yönü',cat:'dikkat',skill:'Seçici dikkat',glyph:'arrows',len:'45 saniye',maxLevel:8,
  desc:'Ortadaki okun yönünü söyle; çevresindeki oklar seni yanıltmaya çalışacak.',
  tutorial:()=>['Ekranda bir sıra ok göreceksin.','Yalnızca ORTADAKİ okun yönüne göre Sol ya da Sağ’a bas.','Kenardaki oklar bazen aynı, bazen ters yöne bakar. Seviye arttıkça ters oklar çoğalır.'],

(function(){
const {register,rnd,$$}=K;
register({id:'kostebek',name:'Köstebek Avı',cat:'dikkat',skill:'Tepki hızı ve ketleme',glyph:'mole',len:'45 saniye',maxLevel:8,
  desc:'Deliklerden çıkan köstebeklere hızla dokun ama kirpilere dokunma!',
  tutorial:()=>['Deliklerden kısa süreliğine hayvanlar çıkar.','🐹 köstebeğe olabildiğince hızlı dokun.','🦔 kirpiye dokunmak hata sayılır. Kaçırılan köstebek de hata sayılır.','Seviye arttıkça hızlanır, delik ve kirpi sayısı artar.'],
  stats:e=>[['Yakalanan köstebek',e.caught],['Kaçırılan',e.missed],['Kirpiye dokunma',e.bad]],
  run(s){
    s.opts.remove();s.stage.classList.add('nofx');
    const g=s.level>=4&&!s.practice?4:3;
    s.stage.innerHTML=`<div class="holes" style="grid-template-columns:repeat(${g},1fr)">${Array.from({length:g*g},(_,i)=>`<button class="hole" data-i="${i}" aria-label="Delik ${i+1}"></button>`).join('')}</div>`;
    const holes=$$('.hole',s.stage),act=new Map();Object.assign(s.extra,{caught:0,missed:0,bad:0});let shown=0;
    const win=()=>s.practice?1800:Math.max(600,1300-s.level*90);
    const maxAct=()=>s.practice?1:1+Math.floor(s.level/3);
    const decoyP=()=>s.practice?.2:Math.min(.4,.15+s.level*.03);
    function spawn(){
      if(!s.alive)return;
      if(s.practice&&shown>=8){if(!act.size)s.end();else s.later(spawn,300);return}
      if(act.size<maxAct()){
        const free=holes.map((_,i)=>i).filter(i=>!act.has(i));const i=free[rnd(free.length)];
        const decoy=Math.random()<decoyP();shown++;
        holes[i].innerHTML=`<span>${decoy?'🦔':'🐹'}</span>`;
        const it={decoy,t0:performance.now()};act.set(i,it);
        it.tm=s.later(()=>{if(act.get(i)!==it)return;act.delete(i);holes[i].innerHTML='';if(!decoy){s.extra.missed++;s.miss({sound:false});fb(i,'bad')}},win());
      }
      s.later(spawn,s.practice?900:Math.max(280,700-s.level*50)+rnd(300));
    }
    const fb=(i,c)=>{holes[i].classList.remove('good','bad');void holes[i].offsetWidth;holes[i].classList.add(c);s.later(()=>holes[i].classList.remove(c),250)};
    holes.forEach((h,i)=>h.addEventListener('pointerdown',e=>{e.preventDefault();tap(i)}));
    holes.forEach((h,i)=>h.addEventListener('click',e=>{if(e.detail===0)tap(i)}));
    function tap(i){
      const it=act.get(i);if(!it)return;act.delete(i);clearTimeout(it.tm);holes[i].innerHTML='';
      if(it.decoy){s.extra.bad++;s.miss();fb(i,'bad');s.hint('Kirpiye dokunma!',true)}
      else{s.extra.caught++;s.hit({rt:performance.now()-it.t0});fb(i,'good');if(s.extra.caught%8===0)s.setLevel(s.level+1)}
    }
    if(!s.practice)s.timer(45000);else{s.progress(1);s.hint('Deneme: 8 hayvan çıkacak.')}
    s.later(spawn,500);
  }});
})();

(function(){
const {register,shuffle,$$}=K;
register({id:'schulte',name:'Sayı Avı',cat:'dikkat',skill:'Görsel tarama',glyph:'grid3',len:'yaklaşık 1–2 dakika, 2 tablo',maxLevel:8,
  desc:'Tablodaki sayıları 1’den başlayarak sırayla, olabildiğince hızlı bul.',
  tutorial:()=>['Karışık dizilmiş sayılardan oluşan bir tablo göreceksin.','1’den başlayarak sayılara sırayla dokun.',
    'Seviye arttıkça tablo büyür (3×3’ten 5×5’e). İleri seviyelerde sayıların boyutu değişir, en yüksek seviyede her dokunuşta tablo karışır.'],
  stats:e=>[['Tablo boyutu',e.size],['Ortalama tablo süresi',Core.fmtSec(e.avg)],['Yanlış dokunma',e.wrong]],
  run(s){
    s.opts.remove();s.stage.classList.add('nofx');
    const T=s.practice?1:2;let t=0;const times=[];Object.assign(s.extra,{wrong:0,size:''});
    function start(){
      const lv=s.practice?1:s.level,g=lv===1?3:lv===2?4:5,N=g*g,varied=lv>=5,reshuf=lv>=7;
      s.extra.size=`${g}×${g}`;let nums=shuffle([...Array(N).keys()].map(x=>x+1)),next=1;const t0=performance.now();let last=t0;
      const draw=()=>{s.stage.innerHTML=`<div class="schulte" style="grid-template-columns:repeat(${g},1fr)">${nums.map(v=>`<button class="sq${v<next?' done':''}" data-v="${v}" style="${varied?`font-size:${(.7+Math.random()*.7).toFixed(2)}em`:''}">${v}</button>`).join('')}</div>`;
        $$('.sq',s.stage).forEach(b=>b.onclick=()=>tap(+b.dataset.v,b))};
      function tap(v,b){
        if(v<next)return;const now=performance.now();
        if(v===next){next++;s.hit({rt:now-last,sound:false});last=now;b.classList.add('done');s.hint(`Sıradaki: ${next<=N?next:'—'}`);s.progress(1-(next-1)/N);
          if(next>N){times.push(now-t0);t++;K.beep(true);s.hint(`Tablo bitti: ${Core.fmtSec(now-t0)}`,true);
            if(s.mistakes<=2&&!s.practice)s.setLevel(s.level+1);
            s.later(()=>{if(t>=T){s.extra.avg=Core.mean(times);s.end()}else start()},1300);return}
          if(reshuf){nums=shuffle(nums);draw()}}
        else{s.extra.wrong++;s.miss();b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad')}
      }
      draw();s.hint('1 ile başla.');s.progress(1);
    }
    start();
  }});
})();

<script>
/* ===== Paket 2: PROBLEM ÇÖZME ===== */
const _r=(lo,hi)=>lo+K.rnd(hi-lo+1);

/* --- Para Üstü --- */
(function(){
const {register,pick,shuffle,quiz}=K;
const ITEMS=['Simit','Ayran','Defter','Kalem','Su','Elma','Gazete','Çikolata','Kitap','Tişört','Şemsiye','Kulaklık','Ekmek','Peynir'];
const tl=k=>{const s=(k/100).toFixed(2).replace('.',',');return(s.endsWith(',00')?s.slice(0,-3):s)+' TL'};
const NOTES=[2000,5000,10000,20000,50000,100000];
register({id:'paraustu',name:'Para Üstü',cat:'problem',skill:'Günlük matematik',glyph:'coin',len:'yaklaşık 1–2 dakika, 10 soru',maxLevel:7,
  desc:'Alışveriş fişine bak, verilen paraya göre para üstünü hesapla.',

  keys:'Klavyede 1–4 tuşları seçenekleri işaretler.',

  run(s){
    const R=s.practice?2:10;Object.assign(s.extra,{right:0,rounds:R});let rr=0;
    quiz(s,{rounds:R,practiceN:2,okWait:600,badWait:1700,showWrong:true,
      gen(){
        const lv=s.level,n=lv<=2?1:lv<=4?2:3,kurus=lv>=4;
        const its=shuffle(ITEMS.slice()).slice(0,n).map(name=>({name,p:(lv===1?_r(1,18):_r(5,95))*100+(kurus?pick([0,25,50,75]):0)}));
        let sum=its.reduce((a,b)=>a+b.p,0),disc=0;
        if(lv>=6){disc=pick([10,20,25]);sum=Math.round(sum*(100-disc)/100/25)*25}
        const paid=NOTES.find(x=>x>sum)||Math.ceil(sum/10000)*10000+10000;const ch=paid-sum;
        const set=new Set([ch]);for(const d of shuffle([100,-100,500,-500,1000,-1000,50,-50,25,-25,200]))if(set.size<4&&ch+d>0)set.add(ch+d);
        const vals=shuffle([...set]);

/* --- Kesir Karşılaştır --- */
(function(){
const {register,rnd,quiz}=K;
const gcd=(a,b)=>b?gcd(b,a%b):a;
const pie=(n,d,col)=>{let p='';for(let i=0;i<d;i++){const a0=i/d*2*Math.PI-Math.PI/2,a1=(i+1)/d*2*Math.PI-Math.PI/2;
  const x0=50+42*Math.cos(a0),y0=50+42*Math.sin(a0),x1=50+42*Math.cos(a1),y1=50+42*Math.sin(a1);
  p+=`<path d="M50 50L${x0.toFixed(1)} ${y0.toFixed(1)}A42 42 0 ${1/d>.5?1:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}z" fill="${i<n?col:'var(--surface)'}" stroke="var(--ink)" stroke-width="1.5"/>`}
  return`<svg viewBox="0 0 100 100" aria-hidden="true">${d===1?`<circle cx="50" cy="50" r="42" fill="${n?col:'none'}" stroke="var(--ink)"/>`:p}</svg>`};
register({id:'kesir',name:'Kesir Karşılaştır',cat:'problem',skill:'Oran ve büyüklük',glyph:'pie',len:'yaklaşık 1–2 dakika, 12 soru',maxLevel:7,
  desc:'İki kesirden hangisinin büyük olduğunu bul; bazen eşit olabilirler.',
  tutorial:()=>['Yan yana iki kesir göreceksin.','Büyük olanı seç. Seviye 3’ten sonra “Eşit” seçeneği de gelir.','İlk seviyelerde pasta grafikleri yardımcı olur, sonra yalnızca sayılar kalır.'],
  keys:'Klavyede ← Sol, → Sağ, ↓ Eşit.',
  stats:e=>[['Doğru cevap',`${e.right}/${e.rounds}`]],
  run(s){
    const R=s.practice?3:12;Object.assign(s.extra,{right:0,rounds:R});let rr=0;
    quiz(s,{rounds:R,practiceN:3,okWait:500,badWait:1600,showWrong:true,
      gen(){
        const lv=s.level,vis=lv<=3,eqOk=lv>=3;let a,b,c,d;
        for(let t=0;t<200;t++){
          if(lv<=1){b=d=_r(3,8);a=_r(1,b-1);c=_r(1,d-1)}
          else if(lv===2){a=c=_r(1,3);b=_r(a+1,9);d=_r(a+1,9)}
          else{b=_r(2,lv>=5?12:9);d=_r(2,lv>=5?12:9);a=_r(1,b-1);c=_r(1,d-1);
            if(eqOk&&Math.random()<.2){const g=gcd(a,b),m=_r(2,3);a=a/g;b=b/g;c=a*m;d=b*m}}
          if(!eqOk&&a*d===c*b)continue;
          if(lv>=5&&a*d!==c*b&&Math.abs(a/b-c/d)>.2)continue;
          break;
        }
        const L=a/b,Rr=c/d,ans=Math.abs(L-Rr)<1e-9?'E':L>Rr?'L':'R';
        const fr=(n,dd,col)=>`<div class="frac">${vis&&dd<=12?pie(n,dd,col):''}<b>${n}<i>${dd}</i></b></div>`;
        const opts=[{label:'Sol',value:'L',key:'ArrowLeft',keyLabel:'←'},...(eqOk?[{label:'Eşit',value:'E',key:'ArrowDown',keyLabel:'↓'}]:[]),{label:'Sağ',value:'R',key:'ArrowRight',keyLabel:'→'}];
        return{html:`<div class="fracs">${fr(a,b,'var(--c-orange)')}<span class="bigch" style="font-size:2rem">?</span>${fr(c,d,'var(--c-blue)')}</div>`,
          options:opts,correct:ans,correctLabel:ans==='E'?'Eşit':ans==='L'?'Sol':'Sağ',cap:'Hangisi büyük?',
          explain:`${a}/${b} ≈ ${(L).toFixed(2).replace('.',',')}, ${c}/${d} ≈ ${(Rr).toFixed(2).replace('.',',')}.`};
      },
      after(it,right){if(right){s.extra.right++;if(++rr>=3){rr=0;s.setLevel(s.level+1)}}else rr=0}});
  }});
})();

register({id:'anagram',name:'Harf Karıştır',cat:'problem',skill:'Sözel akıcılık',glyph:'abc',len:'90 saniye',maxLevel:7,

  stats:e=>[['Bulunan kelime',e.found],['Geçilen kelime',e.skipped],['Yanlış deneme',e.wrong]],
  run(s){
    Object.assign(s.extra,{found:0,skipped:0,wrong:0});const used=new Set();let lastT=performance.now(),cnt=0;
    function next(){
      if(s.practice&&cnt>=2){s.end();return}cnt++;
      const lv=s.level,[lo,hi]=lv<=1?[3,4]:lv===2?[4,5]:lv<=4?[5,6]:lv<=5?[6,7]:[7,10];
      let pool=W.filter(w=>{const n=Array.from(w[0]).length;return n>=lo&&n<=hi&&!used.has(w[0])});if(!pool.length){used.clear();pool=W.filter(w=>{const n=Array.from(w[0]).length;return n>=lo&&n<=hi})}
      const [word,clue]=pool[K.rnd(pool.length)];used.add(word);
      const letters=Array.from(word);let mix;do mix=shuffle(letters.map((c,i)=>({c,i})));while(mix.map(x=>x.c).join('')===word&&letters.length>1);
      let ans=[];lastT=performance.now();
      const draw=(cls='')=>{
        s.stage.innerHTML=`<p class="clue">İpucu: ${clue}</p><div class="tiles ans ${cls}" aria-label="Cevap">${letters.map((_,k)=>ans[k]!=null?`<button class="tl" data-a="${k}">${mix[ans[k]].c}</button>`:'<span class="tl" style="border-style:dashed;opacity:.4"></span>').join('')}</div>
          <div class="tiles" style="margin-top:18px">${mix.map((m,k)=>`<button class="tl${ans.includes(k)?' used':''}" data-k="${k}">${m.c}</button>`).join('')}</div>`;
        $$('[data-k]',s.stage).forEach(b=>b.onclick=()=>add(+b.dataset.k));
        $$('[data-a]',s.stage).forEach(b=>b.onclick=()=>{ans.splice(+b.dataset.a);draw()});
      };
      function add(k){if(ans.includes(k)||ans.length>=letters.length)return;ans.push(k);draw();if(ans.length===letters.length)check()}
      function check(){
        const got=ans.map(k=>mix[k].c).join('');
        if(got===word){s.extra.found++;s.hit({rt:performance.now()-lastT,points:5+letters.length*4});draw('ok');s.hint(`${word}!`,true);if(s.extra.found%3===0)s.setLevel(s.level+1);s.later(next,700)}
        else{s.extra.wrong++;s.miss();draw('bad');s.hint('Olmadı, tekrar dene.',true);s.later(()=>{ans=[];draw()},600)}
      }
      s.opts.innerHTML=`<div class="row" style="justify-content:center"><button class="secondary" id="skip">Geç</button></div>`;
      s.opts.querySelector('#skip').onclick=()=>{s.extra.skipped++;s.miss({sound:false});s.hint(`Kelime: ${word}`,true);s.later(next,900)};
      s.key(e=>{if(e.key==='Backspace'){e.preventDefault();ans.pop();draw();return}
        if(e.key.length===1){const L=e.key.toLocaleUpperCase('tr-TR');const k=mix.findIndex((m,j)=>m.c===L&&!ans.includes(j));if(k>=0){e.preventDefault();add(k)}}});
      draw();s.hint(s.practice?'Deneme: harflere sırayla dokun.':'');
    }
    if(!s.practice)s.timer(90000);else{s.progress(1);s.barEl.style.opacity='.25'}
    next();
  }});
})();

/* --- Hanoi Kulesi --- */
(function(){
const {register,$$}=K;
const COLS=['var(--c-blue)','var(--c-orange)','var(--c-green)','var(--c-red)','var(--c-pink)','var(--c-sky)'];
register({id:'kule',name:'Hanoi Kulesi',cat:'problem',skill:'Planlama',glyph:'tower',len:'yaklaşık 1–3 dakika',maxLevel:7,
  desc:'Diskleri tek tek sağdaki çubuğa taşı; büyük disk asla küçüğün üstüne gelemez.',
  tutorial:()=>['Soldaki çubukta büyükten küçüğe dizilmiş diskler var. Hepsini en sağdaki çubuğa taşı.',
    'Bir çubuğa dokununca en üstteki disk seçilir, sonra hedef çubuğa dokun.','Büyük bir diski küçük diskin üstüne koyamazsın; bu hata sayılır.',
    'Amaç en az hamleyle bitirmek: 3 disk için 7, 4 disk için 15 hamle.'],
  keys:'Klavyede 1, 2, 3 tuşları çubukları seçer.',
  stats:e=>[['Disk sayısı',e.n],['Hamle',`${e.moves} (en az ${e.opt})`],['Kural dışı hamle',e.illegal]],
  run(s){
    s.opts.remove();s.stage.classList.add('nofx');
    const n=s.practice?2:s.level<=2?3:s.level<=4?4:s.level<=6?5:6,opt=2**n-1;
    const pegs=[[...Array(n).keys()].map(i=>n-i),[],[]];let sel=-1;const t0=performance.now();let lastT=t0;
    Object.assign(s.extra,{n,moves:0,opt,illegal:0});
    const draw=()=>{
      s.stage.innerHTML=`<div class="hanoi">${pegs.map((p,i)=>`<button class="peg${sel===i?' sel':''}" data-p="${i}" aria-label="Çubuk ${i+1}, ${p.length} disk">${p.map(d=>`<span class="disk" style="width:${20+d*(70/n)}%;background:${COLS[(d-1)%6]}"></span>`).join('')}</button>`).join('')}</div>`;
      $$('.peg',s.stage).forEach(b=>b.onclick=()=>tap(+b.dataset.p));
    };
    function tap(i){
      if(sel<0){if(!pegs[i].length)return;sel=i;draw();return}
      if(i===sel){sel=-1;draw();return}
      const d=pegs[sel][pegs[sel].length-1],top=pegs[i][pegs[i].length-1];
      if(top!=null&&top<d){s.extra.illegal++;s.miss();s.hint('Büyük disk küçüğün üstüne konamaz.',true);sel=-1;draw();const b=$$('.peg',s.stage)[i];b.classList.add('bad');return}
      pegs[i].push(pegs[sel].pop());sel=-1;s.extra.moves++;const now=performance.now();s.addRt(now-lastT);lastT=now;
      s.hint(`Hamle: ${s.extra.moves} (en az ${opt})`);s.progress(1-pegs[2].length/n);draw();
      if(pegs[2].length===n){
        const eff=opt/s.extra.moves;s.hit({points:Math.round(40*n*eff)+(s.extra.moves===opt?30:0)});
        s.accuracy=Math.min(1,eff)*(s.extra.illegal?Math.max(.5,1-s.extra.illegal*.1):1);
        s.hint(s.extra.moves===opt?'Mükemmel: en az hamleyle bitirdin!':`Tamamlandı: ${s.extra.moves} hamle.`,true);
        if(eff>=.75)s.setLevel(s.level+1);s.later(()=>s.end(),1500);
      }
    }
    s.key(e=>{const i=+e.key-1;if(i>=0&&i<3){e.preventDefault();tap(i)}});
    draw();s.hint(s.practice?'Deneme: önce küçük diski ortaya taşı.':`${n} disk. En az ${opt} hamle.`);s.progress(1);
  }});
})();

(function(){

register({id:'terazi',name:'Terazi',cat:'problem',skill:'Mantıksal çıkarım',glyph:'scale',len:'yaklaşık 2 dakika, 8 soru',maxLevel:6,
  desc:'Dengedeki terazilere bak; soru işaretli terazinin dengede kalması için kaç daire gerektiğini bul.',
  tutorial:()=>['Her terazi dengede: sol ve sağ taraf eşit ağırlıkta.','Bu bilgilerden yola çıkarak son terazide ? yerine kaç ● gerektiğini bul.','Seviye arttıkça terazi zinciri uzar.'],
  keys:'Klavyede 1–4 tuşları seçenekleri işaretler.',
  stats:e=>[['Doğru cevap',`${e.right}/${e.rounds}`]],
  run(s){
    const R=s.practice?2:8;Object.assign(s.extra,{right:0,rounds:R});let rr=0;
    quiz(s,{rounds:R,practiceN:2,okWait:700,badWait:2200,showWrong:true,
      gen(){
        const lv=s.level,a=_r(2,4),m=_r(2,3),q=_r(2,3);let rows=[],ans,qL,why;

        if(lv<=1){const k=_r(1,2);rows=[bal(rep('▲',k),rep('●',k*a))];qL='▲';ans=a;why=`${k} ▲ = ${k*a} ● ise 1 ▲ = ${a} ●.`}
        else if(lv===2){rows=[bal('▲',rep('●',a)),bal('■',rep('▲',m))];qL='■';ans=a*m;why=`■ = ${m} ▲ ve ▲ = ${a} ● → ■ = ${a*m} ●.`}
        else if(lv===3){rows=[bal('▲',rep('●',a)),bal('■',rep('▲',m)),bal('◆','■ ■')];qL='◆';ans=2*a*m;why=`◆ = 2 ■ = ${2*m} ▲ = ${2*a*m} ●.`}
        else if(lv===4){const b=_r(1,3);rows=[bal('▲',rep('●',a)),bal('■','▲ '+rep('●',b))];qL='■ ■';ans=2*(a+b);why=`■ = ${a}+${b} = ${a+b} ● → 2 ■ = ${2*(a+b)} ●.`}
        else{const b=_r(1,2);rows=[bal('▲ ▲',rep('●',2*a)),bal('■ ●',rep('▲',m)),bal('◆','■ ▲')];qL='◆';const sq=m*a-1;ans=sq+a;why=`▲ = ${a} ●, ■ = ${m}×${a}−1 = ${sq} ●, ◆ = ■ + ▲ = ${ans} ●.`}
        rows=lv>=3?shuffle(rows):rows;
        const set=new Set([ans]);for(const d of shuffle([1,-1,2,-2,a,-a,3]))if(set.size<4&&ans+d>0)set.add(ans+d);
        const vals=shuffle([...set]);
        return{html:`<div class="scales">${rows.join('')}${bal(qL,'? ●',true)}</div>`,options:vals.map((v,i)=>({label:v+' ●',value:String(v),key:String(i+1),keyLabel:String(i+1)})),
          correct:String(ans),correctLabel:ans+' ●. '+why,cap:'? yerine kaç ● gelmeli?',explain:why};
      },

  }});

['gece','gündüz'],['iç','dış'],['erken','geç'],['güzel','çirkin'],['ince','kalın'],['alçak','yüksek'],['geniş','dar'],['dolu','boş'],['yeni','eski'],['tatlı','acı'],

        let add=0,qh=h,qm=m;if(lv>=6){add=pick([15,20,25,35,40,50,70,85]);const t=(h*60+m+add);qh=Math.floor(t/60)%12||12;qm=t%60}
        const ans=fmt(qh,qm);
        const lures=[fmt(Math.round(m/5)%12||12,(h%12)*5),fmt(qh%12+1,qm),fmt(qh===1?12:qh-1,qm),fmt(qh,(qm+5)%60),fmt(qh,(qm+55)%60),fmt(h,m)];
        const set=new Set([ans]);for(const x of shuffle(lures))if(set.size<4)set.add(x);
        const vals=shuffle([...set]);
        return{html:face(h,m,lv<5),options:vals.map((v,i)=>({label:v,value:v,key:String(i+1),keyLabel:String(i+1)})),correct:ans,correctLabel:ans,
          cap:add?`Bu saatten ${add} dakika sonra saat kaç olur?`:'Saat kaç?',explain:add?`Saat ${fmt(h,m)}; ${add} dakika sonra ${ans}.`:`Saat ${ans}.`};
      },
      after(it,right){if(right){s.extra.right++;if(++rr>=3){rr=0;s.setLevel(s.level+1)}}else rr=0}});
  }});
})();

/* --- Pusula --- */
(function(){
const {register,rnd,pick,quiz}=K;
const DIR=[{n:'Kuzey',a:'↑',k:'ArrowUp'},{n:'Doğu',a:'→',k:'ArrowRight'},{n:'Güney',a:'↓',k:'ArrowDown'},{n:'Batı',a:'←',k:'ArrowLeft'}];
const TURN=[{t:'Sağa dön',d:1},{t:'Sola dön',d:-1},{t:'Geriye dön',d:2},{t:'İki kez sağa dön',d:2},{t:'Üç kez sola dön',d:1}];
register({id:'pusula',name:'Pusula',cat:'uzamsal',skill:'Yön takibi',glyph:'compass',len:'yaklaşık 2 dakika, 10 soru',maxLevel:7,
  desc:'Dönüş komutlarını zihninde takip et ve sonunda hangi yöne baktığını bul.',
  tutorial:()=>['Bir yöne bakarak başlarsın, örneğin Kuzey.','Ardından dönüş komutları gelir: sağa dön, sola dön, geriye dön…','Komutların sonunda hangi yöne baktığını seç.',
    'Seviye 3’ten sonra komutlar tek tek görünüp kaybolur; zihninde takip etmen gerekir.'],
  keys:'Klavyede ok tuşları yönleri seçer (↑ Kuzey, → Doğu, ↓ Güney, ← Batı).',
  stats:e=>[['Doğru cevap',`${e.right}/${e.rounds}`],['En uzun komut dizisi',e.maxSteps]],
  run(s){
    const R=s.practice?2:10;Object.assign(s.extra,{right:0,rounds:R,maxSteps:0});let rr=0;
    quiz(s,{rounds:R,practiceN:2,okWait:600,badWait:2000,showWrong:true,
      gen(){
        const lv=s.level,n=Math.min(7,1+lv),start=rnd(4);let d=start;
        const pool=lv<=2?TURN.slice(0,2):lv<=4?TURN.slice(0,3):TURN;
        const steps=Array.from({length:n},()=>pick(pool));steps.forEach(t=>d=(d+t.d+4)%4);
        const hide=lv>=3&&!s.practice,gap=Math.max(.7,1.3-lv*.08);
        s.extra.maxSteps=Math.max(s.extra.maxSteps,n);
        const html=`<p class="qtext">${DIR[start].a} ${DIR[start].n}’e bakıyorsun.</p>
          <div class="steps2${hide?' hide':''}" style="margin-top:12px">${steps.map((t,i)=>`<span style="--d:${(i*gap).toFixed(2)}s;--h:${(i*gap+gap*.9).toFixed(2)}s">${i+1}. ${t.t}</span>`).join('')}</div>`;
        const trace=[DIR[start].n];let x=start;steps.forEach(t=>{x=(x+t.d+4)%4;trace.push(DIR[x].n)});
        return{html,options:DIR.map(D=>({label:`${D.a} ${D.n}`,value:D.n,key:D.k,keyLabel:''})),correct:DIR[d].n,correctLabel:DIR[d].n+' ('+trace.join(' → ')+')',
          cap:'Şimdi hangi yöne bakıyorsun?',explain:trace.join(' → ')};
      },
      after(it,right){if(right){s.extra.right++;if(++rr>=2){rr=0;s.setLevel(s.level+1)}}else rr=0}});
  }});
})();

/* --- Ayna mı? --- */
(function(){
const {register,rnd,pick,quiz}=K;
const CH='FGJKLPQR2457'.split('');
register({id:'ayna',name:'Ayna mı?',cat:'uzamsal',skill:'Zihinsel döndürme',glyph:'mirror',len:'45 saniye',maxLevel:8,
  desc:'Döndürülmüş harfin normal mi yoksa aynadaki görüntüsü mü olduğuna karar ver.',
  tutorial:()=>['Bir harf ya da rakam, belli bir açıyla döndürülmüş olarak görünür.','Onu zihninde düz konuma çevir: normal yazılış mı, ayna görüntüsü mü?',
    'Seviye arttıkça dönme açıları büyür ve çeşitlenir.'],
  keys:'Klavyede ← Normal, → Ayna.',
  stats:e=>[['Küçük açılarda tepki',Core.fmtSec(e.rtSmall)],['Büyük açılarda tepki',Core.fmtSec(e.rtBig)]],
  run(s){
    const sm=[],bg=[];
    const OPTS=[{label:'Normal',value:'N',key:'ArrowLeft',keyLabel:'←'},{label:'Ayna',value:'M',key:'ArrowRight',keyLabel:'→'}];
    quiz(s,{duration:45000,practiceN:4,okWait:250,
      gen(){
        const lv=s.level,ch=pick(CH),mir=Math.random()<.5;
        const ang=lv<=1||s.practice?0:lv===2?pick([-45,0,45]):lv===3?pick([0,90,180,270]):lv<=5?rnd(8)*45:rnd(24)*15;
        const html=`<div class="mirrorbox"><svg viewBox="0 0 100 100" role="img" aria-label="Döndürülmüş karakter"><g transform="rotate(${ang} 50 50)"><g transform="translate(50 50) scale(${mir?-1:1} 1)"><text x="0" y="24" text-anchor="middle" font-size="68" font-weight="800" font-family="Bricolage Grotesque,system-ui,sans-serif" fill="var(--ink)">${ch}</text></g></g></svg></div>`;
        return{html,options:OPTS,correct:mir?'M':'N',ang:Math.abs(((ang+180)%360+360)%360-180),cap:'Normal mi, ayna mı?',explain:mir?'Bu, karakterin ayna görüntüsüydü.':'Bu, karakterin normal hâliydi.'};
      },
      after(it,right,rt){if(right)(it.ang>=90?bg:sm).push(rt);if(right&&s.correct%8===0)s.setLevel(s.level+1)}
    });
    const oe=s.end.bind(s);s.end=()=>{s.extra.rtSmall=Core.mean(sm);s.extra.rtBig=Core.mean(bg);oe()};
  }});
})();
</script>
<script>K.home();</script></body></html>
