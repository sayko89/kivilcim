    function startRound(){
      const n=L(),g=gridSize(n),cells=g*g;
      const target=new Set(shuffle([...Array(cells).keys()]).slice(0,n));
      const found=new Set();let failed=false;
      s.progress(1-round/ROUNDS);
      stage.innerHTML=`<div class="mgrid" style="grid-template-columns:repeat(${g},1fr)">${Array.from({length:cells},(_,i)=>`<button class="tile" data-i="${i}" disabled aria-label="Kare ${i+1}"></button>`).join('')}</div>`;
      const tiles=$$('.tile',stage);
      s.hint(s.practice?`${n} kare yanacak. Yerlerini aklında tut.`:`Tur ${round+1}/${ROUNDS}: ${n} kareyi izle.`);
      s.later(()=>target.forEach(i=>tiles[i].classList.add('lit')),450);
      let t0=0,lastTap=0;
      s.later(()=>{
        target.forEach(i=>tiles[i].classList.remove('lit'));
        tiles.forEach(t=>t.disabled=false);
        s.hint(`Yanan kareleri seç. ${n} kare kaldı.`);t0=lastTap=performance.now();
        tiles[0].focus({preventScroll:true});
      },450+900+n*180);
      tiles.forEach(t=>t.onclick=()=>{
        if(failed||t.disabled)return;
        const i=+t.dataset.i;t.disabled=true;const now=performance.now();
        if(target.has(i)){
          found.add(i);t.classList.add('hit');t.textContent='✓';s.hit({rt:now-lastTap});lastTap=now;
          if(found.size===n){
            s.extra.maxTiles=Math.max(s.extra.maxTiles,n);
            s.hint(s.practice?'Doğru, hepsini buldun!':'Hepsi doğru! Bir sonraki turda bir kare daha.',true);
            s.stage.classList.add('good');tiles.forEach(x=>x.disabled=true);
            s.setLevel(s.level+1);endRound();
          }else s.hint(`Güzel. ${n-found.size} kare kaldı.`);
        }else{
          failed=true;s.miss();t.classList.add('miss');t.textContent='✗';
          tiles.forEach(x=>x.disabled=true);
          target.forEach(j=>{if(!found.has(j))tiles[j].classList.add('reveal')});
          s.stage.classList.add('bad');
          s.hint('Bu kare yanmamıştı. Doğru yerler kesik çizgiyle gösteriliyor.',true);
          s.setLevel(s.level-1);endRound();
        }
      });
    }
    function endRound(){
      round++;
      s.later(()=>{s.stage.classList.remove('good','bad');if(round>=ROUNDS){s.progress(0);s.end()}else startRound()},s.practice?2000:1300);
    }
    startRound();
  }});
})();
</script>
<script>
/* ===== 1. KAYBOLAN ROTA: görsel hafıza ===== */
(function(){
const {register,rnd,$$}=K;
const LEN=[4,5,6,8,9,10,12,13,14,16];
const gridFor=len=>len<=5?5:len<=8?6:len<=12?7:8;
/* Kendini kesmeyen rastgele yürüyüş; dönüşleri tercih eder ki rota ilginç olsun. */
function makeRoute(g,len,avoid){
  for(let attempt=0;attempt<400;attempt++){
    const start=rnd(g*g);if(avoid&&avoid.has(start))continue;
    const path=[start],used=new Set(path);let ok=true;
    while(path.length<len){
      const c=path[path.length-1],x=c%g,y=(c/g)|0;
      let nb=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>[x+dx,y+dy]).filter(([a,b])=>a>=0&&b>=0&&a<g&&b<g).map(([a,b])=>b*g+a)
        .filter(n=>!used.has(n)&&!(avoid&&avoid.has(n)));
      if(!nb.length){ok=false;break}
      if(path.length>=2&&Math.random()<.45){
        const p=path[path.length-2],dir=c-p;const straight=nb.filter(n=>n-c===dir);
        const turn=nb.filter(n=>n-c!==dir);if(turn.length)nb=turn;else nb=straight;
      }
      const n=nb[rnd(nb.length)];path.push(n);used.add(n);
    }
    if(ok)return path;
  }
  return null;
}
const adj=(a,b,g)=>{const ax=a%g,ay=(a/g)|0,bx=b%g,by=(b/g)|0;return Math.abs(ax-bx)+Math.abs(ay-by)===1};

register({id:'rota',name:'Kaybolan Rota',cat:'hafiza',skill:'Görsel hafıza',glyph:'star',len:'yaklaşık 2 dakika, 5 tur',maxLevel:10,
  desc:'Birkaç saniye görünen rotayı hatırla ve başlangıçtan hedefe yeniden çiz.',
  tutorial:()=>['Izgarada B (başlangıç) karesinden H (hedef) karesine giden bir rota 3–5 saniye görünecek.',
    'Rota kaybolunca B’den başlayarak rotadaki kareleri sırayla seç. Basılı tutup sürükleyerek de çizebilirsin.',
    'Yanlış kare hata sayılır; bir turda 3 hata yaparsan rota gösterilir ve sonraki tura geçilir.',
    'İleri seviyelerde gri, sahte yollar da görünür; yalnızca yeşil rotayı takip et.'],
  keys:'Fare, dokunma ya da Tab ile gezip Enter ile seçebilirsin.',
  stats:e=>[['Hata sayısı',e.mistakes],['Ortalama tamamlama süresi',Core.fmtSec(e.avgDone)],['Hatırlanan en uzun rota',e.maxRoute?e.maxRoute+' kare':'—'],['Tamamlanan tur',`${e.done}/${e.rounds}`]],
  run(s){
    s.opts.remove();
    const ROUNDS=s.practice?1:5;let round=0;const doneTimes=[];
    Object.assign(s.extra,{maxRoute:0,done:0,rounds:ROUNDS});
    function startRound(){
      const len=s.practice?4:LEN[s.level-1],g=gridFor(len);
      const route=makeRoute(g,len);
      let decoy=[];
      if(s.level>=5&&!s.practice){
        const d=makeRoute(g,3+Math.min(3,s.level-4),new Set(route));if(d)decoy=d;
      }
      s.progress(1-round/ROUNDS);
      s.stage.innerHTML=`<div class="rgrid" style="grid-template-columns:repeat(${g},1fr)">
        ${Array.from({length:g*g},(_,i)=>`<button class="rc" data-i="${i}" aria-label="Kare ${i%g+1},${((i/g)|0)+1}"></button>`).join('')}
        <svg class="rsvg" viewBox="0 0 ${g} ${g}" preserveAspectRatio="none" aria-hidden="true"><polyline class="dec"/><polyline class="main"/></svg></div>`;
      const grid=s.stage.firstElementChild,cells=$$('.rc',grid),pl=grid.querySelector('polyline.main'),dl=grid.querySelector('polyline.dec');
      const pt=i=>`${i%g+.5},${((i/g)|0)+.5}`;
      const draw=(el,arr)=>el.setAttribute('points',arr.map(pt).join(' '));
      cells[route[0]].classList.add('st');cells[route[0]].textContent='B';
      cells[route[len-1]].classList.add('en');cells[route[len-1]].textContent='H';
      route.forEach(i=>cells[i].classList.add('on'));decoy.forEach(i=>cells[i].classList.add('decoy'));
      draw(pl,route);draw(dl,decoy);
      const showMs=Math.max(3000,5000-(s.level-1)*250);
      s.hint(`Rotayı ezberle: ${len} kare. ${Math.round(showMs/1000)} saniye sonra kaybolacak.`,true);
      let phase='show',k=1,rm=0,t0=0,lastT=0,lastCell=null,dragging=false;
      s.later(()=>{
        route.forEach(i=>cells[i].classList.remove('on'));decoy.forEach(i=>cells[i].classList.remove('decoy'));
        draw(pl,[route[0]]);draw(dl,[]);phase='input';t0=lastT=performance.now();lastCell=route[0];
        s.hint('B’den başla ve rotayı yeniden oluştur.');
      },showMs);
      function handle(i,fromDrag){
        if(phase!=='input'||i==null)return;
        if(i===route[k-1]||cells[i].classList.contains('got')||i===route[0])return;
        if(fromDrag&&!adj(i,route[k-1],g))return; /* sürüklerken köşeden kayan dokunuşları sayma */
        const now=performance.now();
        if(i===route[k]){
          cells[i].classList.add('got');s.hit({rt:now-lastT});lastT=now;k++;
          draw(pl,route.slice(0,k));
          if(k===len){
            phase='done';const tt=now-t0;doneTimes.push(tt);s.extra.done++;s.extra.maxRoute=Math.max(s.extra.maxRoute,len);
            s.stage.classList.add('good');
            s.hint(rm?`Hedefe ulaştın (${rm} hata).`:'Kusursuz! Bir sonraki rota daha uzun.',true);
            if(!rm)s.setLevel(s.level+1);
            endRound();
          }
        }else{
          rm++;s.miss();cells[i].classList.remove('wrong');void cells[i].offsetWidth;cells[i].classList.add('wrong');
          s.later(()=>cells[i].classList.remove('wrong'),450);
          if(rm>=3){
            phase='done';dragging=false;
            route.slice(k).forEach(j=>cells[j].classList.add('show'));draw(pl,route);
            s.stage.classList.add('bad');s.hint('3 hata oldu. Doğru rota kesik çizgiyle gösteriliyor.',true);
            s.setLevel(s.level-1);endRound();
          }else s.hint(`Bu kare rotada değildi. Kalan hata hakkı: ${3-rm}.`);
        }
      }
      const cellAt=e=>{const el=document.elementFromPoint(e.clientX,e.clientY);const c=el&&el.closest('.rc');return c&&grid.contains(c)?+c.dataset.i:null};
      grid.addEventListener('pointerdown',e=>{if(phase!=='input')return;e.preventDefault();dragging=true;try{grid.setPointerCapture(e.pointerId)}catch(_){}handle(cellAt(e),false)});
      grid.addEventListener('pointermove',e=>{if(!dragging)return;const i=cellAt(e);if(i!==lastCell){lastCell=i;handle(i,true)}});
      const up=()=>{dragging=false};grid.addEventListener('pointerup',up);grid.addEventListener('pointercancel',up);
      cells.forEach(c=>c.addEventListener('click',e=>{if(e.detail===0)handle(+c.dataset.i,false)}));
    }
    function endRound(){
      round++;
      s.later(()=>{
        s.stage.classList.remove('good','bad');
        if(round>=ROUNDS){s.extra.avgDone=Core.mean(doneTimes);s.extra.mistakes=s.mistakes;s.progress(0);s.end()}else startRound();
      },s.practice?2200:1500);
    }
    startRound();
  }});
})();
</script>
<script>
/* ===== 2. KURAL DEĞİŞTİ: bilişsel esneklik ===== */
(function(){
const {register,svg,rnd,quiz,S}=K;
const COL={red:{fill:'var(--c-red)',name:'KIRMIZI'},blue:{fill:'var(--c-blue)',name:'MAVİ'}};
const SHP={circle:'DAİRE',square:'KARE'};
/* Kurallar: t = hangi özelliğe bakılıyor, flip = yönler ters mi */
const RULES=[{t:'color',flip:false},{t:'color',flip:true},{t:'shape',flip:false},{t:'shape',flip:true}];
function ruleText(r,cb){
  const L=r.flip?'SAĞ':'SOL',R=r.flip?'SOL':'SAĞ';
  if(r.t==='color')return`${COL.red.name}${cb?' (çizgili)':''} → ${L}, ${COL.blue.name} → ${R}`;
  return`${SHP.circle} → ${L}, ${SHP.square} → ${R}`;
}
function answerFor(r,color,shape){
  const first=r.t==='color'?color==='red':shape==='circle';
  return(first!==r.flip)?'L':'R';
}
function stim(color,shape,cb){
  const pat=cb&&color==='red';
  const shapeSvg=shape==='circle'?'<circle cx="50" cy="50" r="40"/>':'<rect x="12" y="12" width="76" height="76" rx="6"/>';
  return`<svg viewBox="0 0 100 100" aria-label="${color==='red'?'kırmızı':'mavi'} ${shape==='circle'?'daire':'kare'}">
    ${pat?'<defs><pattern id="st" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="var(--c-red)"/><rect width="4" height="10" fill="#fff" opacity=".55"/></pattern></defs>':''}
    <g fill="${pat?'url(#st)':COL[color].fill}">${shapeSvg}</g></svg>`;
}

register({id:'kural',name:'Kural Değişti',cat:'esneklik',skill:'Bilişsel esneklik',glyph:'diamond',len:'60 saniye',maxLevel:8,
  desc:'Renkli şekilleri kurala göre sola ya da sağa ayır. Kural sessizce değişebilir; fark et ve uyum sağla.',
  tutorial:()=>['Başta kural ekranda yazar: örneğin KIRMIZI → SOL, MAVİ → SAĞ.','Ekrana gelen şekle göre olabildiğince hızlı Sol ya da Sağ’a bas.',
    'Oyun ilerledikçe kural değişir. Çoğu zaman sana söylenmez; ✓ ve ✗ işaretlerinden yeni kuralı keşfetmen gerekir.',
    'Üçüncü seviyeden sonra kural renge değil şekle göre de olabilir.'],
  keys:'Klavyede ← Sol, → Sağ.',
  stats:e=>[['Kural değişimi',e.switches],['Ortalama uyum süresi',Core.fmtSec(e.adaptAvg)],['Uyum için gereken ortalama deneme',e.adaptTrials!=null?e.adaptTrials.toFixed(1).replace('.',','):'—'],['Arka arkaya en çok doğru',e.bestCombo]],
  run(s){
    const cb=S.settings.cb;
    const st={rule:0,since:0,need:0,switchT:0,switchN:0,run:0,adapting:false,errsAfter:0,hinted:false,banner:'',flash:true};
    const adaptT=[],adaptN=[];s.extra.switches=0;
    const pool=()=>s.level>=3?[0,1,2,3]:[0,1];
    const needFor=()=>s.practice?4:Math.max(5,12-s.level)+rnd(3);
    st.need=needFor();st.banner='Kural: '+ruleText(RULES[0],cb);
    function doSwitch(){
      const opts=pool().filter(i=>i!==st.rule);st.rule=opts[rnd(opts.length)];
      st.since=0;st.need=needFor();st.switchT=performance.now();st.switchN=0;st.run=0;st.adapting=true;st.errsAfter=0;st.hinted=false;
      s.extra.switches++;
      if(s.practice||s.level<=1){st.banner='Yeni kural: '+ruleText(RULES[st.rule],cb);st.flash=true}
      else if(s.level===2){st.banner='Kural değişti! Yenisini keşfet.';st.flash=true}
      else{st.flash=false;if(st.items<5)st.banner='Kuralı aklında tut; değişirse sen fark et.'}
    }
    const OPTS=[{label:'Sol',value:'L',key:'ArrowLeft',keyLabel:'←',alt:['a','A']},{label:'Sağ',value:'R',key:'ArrowRight',keyLabel:'→',alt:['l','L']}];
    quiz(s,{duration:60000,practiceN:8,okWait:220,badWait:600,state:st,
      gen(st){
        st.items=(st.items||0)+1;
        if(!s.practice&&s.level>=3&&st.items===5){st.banner='Kuralı aklında tut; değişirse sen fark et.'}
        const color=rnd(2)?'red':'blue',shape=rnd(2)?'circle':'square';
        const correct=answerFor(RULES[st.rule],color,shape);
        const html=`<div class="rulebar${st.flash?' flash':''}">${st.banner}</div><div class="stim">${stim(color,shape,cb)}</div>`;
        st.flash=false;
        return{html,options:OPTS,correct,cap:'',explain:`Geçerli kural: ${ruleText(RULES[st.rule],cb)}.`};
      },
      after(it,right,rt,st){
        if(st.adapting){
          st.switchN++;
          if(right){st.run++;if(st.run>=3){st.adapting=false;adaptT.push(performance.now()-st.switchT);adaptN.push(st.switchN);
            if(!s.practice&&st.switchN<=6&&adaptN.length%2===0)s.setLevel(s.level+1)}}
          else{st.run=0;st.errsAfter++;
            if(st.errsAfter>=3&&!st.hinted){st.hinted=true;s.hint('İpucu: kural değişmiş olabilir.',true)}
            if(st.switchN>=12&&!s.practice)s.setLevel(s.level-1)}
        }
        if(right&&!st.adapting){st.since++;if(st.since>=st.need)doSwitch()}
      }
    });
    const origEnd=s.end.bind(s);
    s.end=()=>{s.extra.adaptAvg=Core.mean(adaptT);s.extra.adaptTrials=Core.mean(adaptN);origEnd()};
  }});
})();
</script>
<script>
/* ===== 3. ÇİFT GÖREV: bölünmüş dikkat ===== */
(function(){
const {register,svg,rnd,pick,S}=K;
const SHAPE_SVG={circle:'<circle cx="50" cy="50" r="38"/>',square:'<rect x="14" y="14" width="72" height="72" rx="6"/>',triangle:'<polygon points="50,10 92,86 8,86"/>'};
const COLORS={blue:'var(--c-blue)',red:'var(--c-red)',green:'var(--c-green)',orange:'var(--c-orange)',sky:'var(--c-sky)'};
const CNAME={blue:'mavi',red:'kırmızı',green:'yeşil',orange:'turuncu',sky:'açık mavi'};
const shapeHtml=(sh,c,outline)=>`<svg viewBox="0 0 100 100" aria-label="${CNAME[c]} ${sh==='circle'?'daire':sh==='square'?'kare':'üçgen'}">
  <g fill="${outline?'none':COLORS[c]}" stroke="${COLORS[c]}" stroke-width="${outline?10:0}">${SHAPE_SVG[sh]}</g></svg>`;

register({id:'cift',name:'Çift Görev',cat:'dikkat',skill:'Bölünmüş dikkat',glyph:'half',len:'60 saniye',maxLevel:8,
  desc:'Solda tek sayıları, sağda mavi daireleri yakala. İki görev aynı anda akıyor.',
  tutorial:()=>['Ekran ikiye bölünür ve iki taraf aynı anda, birbirinden bağımsız akar.',
    'SOL: bir sayı göründüğünde, sayı tekse sol panele dokun. Çiftse dokunma.',
    'SAĞ: bir şekil göründüğünde, yalnızca mavi daireyse sağ panele dokun.',
    'Nesneler kısa süre görünür. Hedefi kaçırmak da, hedef olmayana dokunmak da hata sayılır.',
    'İleri seviyelerde hız artar, benzer şekiller çıkar ve kurallar zaman zaman değişir; panel başlığını izle.'],
  keys:'Klavyede sol panel için ← ya da F, sağ panel için → ya da J.',
  stats:e=>[['Sol görev doğruluğu',Core.fmtPct(e.leftAcc)],['Sağ görev doğruluğu',Core.fmtPct(e.rightAcc)],['İki görevin toplam performansı',Core.fmtPct(e.combined)],['Kaçırılan hedef',e.omissions],['Yanlış dokunma',e.falseAlarms]],
  run(s){
    s.opts.remove();s.stage.classList.add('fill','nofx');
    s.stage.innerHTML=`<div class="duo">
      <button class="pane" id="pl" aria-label="Sol panel"><span class="fb"></span><span class="ph"></span><span class="pi"></span><span class="pk">← / F</span></button>
      <button class="pane" id="pr" aria-label="Sağ panel"><span class="fb"></span><span class="ph"></span><span class="pi"></span><span class="pk">→ / J</span></button></div>`;
    const P={L:{el:s.stage.querySelector('#pl')},R:{el:s.stage.querySelector('#pr')}};
    for(const k of['L','R'])Object.assign(P[k],{ph:P[k].el.querySelector('.ph'),pi:P[k].el.querySelector('.pi'),item:null,hit:0,miss:0,fa:0,cr:0,n:0});
    let leftRule='odd',rightRule='bluecircle';
    const setHeads=flash=>{
      P.L.ph.textContent=leftRule==='odd'?'Tek sayılara dokun':'Çift sayılara dokun';
      P.R.ph.textContent=rightRule==='bluecircle'?'Yalnızca mavi daireler':'Yalnızca turuncu kareler';
      if(flash)for(const k of['L','R']){P[k].el.classList.remove('ruleflash');void P[k].el.offsetWidth;P[k].el.classList.add('ruleflash')}
    };
    setHeads(false);
    const win=()=>Math.max(650,1500-(s.level-1)*110);
    const gap=()=>250+rnd(Math.max(150,600-(s.level-1)*50));
    const PRACTICE_N=6;let hitsSinceLv=0;
    function genL(){
      const target=Math.random()<.4;const big=s.level>=3;
      let v=big?10+rnd(90):1+rnd(9);
      const odd=v%2===1,want=leftRule==='odd';
      if(target!==(odd===want))v+=v>=99?-1:1;
      return{html:`<span class="num">${v}</span>`,target,desc:v};
    }
    function genR(){
      const target=Math.random()<.4;
      if(rightRule==='bluecircle'){
        if(target)return{html:shapeHtml('circle','blue'),target};
        const lures=[['circle','red'],['square','blue'],['triangle','green']];
        if(s.level>=3)lures.push(['circle','sky'],['circle','blue','outline']);
        if(s.level>=5)lures.push(['square','blue'],['circle','sky']);
        const [sh,c,o]=pick(lures);return{html:shapeHtml(sh,c,!!o),target};
      }
      if(target)return{html:shapeHtml('square','orange'),target};
      const [sh,c,o]=pick([['square','red'],['circle','orange'],['triangle','orange'],['square','orange','outline'],['square','blue']]);
      return{html:shapeHtml(sh,c,!!o),target};
    }
    function feedback(k,good){const el=P[k].el;el.classList.remove('good','bad');void el.offsetWidth;el.classList.add(good?'good':'bad');s.later(()=>el.classList.remove('good','bad'),300)}
    function spawn(k){
      if(!s.alive)return;
      const p=P[k];
      if(s.practice&&p.n>=PRACTICE_N){p.pi.innerHTML='';p.done=true;if(P.L.done&&P.R.done)s.later(()=>s.end(),600);return}
      const it=k==='L'?genL():genR();it.t0=performance.now();it.resolved=false;p.item=it;p.n++;
      p.pi.innerHTML=it.html;
      const w=s.practice?2000:win();
      it.timer=s.later(()=>resolve(k,false),w);
    }
    function resolve(k,tapped){
      const p=P[k],it=p.item;if(!it||it.resolved)return;it.resolved=true;clearTimeout(it.timer);
      const rt=performance.now()-it.t0;
      if(it.target&&tapped){p.hit++;s.hit({rt});feedback(k,true);hitsSinceLv++;
        if(s.practice)s.hint(k==='L'?'Doğru: tek sayıyı yakaladın.':'Doğru: mavi daireyi yakaladın.');}
      else if(it.target&&!tapped){p.miss++;s.miss();feedback(k,false);s.hint(k==='L'?'Soldaki hedefi kaçırdın.':'Sağdaki hedefi kaçırdın.')}
      else if(!it.target&&tapped){p.fa++;s.miss();feedback(k,false);s.hint(k==='L'?'Bu sayı hedef değildi.':'Bu şekil hedef değildi.')}
      else p.cr++;
      p.item=null;p.pi.innerHTML='';
      if(!s.practice&&hitsSinceLv>=10){
        const acc=(P.L.hit+P.L.cr+P.R.hit+P.R.cr)/Math.max(1,P.L.n+P.R.n-(P.L.item?1:0)-(P.R.item?1:0));
        hitsSinceLv=0;if(acc>=.85)s.setLevel(s.level+1);else if(acc<.6)s.setLevel(s.level-1);
      }
      s.later(()=>spawn(k),s.practice?700:gap());
    }
    const tap=k=>{if(!P[k].item){return}resolve(k,true)};
    P.L.el.addEventListener('pointerdown',e=>{e.preventDefault();tap('L')});
    P.R.el.addEventListener('pointerdown',e=>{e.preventDefault();tap('R')});
    P.L.el.addEventListener('click',e=>{if(e.detail===0)tap('L')});
    P.R.el.addEventListener('click',e=>{if(e.detail===0)tap('R')});

    s.later(()=>spawn('L'),500);s.later(()=>spawn('R'),900);

      const acc=p=>{const n=p.hit+p.miss+p.fa+p.cr;return n?(p.hit+p.cr)/n:0};
      const tot=P.L.hit+P.L.miss+P.L.fa+P.L.cr+P.R.hit+P.R.miss+P.R.fa+P.R.cr;

        combined:tot?(P.L.hit+P.L.cr+P.R.hit+P.R.cr)/tot:0});
      s.accuracy=s.extra.combined;origEnd();
    };
  }});
})();

<script>
/* ===== 5. HAFIZA HARİTASI: uzamsal hafıza ===== */
(function(){
const {register,rnd,shuffle,$$}=K;
const BASE=[{n:'Market',e:'🛒'},{n:'Park',e:'🌳'},{n:'Hastane',e:'🏥'},{n:'Okul',e:'🏫'},{n:'Kafe',e:'☕'},{n:'Kütüphane',e:'📚'},
  {n:'Fırın',e:'🥖'},{n:'Eczane',e:'💊'},{n:'Müze',e:'🏛️'},{n:'Liman',e:'⚓'},{n:'Stadyum',e:'🏟️'}];
const SIMILAR=[{n:'Süpermarket',e:'🛒'},{n:'Parkur',e:'🌲'},{n:'Kafeterya',e:'☕'},{n:'Sağlık Ocağı',e:'🏥'}];
const HOME={n:'Ev',e:'🏠'};
const VW=400,VH=300,CX=200,CY=150;
function island(){
  const pts=[];const N=18;
  for(let i=0;i<N;i++){const a=i/N*Math.PI*2,r=1+(Math.random()-.5)*.14;pts.push([CX+Math.cos(a)*180*r,CY+Math.sin(a)*128*r])}
  const mid=(i,j)=>[(pts[i%N][0]+pts[j%N][0])/2,(pts[i%N][1]+pts[j%N][1])/2];
  const m0=mid(0,1);let d=`M${m0[0].toFixed(1)},${m0[1].toFixed(1)}`;
  for(let i=1;i<=N;i++){const p=pts[i%N],m=mid(i,i+1);d+=` Q${p[0].toFixed(1)},${p[1].toFixed(1)} ${m[0].toFixed(1)},${m[1].toFixed(1)}`}
  return d+'Z';
}
function placeNodes(n){
  for(let md=66;md>36;md-=4){
    for(let tries=0;tries<60;tries++){
      const out=[];let guard=0;
      while(out.length<n&&guard++<1500){
        const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random());
        const x=CX+Math.cos(a)*150*r,y=CY+Math.sin(a)*98*r;
        if(out.every(p=>Math.hypot(p.x-x,p.y-y)>=md))out.push({x,y});
      }
      if(out.length===n)return out;
    }
  }
  return null;
}
function roads(nodes,extra){
  const n=nodes.length,E=new Set(),key=(a,b)=>a<b?a+'-'+b:b+'-'+a,d=(a,b)=>Math.hypot(nodes[a].x-nodes[b].x,nodes[a].y-nodes[b].y);
  /* minimum kapsayan ağaç: her nokta bağlı */
  const inT=new Set([0]);
  while(inT.size<n){let bst=null;for(const a of inT)for(let b=0;b<n;b++)if(!inT.has(b)&&(!bst||d(a,b)<bst[2]))bst=[a,b,d(a,b)];E.add(key(bst[0],bst[1]));inT.add(bst[1])}
  /* ek kısa yollar: dolambaçlı ve sahte seçenekler */
  const cand=[];for(let a=0;a<n;a++)for(let b=a+1;b<n;b++)if(!E.has(key(a,b)))cand.push([a,b,d(a,b)]);
  cand.sort((x,y)=>x[2]-y[2]);
  cand.slice(0,Math.min(cand.length,extra*2)).sort(()=>Math.random()-.5).slice(0,extra).forEach(([a,b])=>E.add(key(a,b)));
  return[...E].map(k=>k.split('-').map(Number));
}
function walk(n,edges,len){
  const nb=Array.from({length:n},()=>[]);edges.forEach(([a,b])=>{nb[a].push(b);nb[b].push(a)});
  for(let t=0;t<300;t++){
    const p=[0],used=new Set(p);
    while(p.length<len){const c=nb[p[p.length-1]].filter(x=>!used.has(x));if(!c.length)break;const x=c[rnd(c.length)];p.push(x);used.add(x)}
    if(p.length===len)return p;
  }
  /* yol ağında yeterince uzun basit yol yoksa, yakın komşulara izin ver */
  const p=[0];const used=new Set(p);while(p.length<len){const r=[...Array(n).keys()].filter(x=>!used.has(x));const x=r[rnd(r.length)];p.push(x);used.add(x)}return p;
}

  run(s){

    function startRound(){

      const nLoc=Math.min(12,4+lv),routeLen=Math.min(nLoc,2+Math.ceil(lv*.8)),extraRoads=lv>=2?Math.min(6,lv):0;
      let pool=shuffle(BASE.slice());

        <g class="routes"></g>

      route.forEach((ni,k)=>s.later(()=>{

      },400+k*step));
      const hold=s.practice?2500:Math.max(1200,2200-lv*120);
      /* 2) gizle ve kullanıcıdan iste */
      let k=1,wrong=0,t0=0,lastT=0,limitMs=lv>=4&&!s.practice?(12000+routeLen*2200):0;
      s.later(()=>{
        clearMarks();rt.textContent='';badge(route[0],1);phase='input';t0=lastT=performance.now();

      },400+routeLen*step+hold);
      function choose(i){
        if(phase!=='input')return;
        if(route.indexOf(i)>-1&&route.indexOf(i)<k)return;
        const now=performance.now();
        if(i===route[k]){
          s.hit({rt:now-lastT});lastT=now;rg.insertAdjacentHTML('beforeend',seg(route[k-1],i));badge(i,k+1);k++;
          if(k===routeLen){
            phase='done';times.push(now-t0);s.extra.done++;s.extra.maxRoute=Math.max(s.extra.maxRoute,routeLen);
            s.hint(wrong?`Rota tamam (${wrong} yanlış dönüş).`:'Kusursuz rota!',true);s.flash('good',600,svgEl.parentElement);
            if(!wrong)s.setLevel(s.level+1);endRound();
          }else s.hint(`Doğru. ${routeLen-k} durak kaldı.`);

          wrong++;s.extra.wrongTurns++;s.miss();

        s.hint(why+' Doğru rota gösteriliyor.',true);s.setLevel(s.level-1);endRound();

        l.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(+l.dataset.i)}});

<script>
/* ===== 6. ZİHİNSEL TETRİS: uzamsal akıl yürütme ===== */
(function(){
const {register,rnd,shuffle,$$}=K;
/* Poliomino yardımcıları: hücreler [x,y] listesi */
const norm=c=>{const mx=Math.min(...c.map(p=>p[0])),my=Math.min(...c.map(p=>p[1]));return c.map(([x,y])=>[x-mx,y-my]).sort((a,b)=>a[0]-b[0]||a[1]-b[1])};
const key=c=>norm(c).map(p=>p.join(',')).join(';');
const rot=c=>c.map(([x,y])=>[y,-x]);
const mir=c=>c.map(([x,y])=>[-x,y]);
const rots=c=>{const out=[c];for(let i=0;i<3;i++)out.push(rot(out[out.length-1]));return out.map(norm)};
function poly(n){
  const cells=[[0,0]],has=new Set(['0,0']);
  while(cells.length<n){
    const [x,y]=cells[rnd(cells.length)],[dx,dy]=[[1,0],[-1,0],[0,1],[0,-1]][rnd(4)];
    const k=(x+dx)+','+(y+dy);if(!has.has(k)){has.add(k);cells.push([x+dx,y+dy])}
  }
  return norm(cells);
}
function chiralPoly(n){
  for(let i=0;i<500;i++){const p=poly(n);const R=new Set(rots(p).map(key));if(!R.has(key(mir(p)))&&R.size>=2)return p}
  return poly(n);
}
function draw(c,fill){
  const w=Math.max(...c.map(p=>p[0]))+1,h=Math.max(...c.map(p=>p[1]))+1,S=Math.max(w,h);
  const ox=(S-w)/2,oy=(S-h)/2;
  return`<svg viewBox="-0.15 -0.15 ${S+.3} ${S+.3}" aria-hidden="true">${c.map(([x,y])=>`<rect x="${x+ox+.04}" y="${y+oy+.04}" width=".92" height=".92" rx=".14" fill="${fill}"/>`).join('')}</svg>`;
}

register({id:'tetris',name:'Zihinsel Tetris',cat:'uzamsal',skill:'Zihinsel döndürme',glyph:'tee',len:'yaklaşık 2 dakika, 10 soru',maxLevel:9,
  desc:'Bir şekli incele; kaybolunca seçenekler arasından onun döndürülmüş halini bul.',
  tutorial:()=>['Karelerden oluşan bir şekil birkaç saniye gösterilir, sonra kaybolur.',
    'Seçeneklerden yalnızca biri aynı şeklin döndürülmüş halidir.','Diğerleri ya aynadaki yansıması (döndürerek elde edilemez) ya da farklı bir şekildir.',
    'Seviye arttıkça şekiller büyür, seçenekler çoğalır ve inceleme süresi kısalır.'],
  keys:'Klavyede 1–6 tuşları seçenekleri işaretler.',
  stats:e=>[['Doğru cevap',`${e.right}/${e.rounds}`],['En uzun doğru serisi',e.bestCombo],['Aynadaki görüntüye kanma',e.mirrorPicks]],
  run(s){
    s.opts.remove();
    const ROUNDS=s.practice?2:10;let round=0,wrongRun=0,rightRun=0;
    Object.assign(s.extra,{right:0,rounds:ROUNDS,mirrorPicks:0});
    function startRound(){
      const lv=s.level,n=lv<=3?4:lv<=6?5:6,nOpt=Math.min(6,4+Math.floor((lv-1)/3)),study=s.practice?5000:Math.max(1500,4500-(lv-1)*350);
      const base=chiralPoly(n),R=rots(base),Rk=new Set(R.map(key));
      const M=rots(mir(base)),Mk=new Set(M.map(key));
      const correct=R[lv>=2?1+rnd(3):rnd(4)];
      const opts=[{c:correct,kind:'ok'}];const seen=new Set([key(correct)]);
      const nm=nOpt>=5?2:1;
      for(const m of shuffle(M.slice())){if(opts.length>nm)break;if(!seen.has(key(m))){seen.add(key(m));opts.push({c:m,kind:'mirror'})}}
      let g=0;while(opts.length<nOpt&&g++<400){
        const p=rots(poly(n))[rnd(4)],k=key(p);
        if(!seen.has(k)&&!Rk.has(k)&&!Mk.has(k)){seen.add(k);opts.push({c:p,kind:'other'})}
      }
      shuffle(opts);
      s.progress(1-round/ROUNDS);
      s.stage.innerHTML=`<div class="shapebig">${draw(base,'var(--c-sky)')}</div>`;
      s.hint(`Şekli incele (${(study/1000).toFixed(1).replace('.',',')} sn).`,true);
      s.later(()=>{
        s.stage.innerHTML=`<div class="tgrid" style="grid-template-columns:repeat(${nOpt>4?3:2},1fr)">${opts.map((o,i)=>`<button class="topt" data-i="${i}" aria-label="Seçenek ${i+1}">${draw(o.c,'var(--ink)')}</button>`).join('')}</div>`;
        s.hint('Aynı şeklin döndürülmüş hali hangisi?');
        const t0=performance.now();let done=false;
        const pickOpt=i=>{
          if(done)return;done=true;const o=opts[i],btns=$$('.topt',s.stage),rt=performance.now()-t0;
          const ci=opts.findIndex(x=>x.kind==='ok');btns[ci].classList.add('ok');
          if(o.kind==='ok'){s.hit({rt});s.extra.right++;rightRun++;wrongRun=0;s.hint(s.practice?'Doğru: bu, şeklin döndürülmüş hali.':'Doğru!',true);if(rightRun>=3){rightRun=0;s.setLevel(s.level+1)}}
          else{s.miss();btns[i].classList.add('no');rightRun=0;wrongRun++;
            if(o.kind==='mirror'){s.extra.mirrorPicks++;s.hint('Bu, aynadaki yansımasıydı; döndürerek elde edilemez.',true)}
            else s.hint('Bu farklı bir şekildi. Doğrusu yeşil çerçeveli.',true);
            if(wrongRun>=2){wrongRun=0;s.setLevel(s.level-1)}}
          round++;s.later(()=>{if(round>=ROUNDS){s.progress(0);s.end()}else startRound()},s.practice?2200:1100);
        };
        $$('.topt',s.stage).forEach(b=>b.onclick=()=>pickOpt(+b.dataset.i));
        s.key(e=>{const i=+e.key-1;if(i>=0&&i<opts.length){e.preventDefault();pickOpt(i)}});
      },study);
    }
    startRound();
  }});
})();
</script>
<script>
/* ===== 7. SAYI DEDEKTİFİ: örüntü tanıma ===== */
(function(){
const {register,rnd,pick,shuffle,quiz,S}=K;
const r=(lo,hi)=>lo+rnd(hi-lo+1);
const SYMS=['▲','■','●'];
const COLS=[{c:'var(--c-red)',n:'kırmızı'},{c:'var(--c-blue)',n:'mavi'},{c:'var(--c-green)',n:'yeşil'}];
const ARROWS=['↑','→','↓','←'];
/* Her üretici: {terms:[{t,c?}], ans:{t,c?}, lures:[{t,c?}], why} */
const GEN={
  1(){const a=r(1,12),d=r(2,9);const t=[0,1,2,3].map(i=>a+d*i);const ans=a+4*d;
    return{terms:t.map(x=>({t:x})),ans:{t:ans},lures:[ans+d,ans-1,ans+1,ans-d].map(x=>({t:x})),why:`Her adımda ${d} ekleniyor.`}},
  2(){if(rnd(2)){const a=r(1,5),q=r(2,3);const t=[0,1,2,3].map(i=>a*q**i);const ans=a*q**4;
      return{terms:t.map(x=>({t:x})),ans:{t:ans},lures:[ans+t[3],t[3]+ (t[3]-t[2]),ans-q,ans*q].map(x=>({t:x})),why:`Her adımda ${q} ile çarpılıyor.`}}
    const a=r(60,99),d=r(3,9);const t=[0,1,2,3].map(i=>a-d*i);const ans=a-4*d;
    return{terms:t.map(x=>({t:x})),ans:{t:ans},lures:[ans-d,ans+1,ans-1,ans+d].map(x=>({t:x})),why:`Her adımda ${d} çıkarılıyor.`}},
  3(){if(rnd(2)){const a=r(1,9),d=r(1,4),k=r(1,3);const t=[a];for(let i=0;i<3;i++)t.push(t[i]+d+k*i);const ans=t[3]+d+3*k;
      return{terms:t.map(x=>({t:x})),ans:{t:ans},lures:[ans-k,ans+k,t[3]+d+2*k,ans+1].map(x=>({t:x})),why:`Eklenen sayı her adımda ${k} artıyor (+${d}, +${d+k}, +${d+2*k}…).`}}
    const o=r(1,5);const t=[0,1,2,3].map(i=>(i+o)**2);const ans=(4+o)**2;
    return{terms:t.map(x=>({t:x})),ans:{t:ans},lures:[ans-1,ans+1,t[3]+(t[3]-t[2]),ans+2].map(x=>({t:x})),why:`Ardışık sayıların kareleri: ${o}², ${o+1}², ${o+2}²…`}},
  4(){if(rnd(2)){const a=r(1,6),b=r(2,5);const t=[a];for(let i=0;i<4;i++)t.push(i%2?t[i]*2:t[i]+b);const ans=t[4];
      return{terms:t.slice(0,4).map(x=>({t:x})),ans:{t:ans},lures:[t[3]*2===ans?t[3]+b:t[3]*2,ans+1,ans-1,ans+b].map(x=>({t:x})),why:`İki işlem sırayla uygulanıyor: +${b}, ×2, +${b}, ×2…`}}
    const a=r(1,5),b=r(2,6);const t=[a,b];while(t.length<5)t.push(t[t.length-1]+t[t.length-2]);const ans=t[4];t.length=4;
    return{terms:t.map(x=>({t:x})),ans:{t:ans},lures:[ans+1,ans-1,t[3]*2,t[3]+t[1]].map(x=>({t:x})),why:'Her sayı, önceki iki sayının toplamı.'}},
  5(){const cyc=rnd(2)?2:3,syms=SYMS.slice(0,cyc),a=r(1,4),q=2;const t=[0,1,2,3].map(i=>({t:syms[i%cyc]+a*q**i}));const ans={t:syms[4%cyc]+a*q**4};
    const wrongSym=syms[(4+1)%cyc];
    return{terms:t,ans,lures:[{t:wrongSym+a*q**4},{t:syms[4%cyc]+(a*q**4+a)},{t:wrongSym+(a*q**3*3)},{t:syms[4%cyc]+a*q**3*3}],why:`Şekiller sırayla dönüyor (${syms.join(' ')}), sayı her adımda ikiye katlanıyor.`}},
  6(){const syms=SYMS.slice(0,2),a=r(2,9),d=r(2,6);
    const t=[0,1,2,3].map(i=>({t:syms[i%2]+(a+d*i),c:i%3}));const ans={t:syms[0]+(a+4*d),c:4%3};
    return{terms:t,ans,lures:[{t:syms[0]+(a+4*d),c:(4+1)%3},{t:syms[1]+(a+4*d),c:4%3},{t:syms[0]+(a+5*d),c:4%3},{t:syms[1]+(a+4*d),c:(4+2)%3}],why:`Şekil ikili, renk üçlü döngüde; sayı her adımda ${d} artıyor.`}},
  7(){const dir=rnd(2)?1:3,a=r(1,5),q=rnd(2)?2:3;const t=[0,1,2,3].map(i=>({t:ARROWS[(i*dir)%4]+a*q**i,c:i%3}));
    const ans={t:ARROWS[(4*dir)%4]+a*q**4,c:4%3};
    return{terms:t,ans,lures:[{t:ARROWS[(5*dir)%4]+a*q**4,c:4%3},{t:ARROWS[(4*dir)%4]+a*q**4,c:0==4%3?1:0},{t:ARROWS[(4*dir)%4]+(a*q**4+q),c:4%3},{t:ARROWS[(3*dir)%4]+a*q**3*2,c:4%3}],
      why:`Ok her adımda ${dir===1?'saat yönünde':'saat yönünün tersine'} 90° dönüyor, renk üçlü döngüde, sayı ×${q}.`}}
};
const fmt=x=>{const cb=S.settings.cb;const c=x.c!=null?COLS[x.c]:null;
  return c?`<span style="color:${c.c}">${x.t}</span>${cb?`<small style="font-size:.45em;color:var(--muted)"> ${c.n}</small>`:''}`:String(x.t)};
const k=x=>x.t+'|'+(x.c??'');

register({id:'desen',name:'Sayı Dedektifi',cat:'problem',skill:'Örüntü tanıma',glyph:'triangle',len:'yaklaşık 2 dakika, 10 soru',maxLevel:7,
  desc:'Sayı ve sembol dizilerindeki gizli kuralı çöz, sıradaki öğeyi seç.',
  tutorial:()=>['Bir sayı dizisi göreceksin; örneğin 2 → 4 → 8 → 16 → ?','Dizinin kuralını bul ve soru işaretinin yerine gelecek öğeyi seç.',
    'İleri seviyelerde sayıyla birlikte şekil, renk ve yön de değişir; hepsine dikkat et.','Çözüm süren kaydedilir ama acele etmek zorunda değilsin.'],
  keys:'Klavyede 1–4 tuşları seçenekleri işaretler.',
  stats:e=>[['Doğru cevap',`${e.right}/${e.rounds}`],['Ulaşılan zorluk',e.maxDiff],['En uzun doğru serisi',e.bestCombo]],
  run(s){
    const ROUNDS=s.practice?2:10;let rr=0,wr=0;Object.assign(s.extra,{right:0,rounds:ROUNDS,maxDiff:s.level});
    quiz(s,{rounds:ROUNDS,practiceN:2,okWait:700,badWait:1800,showWrong:true,
      gen(){
        const g=GEN[s.level]();
        const ans=g.ans,set=new Map([[k(ans),ans]]);
        for(const l of shuffle(g.lures)){if(set.size>=4)break;if(!set.has(k(l))&&!(typeof l.t==='number'&&l.t<0))set.set(k(l),l)}
        let pad=1;while(set.size<4){const t=typeof ans.t==='number'?{t:ans.t+10*pad}:{t:ans.t+pad,c:ans.c};set.set(k(t),t);pad++}
        const opts=shuffle([...set.values()]);
        const html=`<div class="seq">${g.terms.map(fmt).join('<span class="ar">→</span>')}<span class="ar">→</span><span class="q">?</span></div>`;
        return{html,options:opts.map((o,i)=>({label:fmt(o),value:k(o),key:String(i+1),keyLabel:String(i+1)})),correct:k(ans),correctLabel:fmt(ans)+'. '+g.why,
          cap:'Sıradaki öğe hangisi?',explain:g.why};
      },
      after(it,right){
        if(right){s.extra.right++;rr++;wr=0;if(rr>=2){rr=0;s.setLevel(s.level+1);s.extra.maxDiff=Math.max(s.extra.maxDiff,s.level)}}
        else{rr=0;wr++;if(wr>=2){wr=0;s.setLevel(s.level-1)}}
      }});
  }});
})();
</script>
<script>
/* ===== 8. SAHTE HATIRA: çalışma belleği ===== */
(function(){
const {register,rnd,pick,shuffle,$$}=K;
const NAMES=[{n:'Ali',g:"Ali'nin"},{n:'Elif',g:"Elif'in"},{n:'Mert',g:"Mert'in"},{n:'Zeynep',g:"Zeynep'in"},{n:'Can',g:"Can'ın"},{n:'Deniz',g:"Deniz'in"},{n:'Ayşe',g:"Ayşe'nin"},{n:'Emre',g:"Emre'nin"}];
const COLORS=['kırmızı','mavi','yeşil','sarı','mor','turuncu'];
const CLOTHES=[{acc:'montunu',poss:'montu'},{acc:'şapkasını',poss:'şapkası'},{acc:'atkısını',poss:'atkısı'},{acc:'ceketini',poss:'ceketi'}];
const PLACES=[{dat:'parka',loc:'parkta'},{dat:'sahile',loc:'sahilde'},{dat:'pazara',loc:'pazarda'},{dat:'müzeye',loc:'müzede'},{dat:'kütüphaneye',loc:'kütüphanede'},{dat:'çarşıya',loc:'çarşıda'}];
const TRANS=['bisikletle','otobüsle','yürüyerek','tramvayla','vapurla'];
const COMP=['kardeşi','arkadaşı Selin','dedesi','kuzeni Ece','komşusu Hakan'];
const EVENTS=[
  {pos:'simit yedi',neg:'simit yemedi',q:'simit yedi mi'},{pos:'çay içti',neg:'çay içmedi',q:'çay içti mi'},
  {pos:'kahve içti',neg:'kahve içmedi',q:'kahve içti mi'},{pos:'dondurma aldı',neg:'dondurma almadı',q:'dondurma aldı mı'},
  {pos:'fotoğraf çekti',neg:'fotoğraf çekmedi',q:'fotoğraf çekti mi'},{pos:'bir kitap aldı',neg:'kitap almadı',q:'kitap aldı mı'},
  {pos:'kuşları besledi',neg:'kuşları beslemedi',q:'kuşları besledi mi'},{pos:'bir arkadaşıyla karşılaştı',neg:'kimseyle karşılaşmadı',q:'bir arkadaşıyla karşılaştı mı'}];
const TIMES=['dörtte','beşte','altıda','yedide','sekizde'];
const cap=s=>s.charAt(0).toLocaleUpperCase('tr-TR')+s.slice(1);
const OPT3=['Evet','Hayır','Bilinmiyor'];

function makeStory(level){
  const p=pick(NAMES),col=pick(COLORS),cl=pick(CLOTHES),pl=pick(PLACES),tr=pick(TRANS),cm=pick(COMP),tm=pick(TIMES);
  const ev=shuffle(EVENTS.slice());const e1=ev[0],e2=ev[1],eNeg=ev[2],eLure=ev[3],eUnk=ev[4];
  const lure=level>=3;
  const sent=[`${p.n}, ${col} ${cl.acc} giyip ${tr} ${pl.dat} gitti.`,`Yanında ${cm} vardı.`,`${cap(pl.loc)} önce ${e1.pos}, sonra ${e2.pos}.`,`Bu kez ${eNeg.neg}.`];
  if(lure)sent.push(`${cap(cm)} ise ${eLure.pos}.`);
  if(level>=5)sent.push(`Dönüş yolunda hava kararmaya başlamıştı.`);
  sent.push(`Saat ${tm} eve döndü.`);
  const Q=[];
  const mc=(q,ans,pool)=>{const o=shuffle([ans,...shuffle(pool.filter(x=>x!==ans)).slice(0,3)]);return{q,opts:o.map(cap),ans:cap(ans),kind:'mc'}};
  Q.push(mc(`${p.g} ${cl.poss} hangi renkti?`,col,COLORS));
  Q.push({q:`${p.n} ${pl.loc} ${e1.q}?`,opts:OPT3,ans:'Evet',kind:'yn'});
  Q.push({q:`${p.n} ${pl.loc} ${eUnk.q}?`,opts:OPT3,ans:'Bilinmiyor',kind:'yn',falseIf:'Evet'});
  Q.push({q:`${p.n} ${pl.loc} ${eNeg.q}?`,opts:OPT3,ans:'Hayır',kind:'yn',falseIf:'Evet'});
  const more=[mc(`${p.n} ${pl.dat} nasıl gitti?`,tr,TRANS),mc(`${p.g} yanında kim vardı?`,cm,COMP),mc(`${p.n} eve saat kaçta döndü?`,tm,TIMES),
    {q:`${p.n} ${pl.loc} ${e2.q}?`,opts:OPT3,ans:'Evet',kind:'yn'}];
  if(lure)Q.push({q:`${p.n} ${pl.loc} ${eLure.q}?`,opts:OPT3,ans:'Bilinmiyor',kind:'yn',falseIf:'Evet',lure:true});
  const nQ=level>=5?6:level>=3?5:4;
  const fixed=shuffle(Q).slice(0,Math.min(Q.length,nQ-1));
  const all=shuffle([...fixed,...shuffle(more).slice(0,nQ-fixed.length)]);
  return{text:sent.join(' '),qs:all.slice(0,nQ)};
}

register({id:'hatira',name:'Sahte Hatıra',cat:'hafiza',skill:'Çalışma belleği',glyph:'hex',len:'yaklaşık 2 dakika, 2 hikâye',maxLevel:7,
  desc:'Kısa bir hikâyeyi oku, sonra ne gerçekten anlatıldı, ne anlatılmadı ayırt et.',
  tutorial:()=>['Kısa bir hikâye göreceksin; 10–20 saniyede okuyabileceğin kadar.','Hikâye kaybolunca onunla ilgili sorular gelecek.',
    'Bazı sorular hikâyede gerçekten geçen şeyleri sorar. Bazıları ise mantıklı görünen ama hiç anlatılmamış olayları.',
    'Hikâyede geçmeyen bir şey sorulursa doğru cevap “Bilinmiyor”dur. Tahmin etme, hatırla.'],
  keys:'Klavyede 1–4 tuşları seçenekleri işaretler; okuma ekranında Enter ile sorulara geç.',
  stats:e=>[['Doğru cevap',`${e.right}/${e.total}`],['Yanlış hatırlama oranı',Core.fmtPct(e.falseRate||0)],['Geçmeyen olaya “Evet” deme',e.falseMem],['Okuma süresi (ortalama)',Core.fmtSec(e.readAvg)]],
  run(s){
    const STORIES=s.practice?1:2;let si=0;const reads=[];
    Object.assign(s.extra,{right:0,total:0,falseMem:0,falseOpp:0});
    function story(){
      const lv=s.practice?1:s.level,st=makeStory(lv);
      if(s.practice)st.qs=st.qs.slice(0,3);
      const readMs=s.practice?25000:Math.max(10000,20000-(lv-1)*1500);
      s.progress(1);
      s.stage.innerHTML=`<div class="story">${st.text}</div>`;
      s.opts.innerHTML=`<button class="opt" id="rd">Okudum, sorulara geç<kbd>Enter</kbd></button>`;
      s.hint(`Hikâye ${si+1}/${STORIES}. Dikkatle oku; ${Math.round(readMs/1000)} saniye sonra kaybolacak.`,true);
      const t0=performance.now();let gone=false;
      s.loop(()=>{if(gone)return false;const f=1-(performance.now()-t0)/readMs;s.progress(f);if(f<=0){toQs();return false}});
      function toQs(){if(gone)return;gone=true;reads.push(performance.now()-t0);ask(st,0,{right:0})}
      s.opts.querySelector('#rd').onclick=toQs;
      s.key(e=>{if(e.key==='Enter'){e.preventDefault();toQs()}});
    }
    function ask(st,qi,acc){
      if(qi>=st.qs.length){
        const a=acc.right/st.qs.length;if(!s.practice){if(a>=.8)s.setLevel(s.level+1);else if(a<.5)s.setLevel(s.level-1)}
        si++;
        s.hint(`Bu hikâyede ${st.qs.length} sorudan ${acc.right} doğru.`,true);
        s.stage.innerHTML='';s.opts.innerHTML='';
        s.later(()=>{if(si>=STORIES){finish()}else story()},1400);
        return;
      }
      const q=st.qs[qi];s.progress(1-qi/st.qs.length);
      s.stage.innerHTML=`<p class="qtext">${q.q}</p>`;
      s.opts.innerHTML=q.opts.map((o,i)=>`<button class="opt" data-v="${o}">${o}<kbd>${i+1}</kbd></button>`).join('');
      s.hint(`Soru ${qi+1}/${st.qs.length}`);
      const t0=performance.now();let done=false;
      const choose=v=>{
        if(done)return;done=true;const rt=performance.now()-t0,right=v===q.ans;
        s.extra.total++;if(q.falseIf){s.extra.falseOpp++;if(v===q.falseIf)s.extra.falseMem++}
        if(right){s.hit({rt});s.extra.right++;acc.right++}else s.miss();
        $$('.opt',s.opts).forEach(b=>{if(b.dataset.v===q.ans)b.style.borderColor='var(--good)';if(b.dataset.v===v&&!right)b.style.borderColor='var(--bad)'});
        s.hint(right?'Doğru.':(q.ans==='Bilinmiyor'?'Bu olay hikâyede hiç geçmedi; doğru cevap “Bilinmiyor”.':`Doğru cevap: ${q.ans}.`),true);
        s.later(()=>ask(st,qi+1,acc),right?650:1700);
      };
      $$('.opt',s.opts).forEach(b=>b.onclick=()=>choose(b.dataset.v));
      s.key(e=>{const i=+e.key-1;if(i>=0&&i<q.opts.length){e.preventDefault();choose(q.opts[i])}});
    }
    function finish(){
      s.extra.falseRate=s.extra.falseOpp?s.extra.falseMem/s.extra.falseOpp:0;s.extra.readAvg=Core.mean(reads);
      s.progress(0);s.end();
    }
    story();
  }});
})();
</script>
<script>

register({id:'trafik',name:'Trafik Kontrol',cat:'dikkat',skill:'Karar verme ve dikkat',glyph:'cross',len:'75 saniye',maxLevel:8,

    'Işığı değiştirmek için butona, kavşağa ya da Boşluk tuşuna bas.','Dikkat: kavşağın ortasında hâlâ araç varken ışığı değiştirirsen karşı yönden gelenlerle çarpışabilirler.',

  stats:e=>[['Kazasız geçen araç',e.passed],['Kaza',e.crashes],['Çok bekleyen araç',e.angry],['Ortalama karar süresi',Core.fmtSec(e.decAvg)],['Trafik akış verimliliği',Core.fmtPct(e.eff||0)],['Geçirilen ambulans',e.amb]],

      <line class="mark" x1="0" y1="150" x2="112" y2="150"/><line class="mark" x1="188" y1="150" x2="300" y2="150"/>
      <line class="stop" x1="120" y1="117" x2="150" y2="117"/><line class="stop" x1="150" y1="183" x2="180" y2="183"/>
      <line class="stop" x1="117" y1="150" x2="117" y2="180"/><line class="stop" x1="183" y1="120" x2="183" y2="150"/>
      <g id="lt"></g><g id="cars"></g></svg>`;
    s.opts.innerHTML=`<div class="tstatus"><span><i id="lv"></i>Kuzey–Güney: <b id="tv"></b></span><span><i id="lh"></i>Doğu–Batı: <b id="th"></b></span></div>
      <button class="opt lightbtn" id="sw">Işığı değiştir<kbd>Boşluk</kbd></button>`;
    const svgEl=s.stage.querySelector('svg'),carsG=svgEl.querySelector('#cars'),ltG=svgEl.querySelector('#lt');
    let green='v';const cars=[];
    Object.assign(s.extra,{passed:0,crashes:0,angry:0,amb:0,decisions:0});const decs=[];let spawned=0,lostCars=0,passSinceLv=0,mistakesSinceLv=0;
    const lightPos=[[112,108,'v'],[188,192,'v'],[108,188,'h'],[192,112,'h']];
    function drawLights(){
      ltG.innerHTML=lightPos.map(([x,y,a])=>{const g=a===green;return`<circle cx="${x}" cy="${y}" r="6" fill="${g?'var(--good)':'var(--bad)'}" stroke="var(--surface)" stroke-width="2"/>${g?'':`<line x1="${x-3}" y1="${y}" x2="${x+3}" y2="${y}" stroke="#fff" stroke-width="2"/>`}`}).join('');
      s.opts.querySelector('#lv').className=green==='v'?'go':'no';s.opts.querySelector('#lh').className=green==='h'?'go':'no';
      s.opts.querySelector('#tv').textContent=green==='v'?'GEÇ':'DUR';s.opts.querySelector('#th').textContent=green==='h'?'GEÇ':'DUR';
    }
    drawLights();
    function toggle(){
      if(!s.alive)return;
      const next=green==='v'?'h':'v';const now=performance.now();
      const waiting=cars.filter(c=>c.lane.axis===next&&c.waitStart);
      if(waiting.length){const rt=now-Math.min(...waiting.map(c=>c.waitStart));decs.push(rt);s.addRt(rt)}
      s.extra.decisions++;green=next;drawLights();
    }
    s.opts.querySelector('#sw').onclick=toggle;
    svgEl.addEventListener('pointerdown',e=>{e.preventDefault();toggle()});
    s.key(e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();toggle()}});
    const speed=()=>(s.practice?45:55)+(s.level-1)*7;
    const rate=()=>s.practice?.55:.75+(s.level-1)*.18;
    const patience=()=>Math.max(4500,9000-(s.level-1)*500);
    function spawn(lane){
      const inLane=cars.filter(c=>c.lane===lane);
      if(inLane.some(c=>c.s<CAR+GAP+6))return;
      const amb=!s.practice&&s.level>=2&&Math.random()<.05+s.level*.01;
      const el=document.createElementNS(NS,'g');el.setAttribute('class','car');
      el.innerHTML=amb
        ?`<rect x="-18" y="-7" width="18" height="14" rx="3" fill="#fff" stroke="var(--bad)" stroke-width="1.5"/><text x="-9" y="4" text-anchor="middle" font-size="10" fill="var(--bad)" font-weight="700">✚</text>`
        :`<rect x="-18" y="-7" width="18" height="14" rx="3" fill="${pick(PAL)}"/><rect x="-6" y="-5" width="4" height="10" rx="1" fill="#fff" opacity=".6"/>`;
      carsG.appendChild(el);
      cars.push({lane,s:0,amb,el,waitStart:null,angry:false,counted:false});spawned++;
    }
    const pos=c=>[c.lane.x+c.lane.dx*c.s,c.lane.y+c.lane.dy*c.s];
    const inBox=c=>c.s>IN&&c.s-CAR<210;
    function remove(c){const i=cars.indexOf(c);if(i>-1)cars.splice(i,1);c.el.remove()}
    function crash(){
      const hit=cars.filter(inBox);s.extra.crashes++;lostCars+=hit.length;mistakesSinceLv++;
      s.miss({penalty:30});s.hint('Kaza! Kavşak boşalmadan ışığı değiştirme.',true);
      hit.forEach(c=>{c.dead=true;c.el.classList.add('crash');const i=cars.indexOf(c);if(i>-1)cars.splice(i,1);s.later(()=>c.el.remove(),700)});
    }
    s.loop(dt=>{
      const now=performance.now();
      for(const L of LANES)if(Math.random()<dt*rate()/4)spawn(L);
      for(const L of LANES){
        const lc=cars.filter(c=>c.lane===L).sort((a,b)=>b.s-a.s);
        lc.forEach((c,i)=>{
          const v=speed()*(c.amb?1.25:1);let lim=Infinity;
          if(i>0)lim=lc[i-1].s-CAR-GAP;
          const red=L.axis!==green;
          if(red&&c.s<=STOP+.5)lim=Math.min(lim,STOP);
          const ns=Math.max(c.s,Math.min(c.s+v*dt,lim));
          const blocked=ns-c.s<v*dt*.2;
          if(blocked&&red&&c.s>=STOP-(CAR+GAP)*6){if(!c.waitStart)c.waitStart=now}else if(!blocked)c.waitStart=null;
          c.s=ns;
          if(c.waitStart&&!c.angry&&now-c.waitStart>(c.amb?2500:patience())){
            c.angry=true;s.extra.angry++;mistakesSinceLv++;s.miss({penalty:c.amb?20:10});
            s.hint(c.amb?'Ambulans çok bekledi!':'Bir sürücü çok bekledi.',true);
            const t=document.createElementNS(NS,'text');t.setAttribute('x','-9');t.setAttribute('y','-10');t.setAttribute('text-anchor','middle');t.setAttribute('font-size','12');t.setAttribute('font-weight','800');t.setAttribute('fill','var(--bad)');t.textContent='!';c.el.appendChild(t);
          }
          const [x,y]=pos(c);c.el.setAttribute('transform',`translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${L.ang})`);
          if(!c.counted&&c.s-CAR>210){c.counted=true;s.extra.passed++;passSinceLv++;if(c.amb)s.extra.amb++;s.hit({points:c.amb?30:10,sound:false})}
          if(c.s>GONE)remove(c);
        });
      }
      const vIn=cars.some(c=>c.lane.axis==='v'&&inBox(c)),hIn=cars.some(c=>c.lane.axis==='h'&&inBox(c));
      if(vIn&&hIn)crash();
      if(!s.practice&&passSinceLv>=15){if(mistakesSinceLv<=1)s.setLevel(s.level+1);passSinceLv=0;mistakesSinceLv=0}
    });
    if(s.practice){s.timer(25000);s.hint('Deneme turu: araçlar yavaş. Işığı değiştirmeyi dene.')}else s.timer(75000);
    const origEnd=s.end.bind(s);
    s.end=()=>{
      const e=s.extra;e.decAvg=Core.mean(decs);
      e.eff=(e.passed+lostCars+e.angry)?e.passed/(e.passed+lostCars+e.angry):0;
      s.accuracy=e.eff;origEnd();
    };
  }});
})();
</script>
<script>
/* ===== 10. DEĞİŞENİ BUL: görsel hafıza ===== */
(function(){
const {register,rnd,pick,shuffle,$$,S}=K;
const SH=['circle','square','triangle','diamond','star'];
const SHP={circle:'<circle cx="50" cy="50" r="40"/>',square:'<rect x="12" y="12" width="76" height="76" rx="8"/>',triangle:'<polygon points="50,8 94,88 6,88"/>',
  diamond:'<polygon points="50,4 96,50 50,96 4,50"/>',star:'<polygon points="50,6 62,38 96,38 68,58 79,92 50,72 21,92 32,58 4,38 38,38"/>'};
const COL=['var(--c-blue)','var(--c-orange)','var(--c-green)','var(--c-red)','var(--c-pink)'];
const SIMILAR_COL={0:5,5:0};/* mavi ↔ açık mavi (ileri seviye) */
const COLX=[...COL,'var(--c-sky)'];
const TYPES_TR={pos:'yeri',color:'rengi',size:'boyutu',shape:'şekli'};

register({id:'degisen',name:'Değişeni Bul',cat:'hafiza',skill:'Görsel hafıza',glyph:'ring',len:'yaklaşık 2 dakika, 8 tur',maxLevel:9,
  desc:'Bir sahneyi ezberle; tekrar göründüğünde değişen nesneyi bul.',
  tutorial:()=>['Birkaç saniye boyunca şekillerden oluşan bir sahne göreceksin.','Sahne kısa bir an kaybolur, sonra geri gelir.',
    'Bu arada bir nesnenin yeri, rengi, boyutu ya da şekli değişmiştir. Değişen nesneye dokun.',
    'İleri seviyelerde nesne sayısı artar, değişiklikler incelir ve birden fazla nesne değişebilir.'],
  stats:e=>[['Ortalama bulma süresi',Core.fmtSec(e.avgFind)],['Yanlış tıklama',e.wrong],['Bulunan değişiklik',`${e.found}/${e.total}`]],
  run(s){
    s.opts.remove();s.stage.classList.add('fill','nofx');
    const ROUNDS=s.practice?1:8;let round=0;const finds=[];
    Object.assign(s.extra,{wrong:0,found:0,total:0});
    s.stage.innerHTML='<div class="field" role="group" aria-label="Sahne"></div>';
    const field=s.stage.firstElementChild;
    function startRound(){
      const lv=s.practice?1:s.level;
      const n=Math.min(16,4+lv),cols=lv>=6?5:4,rows=Math.ceil((n+3)/cols);
      const showMs=s.practice?6000:Math.max(2500,5000-(lv-1)*300);
      const k=lv>=7?2:1;
      const types=['pos','size','shape'];if(!S.settings.cb)types.push('color');
      const cells=shuffle([...Array(cols*rows).keys()]);
      const objs=cells.slice(0,n).map(c=>({c,sh:pick(SH),col:rnd(COL.length),big:Math.random()<.5}));
      const free=cells.slice(n);
      const W=field.clientWidth,H=field.clientHeight,cw=W/cols,ch=H/rows,cell=Math.min(cw,ch);
      const render=(list,interactive)=>{
        field.innerHTML=list.map((o,i)=>{const sz=cell*(o.big?.62:.4)*(o.fine?1.12:1);const x=(o.c%cols+.5)*cw,y=(((o.c/cols)|0)+.5)*ch;const hit=Math.max(44,sz);
          return`<button class="fi" data-i="${i}" ${interactive?'':'tabindex="-1"'} style="left:${x}px;top:${y}px;width:${hit}px;height:${hit}px" aria-label="Nesne ${i+1}">
          <svg viewBox="0 0 100 100" style="width:${sz}px;height:${sz}px" fill="${COLX[o.col]}">${SHP[o.sh]}</svg></button>`}).join('');
      };
      s.progress(1-round/ROUNDS);
      render(objs,false);s.hint(`Sahneyi ezberle (${(showMs/1000).toFixed(1).replace('.',',')} sn).`,true);
      s.later(()=>{
        field.innerHTML='<div class="blank" style="position:absolute;inset:0">…</div>';s.hint('');
        s.later(()=>{
          const after=objs.map(o=>({...o}));const changed=new Set(),descr=[];
          for(const i of shuffle([...Array(n).keys()]).slice(0,k)){
            const o=after[i],ty=pick(types);changed.add(i);descr.push(ty);
            if(ty==='pos'&&free.length)o.c=free.splice(rnd(free.length),1)[0];
            else if(ty==='color'){o.col=lv>=5&&SIMILAR_COL[o.col]!=null?SIMILAR_COL[o.col]:(o.col+1+rnd(COL.length-1))%COL.length}
            else if(ty==='size'){if(lv>=5){o.fine=true}else o.big=!o.big}
            else{const opts=SH.filter(x=>x!==o.sh);o.sh=lv>=5?({circle:'star',square:'diamond',diamond:'square',triangle:'star',star:'circle'})[o.sh]:pick(opts)}
          }
          render(after,true);s.stage.classList.add('nofx');
          s.hint(k>1?`${k} nesne değişti. Hepsini bul.`:'Hangi nesne değişti?');
          s.extra.total+=k;
          const t0=performance.now(),limit=s.practice?30000:Math.max(8000,15000-lv*600);let got=0,over=false;
          s.loop(()=>{if(over)return false;const f=1-(performance.now()-t0)/limit;s.progress(f);if(f<=0){over=true;
            changed.forEach(i=>{const b=field.querySelector(`[data-i="${i}"]`);if(b&&!b.classList.contains('ok'))b.classList.add('reveal')});
            s.miss();s.hint('Süre doldu. Değişen nesne kesik çizgiyle gösteriliyor.',true);s.setLevel(s.level-1);next();return false}});
          let wrongHere=0;
          field.onclick=e=>{
            const b=e.target.closest('.fi');if(!b||over)return;const i=+b.dataset.i;
            if(b.classList.contains('ok')||b.classList.contains('x'))return;
            if(changed.has(i)){
              const rt=performance.now()-t0;finds.push(rt);got++;s.extra.found++;s.hit({rt});b.classList.add('ok');
              if(got===k){over=true;s.hint(`Buldun: ${descr.map(d=>TYPES_TR[d]).join(' ve ')} değişmişti.`,true);if(!wrongHere)s.setLevel(s.level+1);next()}
            }else{wrongHere++;s.extra.wrong++;s.miss();b.classList.add('x');if(wrongHere>=3){s.setLevel(s.level-1)}}
          };
        },900);
      },showMs);
    }
    function next(){round++;s.later(()=>{if(round>=ROUNDS){s.extra.avgFind=Core.mean(finds);s.progress(0);s.end()}else startRound()},s.practice?2200:1400)}
    s.later(startRound,250);
  }});
})();
</script>
<script>
/* ===== SUDOKU: mantık ve problem çözme ===== */
(function(){
const {register,rnd,shuffle,$$,SHAPES}=K;
SHAPES.sudoku='<rect x="8" y="8" width="84" height="84" rx="10"/><path d="M36 8v84M64 8v84M8 36h84M8 64h84" stroke="#fff" stroke-width="5" opacity=".75"/>';
/* Seviyeye göre boyut: kısa oturumlar için düşük seviyelerde 4×4 ve 6×6 */
const CFG=lv=>lv<=2?{n:4,bw:2,bh:2,blanks:lv===1?6:9,count:3}
  :lv<=4?{n:6,bw:3,bh:2,blanks:lv===3?16:20,count:2}
  :{n:9,bw:3,bh:3,blanks:[38,44,49,53,56][lv-5]||56,count:1};

function cands(g,n,bw,bh,i){
  const r=(i/n)|0,c=i%n;let used=0;
  for(let k=0;k<n;k++){used|=1<<g[r*n+k];used|=1<<g[k*n+c]}
  const br=Math.floor(r/bh)*bh,bc=Math.floor(c/bw)*bw;
  for(let dr=0;dr<bh;dr++)for(let dc=0;dc<bw;dc++)used|=1<<g[(br+dr)*n+bc+dc];
  const out=[];for(let v=1;v<=n;v++)if(!(used>>v&1))out.push(v);return out;
}
function bestEmpty(g,n,bw,bh){
  let bi=-1,bc=null;
  for(let i=0;i<g.length;i++)if(!g[i]){const c=cands(g,n,bw,bh,i);if(!bc||c.length<bc.length){bi=i;bc=c;if(c.length<=1)break}}
  return[bi,bc];
}
function fill(g,n,bw,bh){
  const[i,c]=bestEmpty(g,n,bw,bh);if(i<0)return true;
  for(const v of shuffle(c)){g[i]=v;if(fill(g,n,bw,bh))return true}
  g[i]=0;return false;
}
function count(g,n,bw,bh,limit){
  const[i,c]=bestEmpty(g,n,bw,bh);if(i<0)return 1;
  let t=0;for(const v of c){g[i]=v;t+=count(g,n,bw,bh,limit);if(t>=limit)break}
  g[i]=0;return t;
}
/* Tek çözümlü bulmaca üretir */
function makePuzzle(cfg){
  const {n,bw,bh}=cfg;const sol=new Array(n*n).fill(0);fill(sol,n,bw,bh);
  const puz=sol.slice();let removed=0;
  for(const i of shuffle([...Array(n*n).keys()])){
    if(removed>=cfg.blanks)break;
    const v=puz[i];puz[i]=0;
    if(count(puz.slice(),n,bw,bh,2)!==1)puz[i]=v;else removed++;
  }
  return{sol,puz};
}

register({id:'sudoku',name:'Sudoku',cat:'problem',skill:'Mantıksal akıl yürütme',glyph:'sudoku',len:'yaklaşık 2–4 dakika',maxLevel:9,
  desc:'Her satır, sütun ve kutuda her rakam bir kez. Kolay 4×4’ten zor 9×9’a kadar.',
  tutorial:()=>['Boş kareleri öyle doldur ki her satırda, her sütunda ve kalın çizgili her kutuda her rakam yalnızca bir kez bulunsun.',
    'Bir kareye dokun, sonra alttaki tuşlardan bir rakam seç.','Doğru rakam yerine yerleşir. Yanlış rakam hata sayılır ve kırmızıyla gösterilip silinir.',
    'Seviye 1–2’de 4×4, 3–4’te 6×6, sonrasında 9×9 bulmacalar gelir; boşluk sayısı seviyeyle artar.'],
  keys:'Klavyede rakam tuşları sayı girer, ok tuşları kareler arasında gezer.',
  stats:e=>[['Bulmaca boyutu',e.size],['Ortalama çözüm süresi',Core.fmtSec(e.avgTime)],['Hatalı giriş',e.wrong],['Tamamlanan bulmaca',`${e.done}/${e.total}`]],
  run(s){
    const total=s.practice?1:CFG(s.level).count;let done=0;const times=[];
    Object.assign(s.extra,{wrong:0,done:0,total,size:''});
    function start(){
      const cfg=s.practice?{n:4,bw:2,bh:2,blanks:4}:CFG(s.level);
      const {n,bw,bh}=cfg;const {sol,puz}=makePuzzle(cfg);
      s.stage.__test=sol;
      s.extra.size=s.extra.size&&s.extra.size!==`${n}×${n}`?s.extra.size+', '+`${n}×${n}`:`${n}×${n}`;
      const cur=puz.slice(),given=puz.map(v=>v>0);let sel=-1,pm=0;
      s.progress(1-done/total);
      s.stage.innerHTML=`<div class="sudoku" role="grid" aria-label="Sudoku ${n}×${n}" style="grid-template-columns:repeat(${n},1fr)">${cur.map((v,i)=>{
        const r=(i/n)|0,c=i%n,cls=['sc',given[i]?'given':'',(c+1)%bw===0&&c<n-1?'bR':'',(r+1)%bh===0&&r<n-1?'bB':''].join(' ');
        return`<button class="${cls}" data-i="${i}" aria-label="Satır ${r+1}, sütun ${c+1}">${v||''}</button>`}).join('')}</div>`;
      const cells=$$('.sc',s.stage);
      s.opts.innerHTML=`<div class="numpad" style="grid-template-columns:repeat(${n<=6?n:5},1fr)">${Array.from({length:n},(_,k)=>`<button class="nk" data-v="${k+1}">${k+1}<small></small></button>`).join('')}</div>`;
      const keys=$$('.nk',s.opts);
      const box=i=>Math.floor(((i/n)|0)/bh)*(n/bw)+Math.floor((i%n)/bw);
      function paint(){
        const sv=sel>=0?cur[sel]:0;
        cells.forEach((el,i)=>{
          const peer=sel>=0&&i!==sel&&(((i/n)|0)===((sel/n)|0)||i%n===sel%n||box(i)===box(sel));
          el.classList.toggle('sel',i===sel);el.classList.toggle('peer',peer);
          el.classList.toggle('same',!!sv&&cur[i]===sv&&i!==sel);
        });
        keys.forEach(k=>{const v=+k.dataset.v,left=n-cur.filter(x=>x===v).length;k.querySelector('small').textContent=left?left+' kaldı':'';k.disabled=!left});
      }
      function select(i){sel=i;paint()}
      const firstEmpty=()=>cur.findIndex(v=>!v);
      select(firstEmpty());
      let lastT=performance.now();const t0=lastT;
      function input(v){
        if(sel<0||given[sel]||cur[sel])return;
        const now=performance.now();
        if(v===sol[sel]){
          cur[sel]=v;cells[sel].textContent=v;s.hit({rt:now-lastT});lastT=now;
          if(cur.every(x=>x)){finish(now-t0);return}
          if(s.practice)s.hint('Doğru. Satırda, sütunda ve kutuda eksik olan rakamı ara.');
          paint();
        }else{
          s.miss();s.extra.wrong++;pm++;const el=cells[sel],keep=sel;
          el.textContent=v;el.classList.remove('bad');void el.offsetWidth;el.classList.add('bad');
          s.hint(`${v} buraya uymuyor: aynı satırda, sütunda ya da kutuda zaten var veya çözüme uymuyor.`,true);
          s.later(()=>{if(!cur[keep]){el.textContent=''}el.classList.remove('bad')},700);
        }
      }
      function finish(ms){
        done++;s.extra.done=done;times.push(ms);
        s.bonus(20*n+(pm<=1?10*s.level:0));
        cells.forEach(c=>c.classList.remove('sel','peer','same'));
        s.hint(pm?`Bulmaca tamam (${pm} hata).`:'Kusursuz çözüm!',true);
        if(pm<=1)s.setLevel(s.level+1);else if(pm>=6)s.setLevel(s.level-1);
        s.later(()=>{if(done>=total){s.extra.avgTime=Core.mean(times);s.progress(0);s.end()}else start()},1600);
      }
      cells.forEach(c=>c.onclick=()=>select(+c.dataset.i));
      keys.forEach(k=>k.onclick=()=>input(+k.dataset.v));
      s.key(e=>{
        const v=+e.key;if(v>=1&&v<=n){e.preventDefault();input(v);return}
        const mv={ArrowLeft:-1,ArrowRight:1,ArrowUp:-n,ArrowDown:n}[e.key];
        if(mv!=null){e.preventDefault();let i=sel<0?0:sel+mv;if(i<0||i>=n*n)return;if((mv===1&&i%n===0)||(mv===-1&&sel%n===0))return;select(i)}
      });
      if(!s.practice)s.hint(`${n}×${n} bulmaca. ${done+1}/${total}`);else s.hint('Deneme: işaretli kareye hangi rakam gelir? Satırda ve kutuda eksik olanı bul.');
    }
    start();
  }});
})();
</script>
<script>
/* ===== KELİME BULMACASI: sözel akıl yürütme ===== */
(function(){
const {register,rnd,shuffle,$,$$,SHAPES}=K;
SHAPES.letters='<rect x="6" y="6" width="40" height="40" rx="6"/><rect x="54" y="6" width="40" height="40" rx="6" opacity=".45"/><rect x="6" y="54" width="40" height="40" rx="6" opacity=".45"/><rect x="54" y="54" width="40" height="40" rx="6"/>';
const BANK=[
['ELMA','Kırmızı ya da yeşil olabilen sonbahar meyvesi'],['KALEM','Yazı yazmaya yarayan araç'],['DENİZ','Tuzlu sudan oluşan geniş su kütlesi'],
['GÜNEŞ','Dünya’ya ısı ve ışık veren yıldız'],['KİTAP','Ciltlenmiş sayfalardan oluşan eser'],['OKUL','Eğitim verilen kurum'],
['BULUT','Gökyüzündeki su buharı kümesi'],['YAĞMUR','Buluttan düşen su damlaları'],['ORMAN','Ağaçlarla kaplı geniş alan'],

['RÜZGÂR','Hava akımı'],['TİYATRO','Oyuncuların sahnede oyun sergilediği sanat'],['MÜZE','Tarihi ve sanatsal eserlerin sergilendiği yer'],
['KÜTÜPHANE','Kitapların toplandığı ve okunduğu yer'],['DEFTER','Yazı yazmak için ciltlenmiş boş sayfalar'],['SİLGİ','Kalem izini silen araç'],
['ŞEMSİYE','Yağmurdan korunmak için açılan araç'],['ÇANTA','Eşya taşımaya yarayan, saplı kap'],['PASTA','Doğum günlerinde kesilen tatlı'],
['ÇORBA','Kaşıkla içilen sulu yemek'],['EKMEK','Undan yapılan temel besin'],['SÜT','İneklerden elde edilen beyaz içecek']
].map(([w,c])=>({w:Array.from(w.replace('Â','A')),c}));
const LETTERS=Array.from('ABCÇDEFGĞHIİJKLMNOÖPRSŞTUÜVYZ');
const K_=(x,y)=>x+','+y;

function build(target,maxLen,maxDim){
  let bestRes=null;
  for(let attempt=0;attempt<40;attempt++){
    const pool=shuffle(BANK.filter(b=>b.w.length>=3&&b.w.length<=maxLen));
    const G=new Map(),placed=[];let minX=0,maxX=0,minY=0,maxY=0;
    const put=(b,x,y,d)=>{const dx=d?0:1,dy=d?1:0;b.w.forEach((ch,i)=>{const k=K_(x+dx*i,y+dy*i);const g=G.get(k)||{ch,d:new Set()};g.d.add(d);G.set(k,g)});
      placed.push({...b,x,y,d});minX=Math.min(minX,x);minY=Math.min(minY,y);maxX=Math.max(maxX,x+dx*(b.w.length-1));maxY=Math.max(maxY,y+dy*(b.w.length-1))};
    const check=(w,x,y,d)=>{
      const dx=d?0:1,dy=d?1:0,L=w.length;
      if(G.get(K_(x-dx,y-dy))||G.get(K_(x+dx*L,y+dy*L)))return-1;
      if(Math.max(maxX,x+dx*(L-1))-Math.min(minX,x)+1>maxDim||Math.max(maxY,y+dy*(L-1))-Math.min(minY,y)+1>maxDim)return-1;
      let cross=0;
      for(let i=0;i<L;i++){const cx=x+dx*i,cy=y+dy*i,g=G.get(K_(cx,cy));
        if(g){if(g.ch!==w[i]||g.d.has(d))return-1;cross++}
        else if(G.get(K_(cx+dy,cy+dx))||G.get(K_(cx-dy,cy-dx)))return-1;}
      return cross;
    };
    put(pool[0],0,0,rnd(2));
    for(const b of pool.slice(1)){
      if(placed.length>=target)break;
      const opts=[];
      for(const [k,g] of G){const [gx,gy]=k.split(',').map(Number);
        b.w.forEach((ch,i)=>{if(ch!==g.ch)return;for(const d of[0,1]){if(g.d.has(d))continue;const x=d?gx:gx-i,y=d?gy-i:gy;const c=check(b.w,x,y,d);if(c>0)opts.push([c,x,y,d])}});}
      if(!opts.length)continue;
      opts.sort((a,c)=>c[0]-a[0]);const top=opts.filter(o=>o[0]===opts[0][0]);const [,x,y,d]=top[rnd(top.length)];
      put(b,x,y,d);
    }
    if(!bestRes||placed.length>bestRes.placed.length)bestRes={placed,minX,minY,W:maxX-minX+1,H:maxY-minY+1};
    if(placed.length>=target)break;
  }
  const r=bestRes;r.placed.forEach(p=>{p.x-=r.minX;p.y-=r.minY});
  /* numaralandırma: yukarıdan aşağı, soldan sağa */
  const starts=[...new Set(r.placed.map(p=>K_(p.x,p.y)))].map(k=>k.split(',').map(Number)).sort((a,b)=>a[1]-b[1]||a[0]-b[0]);
  r.placed.forEach(p=>p.num=starts.findIndex(([x,y])=>x===p.x&&y===p.y)+1);
  return r;
}

register({id:'bulmaca',name:'Kelime Bulmacası',cat:'problem',skill:'Sözel akıl yürütme',glyph:'letters',len:'yaklaşık 2–3 dakika',maxLevel:8,
  desc:'İpuçlarından kelimeleri bul, kesişen kutulara yerleştir. Her oyunda yeni bir bulmaca.',
  tutorial:()=>['Kutulara soldan sağa (yatay) ve yukarıdan aşağı (dikey) kelimeler yerleşir; kesişen kutular iki kelimede ortaktır.',
    'Bir kutuya dokununca o kelimenin ipucu görünür. Aynı kutuya yeniden dokunursan yön değişir.',
    'Harfleri alttaki klavyeden ya da kendi klavyenden yaz. Kelime dolunca kontrol edilir: doğruysa yeşile döner, yanlışsa hatalı harfler silinir.',
    'Takılırsan “Harf aç” ile bir harf görebilirsin; bu biraz puan götürür. Seviye arttıkça kelime sayısı ve uzunluğu artar.'],
  keys:'Klavyeden doğrudan harf yazabilirsin; Backspace siler, Tab sonraki kelimeye geçer.',
  stats:e=>[['Çözülen kelime',`${e.solved}/${e.words}`],['Yanlış deneme',e.wrongTries],['Açılan harf',e.hints],['Toplam süre',Core.fmtSec(e.time)]],
  run(s){
    const lv=s.practice?1:s.level;
    const target=s.practice?3:Math.min(10,3+lv),maxLen=s.practice?5:lv<=2?6:lv<=4?8:10,maxDim=s.practice?7:Math.min(12,7+lv);
    const P=build(target,maxLen,maxDim);const words=P.placed;
    s.stage.__test=words.map(w=>({x:w.x,y:w.y,d:w.d,w:w.w.join('')}));
    Object.assign(s.extra,{solved:0,words:words.length,wrongTries:0,hints:0});
    const cell={};
    words.forEach((w,wi)=>w.w.forEach((ch,i)=>{const k=K_(w.x+(w.d?0:i),w.y+(w.d?i:0));cell[k]=cell[k]||{sol:ch,val:'',words:[],locked:false};cell[k].words[w.d]=wi}));
    const nums={};words.forEach(w=>nums[K_(w.x,w.y)]=w.num);
    let grid='';
    for(let y=0;y<P.H;y++)for(let x=0;x<P.W;x++){const k=K_(x,y);grid+=cell[k]?`<button class="cwc" data-k="${k}" aria-label="Kutu">${nums[k]?`<small>${nums[k]}</small>`:''}<span></span></button>`:'<span class="cwc blk"></span>'}
    const clueList=d=>words.map((w,i)=>[w,i]).filter(([w])=>w.d===d).sort((a,b)=>a[0].num-b[0].num)
      .map(([w,i])=>`<button data-w="${i}">${w.num}. ${w.c} <span style="color:var(--muted)">(${w.w.length})</span></button>`).join('');
    s.stage.innerHTML=`<div class="cwwrap"><div class="cw" style="grid-template-columns:repeat(${P.W},1fr);width:min(94vw,${Math.min(440,P.W*46)}px)">${grid}</div>
      <div class="clues"><div><h4>Soldan sağa</h4>${clueList(0)}</div><div><h4>Yukarıdan aşağı</h4>${clueList(1)}</div></div></div>`;
    s.stage.classList.add('nofx');
    $$('.cwc[data-k]',s.stage).forEach(b=>cell[b.dataset.k].el=b);
    s.opts.style.display='block';
    s.opts.innerHTML=`<p class="curclue"></p><div class="kbd">${LETTERS.map(l=>`<button data-l="${l}">${l}</button>`).join('')}<button data-l="⌫" aria-label="Sil">⌫</button></div>
      <div class="row" style="justify-content:center;margin-top:8px"><button class="link" id="hintb">Harf aç</button></div>`;
    const cluesEl=$$('.clues button',s.stage),cc=s.opts.querySelector('.curclue');
    let wsel=0,ksel=null;const wStart={};const t0=performance.now();
    const cellsOf=wi=>{const w=words[wi];return w.w.map((_,i)=>K_(w.x+(w.d?0:i),w.y+(w.d?i:0)))};
    const solved=new Set();
    function paint(){
      const ws=new Set(cellsOf(wsel));
      for(const k in cell){const c=cell[k];c.el.classList.toggle('word',ws.has(k));c.el.classList.toggle('sel',k===ksel);c.el.querySelector('span').textContent=c.val}
      cluesEl.forEach(b=>{const i=+b.dataset.w;b.classList.toggle('cur',i===wsel);b.classList.toggle('done',solved.has(i))});
      const w=words[wsel];cc.textContent=`${w.num} ${w.d?'Yukarıdan aşağı':'Soldan sağa'}: ${w.c} (${w.w.length} harf)`;
    }
    function selectWord(wi,k){
      wsel=wi;const cs=cellsOf(wi);ksel=k||cs.find(x=>!cell[x].val&&!cell[x].locked)||cs[0];
      if(wStart[wi]==null)wStart[wi]=performance.now();paint();
    }
    function nextOpenWord(){for(let j=1;j<=words.length;j++){const i=(wsel+j)%words.length;if(!solved.has(i))return i}return-1}
    function tapCell(k){
      const c=cell[k];
      if(k===ksel&&c.words[0]!=null&&c.words[1]!=null){selectWord(c.words[wsel===c.words[0]?1:0],k);return}
      const prefer=words[wsel].d;selectWord(c.words[prefer]!=null?c.words[prefer]:c.words[1-prefer],k);
    }
    function checkWord(wi){
      if(solved.has(wi))return;const cs=cellsOf(wi);if(!cs.every(k=>cell[k].val))return;
      const ok=cs.every(k=>cell[k].val===cell[k].sol);
      if(ok){
        solved.add(wi);s.extra.solved++;cs.forEach(k=>{cell[k].locked=true;cell[k].el.classList.add('ok')});
        s.hit({rt:performance.now()-(wStart[wi]||t0),points:10+words[wi].w.length*3+2*(lv-1)});
        if(solved.size===words.length){finish();return true}
      }else{
        s.extra.wrongTries++;s.miss();
        cs.forEach(k=>{const c=cell[k];if(!c.locked&&c.val!==c.sol){c.el.classList.remove('bad');void c.el.offsetWidth;c.el.classList.add('bad');const kk=k;s.later(()=>{cell[kk].val='';cell[kk].el.classList.remove('bad');paint()},550)}});
        s.hint('Bu kelimede yanlış harf var; hatalı harfler siliniyor.',true);
      }
      return ok;
    }
    function type(L){
      if(!ksel)return;
      if(L==='⌫'){
        const cs=cellsOf(wsel);let i=cs.indexOf(ksel);
        if(cell[ksel].val&&!cell[ksel].locked){cell[ksel].val=''}else{while(i>0){i--;if(!cell[cs[i]].locked){cell[cs[i]].val='';ksel=cs[i];break}}}
        paint();return;
      }
      if(cell[ksel].locked){
        const cs=cellsOf(wsel),i=cs.indexOf(ksel);
        if(cell[ksel].sol===L){const nx=cs[i+1];if(nx)ksel=nx;paint();return} /* doğru harfin üstünden geç */
        const nx=cs.slice(i+1).find(k=>!cell[k].locked)||cs.find(k=>!cell[k].locked&&!cell[k].val);if(!nx)return;ksel=nx}
      cell[ksel].val=L;
      const c=cell[ksel];let any=false;
      [c.words[0],c.words[1]].forEach(wi=>{if(wi!=null){const r=checkWord(wi);if(r===true)any=true}});
      if(s.ended)return;
      const cs=cellsOf(wsel);
      if(solved.has(wsel)){const n=nextOpenWord();if(n>=0)selectWord(n);return}
      const i=cs.indexOf(ksel);const nx=cs[i+1]||cs.find(k=>!cell[k].locked&&!cell[k].val);
      if(nx)ksel=nx;paint();
    }
    function finish(){
      s.extra.time=performance.now()-t0;paint();
      s.hint(s.extra.hints?`Bulmaca tamam (${s.extra.hints} harf açıldı).`:'Bulmaca tamam!',true);
      s.bonus(s.extra.wrongTries===0&&s.extra.hints===0?30*lv:0);
      s.later(()=>s.end(),1500);
    }
    $$('.cwc[data-k]',s.stage).forEach(b=>b.onclick=()=>tapCell(b.dataset.k));
    cluesEl.forEach(b=>b.onclick=()=>selectWord(+b.dataset.w));
    $$('.kbd button',s.opts).forEach(b=>b.onclick=()=>type(b.dataset.l));
    s.opts.querySelector('#hintb').onclick=()=>{
      const cs=cellsOf(wsel);const k=cs.find(x=>!cell[x].locked&&cell[x].val!==cell[x].sol);if(!k)return;
      s.extra.hints++;s.bonus(-8);ksel=k;cell[k].el.classList.add('hinted');type(cell[k].sol);
    };
    s.key(e=>{
      if(e.key==='Backspace'){e.preventDefault();type('⌫');return}
      if(e.key==='Tab'){e.preventDefault();const n=nextOpenWord();if(n>=0)selectWord(n);return}
      if(e.key.length===1){const L=e.key.toLocaleUpperCase('tr-TR');if(LETTERS.includes(L)){e.preventDefault();type(L)}}
    });
    s.progress(1);s.barEl.style.opacity='.25';
    selectWord(words.findIndex(w=>w.num===1));
    s.hint(s.practice?'Deneme: üç kısa kelime. Bir ipucuna dokunarak başla.':`${words.length} kelime. Kolay gelsin!`);
  }});
})();
</script>
<script>
/* ===== LABİRENT: uzamsal planlama ===== */
(function(){
const {register,rnd,shuffle,SHAPES}=K;
SHAPES.maze='<path d="M8 8h84v13H8zM8 8h13v84H8zM8 79h84v13H8zM79 8h13v58H79zM34 34h45v12H34zM34 34h12v45H34zM58 58h12v21H58z"/>';
const DIRS=[{dx:0,dy:-1,b:1,o:4,k:'up'},{dx:1,dy:0,b:2,o:8,k:'right'},{dx:0,dy:1,b:4,o:1,k:'down'},{dx:-1,dy:0,b:8,o:2,k:'left'}];
const SIZE=[6,8,10,12,14,16,18,20];
function gen(N){
  const open=new Uint8Array(N*N),seen=new Uint8Array(N*N),st=[0];seen[0]=1;
  while(st.length){
    const c=st[st.length-1],x=c%N,y=(c/N)|0;
    const nb=shuffle(DIRS.slice()).filter(d=>{const nx=x+d.dx,ny=y+d.dy;return nx>=0&&ny>=0&&nx<N&&ny<N&&!seen[ny*N+nx]});
    if(!nb.length){st.pop();continue}
    const d=nb[0],n=(y+d.dy)*N+x+d.dx;open[c]|=d.b;open[n]|=d.o;seen[n]=1;st.push(n);
  }
  return open;
}
function shortest(open,N){
  const prev=new Int32Array(N*N).fill(-1);prev[0]=0;const q=[0];
  while(q.length){const c=q.shift();for(const d of DIRS)if(open[c]&d.b){const n=c+d.dx+d.dy*N;if(prev[n]<0){prev[n]=c;q.push(n)}}}
  const path=[];let c=N*N-1;while(c!==0){path.push(c);c=prev[c]}path.push(0);return path.reverse();
}

register({id:'labirent',name:'Labirent',cat:'uzamsal',skill:'Uzamsal planlama',glyph:'maze',len:'yaklaşık 1–3 dakika, 2 labirent',maxLevel:8,
  desc:'Sol üstten sağ alttaki çıkışa en kısa yoldan ulaş. Her oyunda yeni bir labirent.',
  tutorial:()=>['Mavi nokta sensin; yeşil kare çıkış.','Parmağınla ya da fareyle yol boyunca sürükleyerek ilerle. Kaydırma hareketi ya da ok tuşları seni bir sonraki kavşağa kadar götürür.',
    'Çıkmaz yollara girmek hata sayılır; amaç en kısa yolu bulmak.','Seviye arttıkça labirent büyür.'],
  keys:'Klavyede ok tuşları ya da W A S D ile hareket edebilirsin.',
  stats:e=>[['Labirent boyutu',e.size],['Ortalama çözüm süresi',Core.fmtSec(e.avgTime)],['Çıkmaz yola girme',e.dead],['Gereksiz adım',e.extraSteps],['Rota verimliliği',Core.fmtPct(e.eff||0)]],
  run(s){
    s.stage.classList.add('nofx');
    const total=s.practice?1:2;let done=0;const times=[],effs=[];
    Object.assign(s.extra,{dead:0,extraSteps:0,size:''});
    s.opts.innerHTML=`<div class="dpad"><span></span><button class="opt" data-d="0" aria-label="Yukarı">↑</button><span></span>
      <button class="opt" data-d="3" aria-label="Sola">←</button><button class="opt" data-d="2" aria-label="Aşağı">↓</button><button class="opt" data-d="1" aria-label="Sağa">→</button></div>`;
    let api=null;
    s.opts.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>api&&api.run(+b.dataset.d));
    s.key(e=>{const m={ArrowUp:0,w:0,W:0,ArrowRight:1,d:1,D:1,ArrowDown:2,s:2,S:2,ArrowLeft:3,a:3,A:3}[e.key];if(m!=null&&api){e.preventDefault();api.run(m)}});
    function start(){
      const N=s.practice?5:SIZE[s.level-1];const open=gen(N),best=shortest(open,N),onPath=new Set(best);
      s.stage.__test={N,best};
      s.extra.size=s.extra.size&&!s.extra.size.includes(`${N}×${N}`)?s.extra.size+', '+`${N}×${N}`:(s.extra.size||`${N}×${N}`);
      const sw=Math.max(.07,.14-N*.003);
      let d='';
      for(let y=0;y<N;y++)for(let x=0;x<N;x++){const c=y*N+x,o=open[c];
        if(!(o&1)&&c!==0)d+=`M${x} ${y}h1`;if(!(o&8))d+=`M${x} ${y}v1`;
        if(x===N-1)d+=`M${x+1} ${y}v1`;if(y===N-1&&c!==N*N-1)d+=`M${x} ${y+1}h1`;}
      s.stage.innerHTML=`<svg class="maze" viewBox="-0.3 -0.3 ${N+.6} ${N+.6}" role="img" aria-label="Labirent ${N}×${N}">
        <rect class="ex" x="${N-1+.15}" y="${N-1+.15}" width=".7" height=".7" rx=".15"/>
        <polyline class="trail" stroke-width=".26" points=".5,.5"/>
        <path class="w" stroke-width="${sw}" d="${d}"/>
        <circle class="me" r=".3" cx="0" cy="0" style="transform:translate(.5px,.5px)"/></svg>`;
      const svgEl=s.stage.querySelector('svg'),me=svgEl.querySelector('.me'),trail=svgEl.querySelector('.trail');
      let pos=0,steps=0,dead=0,busy=false;const pts=['.5,.5'];const t0=performance.now();let finished=false;
      s.progress(1-done/total);
      const nbOf=(c,di)=>{const x=c%N,y=(c/N)|0,D=DIRS[di];if(!(open[c]&D.b))return-1;return(y+D.dy)*N+x+D.dx};
      const degree=c=>DIRS.reduce((a,D)=>a+((open[c]&D.b)?1:0),0);
      function stepTo(n){
        if(finished)return;
        if(!onPath.has(n)&&onPath.has(pos)){dead++;s.extra.dead++;s.miss({sound:false})}
        pos=n;steps++;s.stage.__test.pos=pos;const x=pos%N+.5,y=((pos/N)|0)+.5;
        me.style.transform=`translate(${x}px,${y}px)`;pts.push(`${x},${y}`);trail.setAttribute('points',pts.join(' '));
        s.hint(`Adım: ${steps}`);
        if(pos===N*N-1)finish();
      }
      function finish(){
        finished=true;done++;const ms=performance.now()-t0,opt=best.length-1,eff=Math.min(1,opt/steps);
        times.push(ms);effs.push(eff);s.extra.extraSteps+=Math.max(0,steps-opt);
        s.hit({rt:ms,points:50+20*s.level+Math.round(eff*50)});
        s.hint(eff>=.95?'Neredeyse en kısa yoldan çıktın!':`Çıktın! En kısa yol ${opt} adım, sen ${steps} adım attın.`,true);
        if(eff>=.8&&dead<=2)s.setLevel(s.level+1);else if(eff<.45)s.setLevel(s.level-1);
        s.later(()=>{if(done>=total){s.extra.avgTime=Core.mean(times);s.extra.eff=Core.mean(effs);s.accuracy=s.extra.eff;s.progress(0);s.end()}else start()},1500);
      }
      /* kavşağa kadar koş: koridorda tek yön varsa devam et */
      function run(di){
        if(busy||finished)return;let n=nbOf(pos,di);if(n<0)return;busy=true;
        let prev=pos;
        const go=()=>{
          if(!s.alive||finished){busy=false;return}
          stepTo(n);
          if(finished||degree(pos)!==2){busy=false;return}
          const nx=DIRS.map((_,k)=>nbOf(pos,k)).filter(c=>c>=0&&c!==prev)[0];
          prev=pos;n=nx;s.later(go,45);
        };
        go();
      }
      api={run};
      const cellAt=e=>{const r=svgEl.getBoundingClientRect(),u=(N+.6)/r.width;const x=Math.floor((e.clientX-r.left)*u-.3),y=Math.floor((e.clientY-r.top)*u-.3);return x>=0&&y>=0&&x<N&&y<N?y*N+x:-1};
      let down=null,dragged=false;
      svgEl.addEventListener('pointerdown',e=>{e.preventDefault();down={x:e.clientX,y:e.clientY};dragged=false;try{svgEl.setPointerCapture(e.pointerId)}catch(_){}});
      svgEl.addEventListener('pointermove',e=>{
        if(!down||busy)return;const c=cellAt(e);if(c<0||c===pos)return;
        const di=DIRS.findIndex((_,k)=>nbOf(pos,k)===c);if(di>=0){dragged=true;stepTo(c)}
      });
      svgEl.addEventListener('pointerup',e=>{
        if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;down=null;if(dragged)return;
        if(Math.hypot(dx,dy)>24){run(Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0));return}
        const c=cellAt(e);const di=DIRS.findIndex((_,k)=>nbOf(pos,k)===c);if(di>=0)run(di);
      });
      svgEl.addEventListener('pointercancel',()=>{down=null});
      s.hint(s.practice?'Deneme: noktayı sürükle ya da ok tuşlarını kullan.':`Labirent ${done+1}/${total}: çıkışı bul.`);
    }
    start();
  }});
})();
</script>
