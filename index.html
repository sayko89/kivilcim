<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0620">
<title>Kıvılcım: zihin oyunları</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F7;--surface:#FFFFFF;--ink:#16223B;--muted:#56627A;--line:#D3DAE6;
  --c-blue:#0072B2;--c-green:#009E73;--c-red:#D55E00;--c-orange:#E69F00;--c-sky:#2F8FC4;--c-pink:#B8578F;--water:#D6E6F2;--land:#E4EDD8;--road:#B9C3D2;
  --good:#007A5A;--bad:#C24E00;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1626;--surface:#18223A;--ink:#E8EDF6;--muted:#9EAAC0;--line:#2B3856;
    --c-blue:#4DA8E6;--c-green:#2CC295;--c-red:#F07A3A;--c-orange:#F0B429;--c-sky:#7CC6EE;--c-pink:#E08DBE;--water:#15294A;--land:#1E3A2E;--road:#4A5A78;
    --good:#2CC295;--bad:#F07A3A;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1626;--surface:#18223A;--ink:#E8EDF6;--muted:#9EAAC0;--line:#2B3856;
  --c-blue:#4DA8E6;--c-green:#2CC295;--c-red:#F07A3A;--c-orange:#F0B429;--c-sky:#7CC6EE;--c-pink:#E08DBE;--water:#15294A;--land:#1E3A2E;--road:#4A5A78;
  --good:#2CC295;--bad:#F07A3A;color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font:400 1.0625rem/1.55 'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,.display{font-family:'Bricolage Grotesque','Atkinson Hyperlegible',system-ui,sans-serif;letter-spacing:-.02em;line-height:1.08;margin:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--c-blue);outline-offset:3px}
h1[tabindex]:focus{outline:none}
.wrap{max-width:760px;margin:0 auto;padding:12px 20px 48px}
svg{display:block}

/* üst bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 28px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:1.35rem;letter-spacing:-.02em}
.brand .mark{display:flex;gap:3px}
.brand .mark svg{width:14px;height:14px}
.nav{display:flex;gap:8px}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:700;font-size:.95rem;min-height:44px}
.ghost:hover{border-color:var(--ink)}

/* ana sayfa */
h1.big{font-size:clamp(2.3rem,8vw,3.6rem);font-weight:800;margin-bottom:10px}
.sub{color:var(--muted);margin:0 0 24px;max-width:52ch}
.streak{display:inline-block;font-weight:700;color:var(--ink);margin:0 0 20px;padding:4px 12px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line)}
.plan{list-style:none;margin:0 0 24px;padding:0;border-top:1.5px solid var(--line)}
.plan li{display:grid;grid-template-columns:60px 1fr auto;align-items:center;gap:16px;padding:14px 0;border-bottom:1.5px solid var(--line)}
.plan .g svg{width:52px;height:52px}
.plan .t b{display:block;font-size:1.15rem}
.plan .t span{color:var(--muted);font-size:.95rem}
.plan li.done .g{opacity:.3}
.done-tag{font-weight:700;color:var(--good);white-space:nowrap}
.link{background:none;border:0;padding:10px 4px;font-weight:700;text-decoration:underline;text-underline-offset:3px;color:var(--muted);min-height:44px}
.link:hover{color:var(--ink)}
.primary,.secondary{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;padding:14px 28px;font-weight:700;font-size:1.1rem;min-height:56px}
.primary{background:var(--ink);color:var(--bg);border:2px solid var(--ink)}
.primary:hover{filter:brightness(1.2)}
.secondary{background:transparent;border:2px solid var(--ink)}
.secondary:hover{background:var(--surface)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.all h2{font-size:1.5rem;margin:56px 0 16px}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
.gbtn{position:relative;overflow:hidden;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:18px 16px 16px;min-height:168px;display:flex;flex-direction:column;justify-content:flex-end}
.gbtn:hover{border-color:var(--ink)}
.gbtn svg{width:48px;height:48px;margin-bottom:auto;padding-bottom:16px;box-sizing:content-box}
.gbtn b{font-size:1.1rem;display:block}
.gbtn span{color:var(--muted);font-size:.9rem}
.gbtn small{display:block;margin-top:6px;font-size:.85rem;color:var(--muted)}
.note{margin-top:48px;color:var(--muted);font-size:.9rem;max-width:62ch}

/* tanıtım */
.intro{max-width:560px}
.intro .glyph svg{width:88px;height:88px;margin:8px 0 20px}
.intro h1{font-size:clamp(2.2rem,8vw,3.2rem);font-weight:800;margin-bottom:6px}
.meta{color:var(--muted);margin:0 0 20px}
.how{font-size:1.15rem;margin:0 0 12px}
.keys{color:var(--muted);margin:0 0 28px}

/* oyun */
.play{display:flex;flex-direction:column;min-height:calc(100vh - 60px);min-height:calc(100dvh - 60px)}
.hud{display:flex;align-items:center;gap:12px;padding:4px 0 10px}
.icon{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;font-size:1.1rem;flex:none}
.icon:hover{border-color:var(--ink)}
.hud .gname{font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .score{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:1.6rem;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--ink);transform-origin:left;transform:scaleX(1)}
.pbody{flex:1;display:flex;flex-direction:column;gap:12px;padding-top:12px}
.stage{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px}
.stage::after{position:absolute;top:4px;right:4px;font-size:2.4rem;font-weight:700;line-height:1}
.stage.good::after{content:'✓';color:var(--good)}
.stage.bad::after{content:'✗';color:var(--bad)}
.side{display:flex;flex-direction:column;gap:8px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.opt{min-height:80px;border-radius:18px;background:var(--surface);border:2px solid var(--ink);font-weight:700;font-size:1.35rem;display:flex;align-items:center;justify-content:center;gap:10px;font-variant-numeric:tabular-nums;touch-action:manipulation}
.opt:active{transform:translateY(2px)}
kbd{font:inherit;font-size:.8rem;font-weight:400;border:1.5px solid var(--line);border-radius:6px;padding:0 6px;color:var(--muted)}
@media (pointer:coarse){kbd{display:none}}
.hint{min-height:3.2em;text-align:center;color:var(--muted);margin:4px 0 0}
.hint.strong{color:var(--ink);font-weight:700}

.card{width:min(60vw,250px);aspect-ratio:1;background:var(--surface);border:2.5px solid var(--line);border-radius:30px;display:grid;place-items:center;animation:pop .18s ease-out}
.card svg{width:64%;height:64%}
.good .card{border-color:var(--good)}.bad .card{border-color:var(--bad)}
@keyframes pop{from{transform:scale(.9);opacity:.2}to{transform:none;opacity:1}}
.cap{margin:14px 0 0;color:var(--muted);text-align:center}

.spanel{background:#16223B;border-radius:30px;width:min(90vw,440px);padding:56px 16px;text-align:center;animation:pop .18s ease-out}
.word{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:clamp(2.4rem,11vw,4rem);letter-spacing:.01em}
.spatial{position:relative;width:min(78vw,320px);aspect-ratio:1;border:2.5px dashed var(--line);border-radius:26px;animation:pop .18s ease-out}
.spatial .w{position:absolute;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:clamp(1.4rem,6vw,2rem)}
.pos-top{top:14px;left:50%;transform:translateX(-50%)}
.pos-bottom{bottom:14px;left:50%;transform:translateX(-50%)}
.pos-left{left:14px;top:50%;transform:translateY(-50%)}
.pos-right{right:14px;top:50%;transform:translateY(-50%)}
.expr{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:clamp(3rem,15vw,5.5rem);font-variant-numeric:tabular-nums;animation:pop .18s ease-out}

.mgrid{display:grid;gap:8px;width:min(88vw,420px)}
.tile{aspect-ratio:1;min-width:44px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:1.4rem;font-weight:700;padding:0;touch-action:manipulation}
.tile:disabled{cursor:default}
.tile.lit{background:var(--c-green);border-color:var(--c-green)}
.tile.hit{background:var(--c-green);border-color:var(--c-green);color:#fff}
.tile.miss{border-color:var(--bad);color:var(--bad);border-width:3px}
.tile.reveal{border:3px dashed var(--c-green)}

/* sonuç */
.result{text-align:center;max-width:560px;margin:0 auto}
.result .glyph svg{width:64px;height:64px;margin:12px auto 12px}
.result .num{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:clamp(4rem,20vw,7rem);line-height:1;font-variant-numeric:tabular-nums}
.result .unit{color:var(--muted);margin:4px 0 24px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1.5px solid var(--line);border-radius:18px;overflow:hidden;margin:0 0 20px}
.stats div{background:var(--surface);padding:14px 10px}
.stats dt{color:var(--muted);font-size:.9rem}
.stats dd{margin:2px 0 0;font-weight:700;font-size:1.25rem;font-variant-numeric:tabular-nums}
.msg{font-weight:700;font-size:1.15rem;margin:0 0 6px}
.fine{color:var(--muted);font-size:.9rem;margin:0 0 28px}
.result .row{justify-content:center}

/* ilerleme */
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 36px}
.pstat{border-top:3px solid var(--ink);padding-top:10px}
.pstat b{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:2.4rem;font-weight:800;display:block;line-height:1.1}
.pstat span{color:var(--muted)}
.week{display:flex;gap:8px;margin-top:8px}
.week i{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:.75rem;color:var(--muted)}
.week i.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pgame{display:grid;grid-template-columns:48px 1fr auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1.5px solid var(--line)}
.pgame svg.gl{width:44px;height:44px}
.pgame b{display:block}
.pgame span{color:var(--muted);font-size:.92rem}
.spark{width:150px;height:40px;color:var(--ink)}
h2.sec{font-size:1.4rem;margin:0 0 8px}
.empty{padding:32px 0}

/* ayarlar */
.set{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:18px 0;border-bottom:1.5px solid var(--line)}
.set b{display:block}
.set span{color:var(--muted);font-size:.93rem}
.sw{appearance:none;-webkit-appearance:none;width:56px;height:32px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:none;margin:0}
.sw::after{content:'';position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:transform .15s}
.sw:checked{background:var(--c-green)}
.sw:checked::after{transform:translateX(24px)}
.danger{color:var(--bad);border-color:var(--bad)}

@media (orientation:landscape) and (max-height:540px){
  .play{min-height:calc(100vh - 20px)}
  .pbody{flex-direction:row;align-items:center}
  .stage{min-height:220px}
  .side{width:42%}
  .opts{grid-template-columns:1fr 1fr}
  .opt{min-height:64px}
  .card{width:min(40vh,220px)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== v2 eklemeleri ===== */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;font-weight:700;font-size:.95rem;min-height:44px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cat{margin:28px 0 0}
.cat h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:1.2rem;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.cat h3 i{font-style:normal}
.gcard{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:16px;display:grid;grid-template-columns:44px 1fr;gap:4px 14px;align-content:start}
.gcard>svg{width:44px;height:44px;grid-row:span 2}
.gcard b{font-size:1.1rem;align-self:end}
.gcard .skill{color:var(--muted);font-size:.88rem}
.gcard p{grid-column:1/-1;margin:8px 0 0;font-size:.95rem}
.gcard .sc{grid-column:1/-1;display:flex;gap:16px;font-size:.88rem;color:var(--muted);margin-top:10px}
.gcard .sc b{font-size:.95rem;color:var(--ink)}
.gcard .secondary{grid-column:1/-1;margin-top:12px;min-height:48px;padding:10px 20px;font-size:1rem}
.games2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.lvl{font-weight:700;font-size:.85rem;border:1.5px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.lvl.up{animation:lvlup .5s ease-out}
@keyframes lvlup{0%{transform:scale(1)}40%{transform:scale(1.18);border-color:var(--good)}100%{transform:scale(1)}}
.steps{margin:0 0 16px;padding-left:1.3em}
.steps li{margin:0 0 8px;font-size:1.05rem}
.stage.fill{align-items:stretch}
.stage.nofx::after{content:none!important}
.result h1.done{font-size:clamp(2rem,7vw,2.8rem);font-weight:800;margin:8px 0 4px}
.stats.four{grid-template-columns:repeat(2,1fr)}
@media (min-width:560px){.stats.four{grid-template-columns:repeat(4,1fr)}}
.extra{list-style:none;padding:0;margin:0 0 20px;text-align:left;border-top:1.5px solid var(--line)}
.extra li{display:flex;justify-content:space-between;gap:12px;padding:10px 2px;border-bottom:1.5px solid var(--line)}
.extra li span{color:var(--muted)}
.extra li b{font-variant-numeric:tabular-nums}
.pgame{cursor:pointer;background:none;border:0;border-bottom:1.5px solid var(--line);width:100%;text-align:left;font:inherit;color:inherit}
.pgame:hover b{text-decoration:underline}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin:12px 0 28px}
.chart{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px}
.chart b{display:block;margin-bottom:2px}
.chart span{color:var(--muted);font-size:.88rem}
.chart svg{width:100%;height:110px;margin-top:8px;color:var(--ink)}
.sessions{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
.sessions th,.sessions td{text-align:left;padding:8px 6px;border-bottom:1.5px solid var(--line)}
.sessions th{color:var(--muted);font-weight:400}
.tscroll{overflow-x:auto}

/* Kaybolan Rota */
.rgrid{position:relative;display:grid;gap:5px;width:min(92vw,440px,60vh);aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none}
.rc{border-radius:9px;border:2px solid var(--line);background:var(--surface);padding:0;font-weight:800;font-size:1rem;color:var(--muted);position:relative}
.rc.on{background:color-mix(in srgb,var(--c-green) 30%,var(--surface));border-color:var(--c-green)}
.rc.decoy{background:color-mix(in srgb,var(--muted) 18%,var(--surface))}
.rc.st,.rc.en{border-color:var(--ink);color:var(--ink)}
.rc.got{background:var(--c-green);border-color:var(--c-green);color:#fff}
.rc.wrong{border-color:var(--bad);color:var(--bad);animation:shake .3s}
.rc.show{border:3px dashed var(--c-green)}
.rsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.rsvg polyline{fill:none;stroke:var(--ink);stroke-width:.14;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.rsvg polyline.dec{stroke:var(--muted);stroke-dasharray:.2 .2;opacity:.5}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* Kural Değişti */
.rulebar{font-weight:700;padding:8px 14px;border-radius:12px;border:1.5px solid var(--line);margin-bottom:18px;text-align:center;min-height:44px;background:var(--surface)}
.rulebar.flash{animation:lvlup .6s}
.stim svg{width:min(44vw,180px);height:min(44vw,180px);animation:pop .16s ease-out}

/* Çift Görev */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;flex:1;min-height:320px}
.pane{position:relative;border:2px solid var(--line);border-radius:22px;background:var(--surface);display:flex;flex-direction:column;align-items:center;padding:12px 8px;touch-action:manipulation}
.pane .ph{font-weight:700;font-size:.92rem;text-align:center;min-height:2.6em}
.pane .pi{flex:1;display:grid;place-items:center;width:100%}
.pane .num{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:clamp(3rem,13vw,5rem);animation:pop .15s ease-out;font-variant-numeric:tabular-nums}
.pane .pi svg{width:min(28vw,130px);height:min(28vw,130px);animation:pop .15s ease-out}
.pane .pk{font-size:.8rem;color:var(--muted)}
.pane.good{border-color:var(--good)}.pane.bad{border-color:var(--bad)}
.pane .fb{position:absolute;bottom:26px;right:12px;font-size:1.6rem;font-weight:700}
.pane.good .fb::after{content:'✓';color:var(--good)}.pane.bad .fb::after{content:'✗';color:var(--bad)}
.pane.ruleflash .ph{animation:lvlup .6s;color:var(--c-red)}

/* Kalabalıkta Hedef ve Değişeni Bul */
.field{position:relative;width:100%;height:min(62vh,520px);min-height:300px;border:1.5px solid var(--line);border-radius:22px;background:var(--surface);overflow:hidden;touch-action:manipulation}
.fi{position:absolute;display:grid;place-items:center;background:none;border:0;padding:0;border-radius:50%;transform:translate(-50%,-50%)}
.fi svg{width:100%;height:100%;pointer-events:none}
.fi.x::after,.fi.ok::after{position:absolute;inset:-6px;border-radius:50%;content:'';border:3px solid var(--bad)}
.fi.ok::after{border-color:var(--good)}
.fi.reveal::after{position:absolute;inset:-8px;border-radius:50%;content:'';border:3px dashed var(--good)}
.target-sample{display:inline-block;width:1.6em;height:1.6em;vertical-align:middle}
.blank{display:grid;place-items:center;color:var(--muted);font-weight:700}

/* Hafıza Haritası */
.map{width:min(96vw,640px);max-height:62vh;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.map .water{fill:var(--water)}
.map .island{fill:var(--land);stroke:color-mix(in srgb,var(--land) 70%,var(--ink));stroke-width:2}
.map .road{stroke:var(--road);stroke-width:7;stroke-linecap:round}
.map .roadc{stroke:var(--surface);stroke-width:1.2;stroke-dasharray:4 5;opacity:.7}
.map .route{stroke:var(--c-sky);stroke-width:5;stroke-linecap:round;fill:none;stroke-dasharray:10 7}
.map .loc{cursor:pointer}
.map .loc .dot{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.map .loc.cur .dot{stroke:var(--c-sky);stroke-width:4}
.map .loc.bad .dot{stroke:var(--bad);stroke-width:4}
.map .loc.bad{animation:shake .3s}
.map .loc .lab{font:700 11px 'Atkinson Hyperlegible',system-ui,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3px}
.map .loc:focus{outline:none}
.map .loc:focus-visible .dot{stroke:var(--c-blue);stroke-width:4}
.map .badge circle{fill:var(--c-sky)}
.map .badge text{fill:#fff;font:800 11px system-ui,sans-serif}
.routetext{font-weight:700;text-align:center;margin:0 0 10px;min-height:1.6em}

/* Zihinsel Tetris */
.shapebig svg{width:min(56vw,220px);height:min(56vw,220px)}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(94vw,480px)}
.topt{aspect-ratio:1;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10%;touch-action:manipulation}
.topt:hover{border-color:var(--ink)}
.topt.ok{border-color:var(--good);border-width:4px}.topt.no{border-color:var(--bad);border-width:4px}
.topt svg{width:100%;height:100%}

/* Sayı Dedektifi */
.seq{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 8px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:clamp(1.5rem,6.5vw,2.4rem);animation:pop .18s ease-out;font-variant-numeric:tabular-nums}
.seq .ar{color:var(--muted);font-weight:600;font-size:.7em}
.seq .q{border:2.5px dashed var(--ink);border-radius:12px;padding:0 14px}

/* Sahte Hatıra */
.story{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:22px;font-size:1.2rem;line-height:1.7;max-width:60ch;animation:pop .2s ease-out}
.qtext{font-size:1.3rem;font-weight:700;text-align:center;max-width:36ch;animation:pop .16s ease-out}

/* Trafik */
.traffic{width:min(94vw,520px,58vh);aspect-ratio:1;touch-action:manipulation}
.traffic .grass{fill:var(--land)}
.traffic .rd{fill:var(--road)}
.traffic .box{fill:color-mix(in srgb,var(--road) 80%,var(--ink))}
.traffic .mark{stroke:var(--surface);stroke-width:1.5;stroke-dasharray:6 6;opacity:.8}
.traffic .stop{stroke:var(--surface);stroke-width:3}
.traffic .car.crash rect{fill:var(--bad)!important}
.lightbtn{min-height:64px}
.tstatus{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:.95rem}
.tstatus span{display:flex;align-items:center;gap:6px}
.tstatus i{width:14px;height:14px;border-radius:50%;display:inline-block}
.go{background:var(--good)}.no{background:var(--bad)}

/* Sudoku */
.sudoku{display:grid;width:min(94vw,460px,58vh);aspect-ratio:1;border:3px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--ink);gap:1px}
.sc{background:var(--surface);border:0;border-radius:0;padding:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:clamp(1rem,4.6vw,1.6rem);color:var(--c-blue);display:grid;place-items:center;font-variant-numeric:tabular-nums;touch-action:manipulation;min-width:0;min-height:0}
.sc.given{color:var(--ink)}
.sc.peer{background:color-mix(in srgb,var(--c-blue) 9%,var(--surface))}
.sc.same{background:color-mix(in srgb,var(--c-blue) 24%,var(--surface))}
.sc.sel{background:color-mix(in srgb,var(--c-blue) 40%,var(--surface))}
.sc.bad{color:var(--bad);animation:shake .3s}
.sc.bR{margin-right:2px}.sc.bB{margin-bottom:2px}
.numpad{display:grid;gap:8px}
.nk{min-height:56px;border-radius:14px;background:var(--surface);border:2px solid var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:1.4rem;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;touch-action:manipulation}
.nk small{font-family:'Atkinson Hyperlegible',system-ui,sans-serif;font-size:.62rem;font-weight:400;color:var(--muted);margin-top:3px}
.nk:disabled{opacity:.3;cursor:default}

/* Kelime bulmacası */
.cwwrap{display:flex;flex-direction:column;align-items:center;width:100%}
.cw{display:grid;gap:2px;width:min(94vw,420px)}
.cwc{aspect-ratio:1;position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:6px;padding:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:clamp(.75rem,3.8vw,1.3rem);min-width:0;touch-action:manipulation}
.cwc.blk{visibility:hidden}
.cwc small{position:absolute;top:1px;left:3px;font-size:.5em;font-weight:700;color:var(--muted);line-height:1}
.cwc.word{background:color-mix(in srgb,var(--c-orange) 20%,var(--surface))}
.cwc.sel{background:color-mix(in srgb,var(--c-orange) 50%,var(--surface));border-color:var(--ink)}
.cwc.ok{background:color-mix(in srgb,var(--c-green) 24%,var(--surface));color:var(--good);border-color:color-mix(in srgb,var(--c-green) 50%,var(--surface))}
.cwc.ok.sel{border-color:var(--ink)}
.cwc.bad{color:var(--bad);border-color:var(--bad);animation:shake .3s}
.cwc.hinted{text-decoration:underline dotted}
.clues{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:.92rem;width:100%;max-width:640px;margin-top:16px}
.clues h4{margin:0 0 4px;font-size:.95rem;font-family:'Bricolage Grotesque',system-ui,sans-serif}
.clues button{display:block;text-align:left;background:none;border:0;padding:5px 0;color:var(--ink);width:100%;font-size:.92rem}
.clues button.done{color:var(--muted);text-decoration:line-through}
.clues button.cur{font-weight:700}
@media (max-width:520px){.clues{grid-template-columns:1fr}}
.curclue{font-weight:700;margin:0 0 8px;min-height:2.6em;text-align:center}
.kbd{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.kbd button{min-height:44px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:1rem;padding:0;min-width:0;touch-action:manipulation}
.kbd button.wide{grid-column:span 2}
.kbd button:active{background:var(--line)}

/* Labirent */
.maze{width:min(94vw,500px,56vh);aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--surface);border-radius:14px}
.maze .w{stroke:var(--ink);stroke-linecap:round;fill:none}
.maze .trail{fill:none;stroke:var(--c-sky);stroke-linecap:round;stroke-linejoin:round;opacity:.6}
.maze .me{fill:var(--c-blue);transition:transform .045s linear}
.maze .ex{fill:var(--good)}
.dpad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:6px;justify-content:center}
.dpad .opt{min-height:0;font-size:1.3rem}

/* ===== Paket 2 ===== */
.bigch{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:clamp(3.5rem,18vw,6rem);line-height:1}
.simon{display:grid;gap:12px;width:min(82vw,360px)}
.pad{aspect-ratio:1;border-radius:26px;border:3px solid transparent;opacity:.32;display:grid;place-items:center;transition:opacity .12s,transform .12s;padding:0;touch-action:manipulation;position:relative}
.pad svg{width:42%;height:42%}
.pad b{position:absolute;bottom:8px;right:12px;color:#fff;font-size:.9rem}
.pad.on{opacity:1;transform:scale(1.05);border-color:var(--ink)}
.pad:disabled{cursor:default}
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:64px}
.slots i{font-style:normal;width:44px;height:58px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:1.6rem;background:var(--surface)}
.slots i.f{border-color:var(--ink)}
.mem{display:grid;gap:8px;width:min(94vw,460px)}
.mc{aspect-ratio:3/4;border-radius:14px;border:2px solid var(--line);background:var(--ink);font-size:clamp(1.4rem,7vw,2.4rem);display:grid;place-items:center;padding:0;touch-action:manipulation;color:var(--bg)}
.mc.up{background:var(--surface);animation:pop .16s ease-out}
.mc.done{background:color-mix(in srgb,var(--c-green) 22%,var(--surface));border-color:var(--c-green)}
.mc.no{border-color:var(--bad)}
.arrows{font-family:system-ui,sans-serif;font-weight:700;font-size:min(4.4rem,8vw);letter-spacing:.02em;white-space:nowrap;animation:pop .14s ease-out}
.holes{display:grid;gap:12px;width:min(88vw,400px)}
.hole{aspect-ratio:1;border-radius:50%;border:0;background:color-mix(in srgb,var(--ink) 14%,var(--surface));display:grid;place-items:center;font-size:clamp(2rem,10vw,3.4rem);padding:0;touch-action:manipulation;overflow:hidden}
.hole span{animation:rise .16s ease-out}
.hole.good{box-shadow:0 0 0 4px var(--good)}.hole.bad{box-shadow:0 0 0 4px var(--bad)}
@keyframes rise{from{transform:translateY(60%);opacity:0}to{transform:none;opacity:1}}
.schulte{display:grid;gap:6px;width:min(92vw,440px,58vh)}
.sq{aspect-ratio:1;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:clamp(1rem,5vw,1.7rem);padding:0;touch-action:manipulation}
.sq.done{opacity:.25}.sq.bad{border-color:var(--bad);animation:shake .3s}
.sh{display:grid;gap:10px;width:min(90vw,380px)}
.shp{border:2.5px dashed var(--line);border-radius:22px;min-height:130px;display:grid;place-items:center;position:relative}
.shp small{position:absolute;top:8px;left:14px;color:var(--muted);font-weight:700}
.shp.act{border-style:solid;border-color:var(--ink);background:var(--surface)}
.shp.act small{color:var(--ink)}
.cmd{display:flex;flex-direction:column;align-items:center;gap:8px;padding:28px 36px;border-radius:24px;border:3px solid var(--ink);background:var(--surface);animation:pop .14s ease-out}
.cmd.rev{border-style:dashed;border-color:var(--bad)}
.cmd .tag{font-weight:800;font-size:.9rem;padding:2px 10px;border-radius:999px;background:var(--bad);color:#fff}
.receipt{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:18px 22px;min-width:min(86vw,320px);font-variant-numeric:tabular-nums;animation:pop .16s ease-out}
.receipt div{display:flex;justify-content:space-between;gap:20px;padding:4px 0}
.receipt .tot{border-top:2px dashed var(--line);margin-top:6px;padding-top:8px;font-weight:700}
.fracs{display:flex;gap:28px;align-items:center;justify-content:center;animation:pop .16s ease-out}
.frac{display:flex;flex-direction:column;align-items:center;gap:8px}
.frac b{display:flex;flex-direction:column;align-items:center;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:2.4rem;line-height:1.05}
.frac b i{font-style:normal;border-top:3px solid var(--ink);padding-top:2px}
.frac svg{width:96px;height:96px}
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:60px}
.tl{width:48px;height:56px;border-radius:12px;border:2px solid var(--ink);background:var(--surface);font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:1.5rem;padding:0;touch-action:manipulation}
.tl.used{visibility:hidden}
.ans .tl{background:color-mix(in srgb,var(--c-orange) 25%,var(--surface))}
.ans.bad .tl{border-color:var(--bad);animation:shake .3s}
.ans.ok .tl{border-color:var(--good);background:color-mix(in srgb,var(--c-green) 25%,var(--surface))}
.clue{color:var(--muted);text-align:center;margin:0 0 14px;max-width:34ch}
.hanoi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(94vw,520px)}
.peg{position:relative;height:min(46vh,260px);border:2px solid transparent;border-radius:16px;background:transparent;display:flex;flex-direction:column-reverse;align-items:center;padding:0 0 12px;touch-action:manipulation}
.peg::before{content:'';position:absolute;bottom:12px;top:20px;width:8px;border-radius:4px;background:var(--line);left:50%;transform:translateX(-50%)}
.peg::after{content:'';position:absolute;bottom:4px;left:6%;right:6%;height:8px;border-radius:4px;background:var(--line)}
.peg.sel{border-color:var(--ink);background:var(--surface)}
.peg.bad{border-color:var(--bad);animation:shake .3s}
.disk{position:relative;z-index:1;height:22px;border-radius:8px;margin-top:4px;transition:transform .12s}
.peg.sel .disk:last-child{transform:translateY(-14px)}
.scales{display:flex;flex-direction:column;gap:12px;align-items:center;animation:pop .16s ease-out}
.bal{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:10px 16px;min-width:min(88vw,340px);font-size:1.6rem}
.bal span:first-child{text-align:right}
.bal i{font-style:normal;font-size:1.3rem;color:var(--muted)}
.bal.q{border:2.5px solid var(--ink)}
.toneg{display:grid;gap:6px;width:min(88vw,400px,56vh)}
.tc{aspect-ratio:1;border-radius:12px;border:0;padding:0;touch-action:manipulation}
.dotsw{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(92vw,440px)}
.dotp{aspect-ratio:1;border:2px solid var(--line);border-radius:18px;background:var(--surface)}
.dotsw.flash .dotp svg{animation:hideit 0s linear forwards;animation-delay:var(--hide,1.2s)}
@keyframes hideit{to{visibility:hidden}}
.clockface{width:min(62vw,240px);height:min(62vw,240px);animation:pop .16s ease-out}
.steps2{display:flex;flex-direction:column;gap:6px;align-items:center;font-weight:700;font-size:1.15rem}
.steps2 span{opacity:0;animation:fadein .2s forwards;animation-delay:var(--d,0s)}
.steps2.hide span{animation:fadein .2s forwards,fadeout .2s forwards;animation-delay:var(--d),var(--h)}
@keyframes fadein{to{opacity:1}}@keyframes fadeout{to{opacity:0}}
.face{font-size:3rem;line-height:1}
.mirrorbox svg{width:min(48vw,190px);height:min(48vw,190px);animation:pop .14s ease-out}

/* ================= ARCADE TEMASI ================= */
html:root:not([data-arcade-off]){
  --bg:#0B0620;--surface:#170F33;--ink:#F5F1FF;--muted:#B3A6E0;--line:#3D2E78;
  --c-blue:#00E5FF;--c-green:#39FF6A;--c-red:#FF3B6B;--c-orange:#FFC400;--c-sky:#5AA9FF;--c-pink:#FF4FD8;
  --good:#39FF6A;--bad:#FF3B6B;--water:#101C46;--land:#1B3A2A;--road:#4B3F7A;
  --px:'Press Start 2P','VT323',ui-monospace,monospace;--vt:'VT323',ui-monospace,'Courier New',monospace;
  color-scheme:dark;
}
body{font-family:var(--vt);font-size:1.32rem;line-height:1.35;letter-spacing:.01em;
  background:radial-gradient(1200px 600px at 50% -10%,#2A0F5C 0%,transparent 60%),
    linear-gradient(transparent 0 calc(100% - 1px),rgba(255,79,216,.07) calc(100% - 1px)) 0 0/100% 32px,
    linear-gradient(90deg,transparent 0 calc(100% - 1px),rgba(0,229,255,.06) calc(100% - 1px)) 0 0/32px 100%,var(--bg)}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
h1,h2,.display,.brand,.hud .score,.result .num,.pstat b,.cat h3,.clues h4,h2.sec{font-family:var(--px);letter-spacing:0;line-height:1.35}
h1.big,.intro h1,.result h1.done{font-size:clamp(1.15rem,5.2vw,2.1rem);color:var(--c-orange);text-shadow:3px 3px 0 var(--c-pink),0 0 18px rgba(255,196,0,.45)}
.all h2,h2.sec{font-size:clamp(.95rem,3.6vw,1.25rem);color:var(--c-blue);text-shadow:0 0 10px rgba(0,229,255,.55)}
.cat h3{font-size:.85rem;color:var(--ink)}
.brand{font-size:.95rem;color:var(--c-blue);text-shadow:2px 2px 0 var(--c-pink)}
.brand .mark svg{width:12px;height:12px;filter:drop-shadow(0 0 4px currentColor)}
.sub,.meta,.keys,.note,.fine,.how,.steps li,.hint,.gcard p,.gcard .skill,.set span,.chart span{font-family:var(--vt);font-size:1.25rem}
.steps li{font-size:1.32rem}
.note{color:var(--muted)}
/* düğmeler */
.primary,.secondary,.ghost,.chip,.opt,.link,.nk,.kbd button,.lvl,.streak,.done-tag{font-family:var(--px);letter-spacing:0}
.primary{background:var(--c-orange);color:#0B0620;border:3px solid #000;border-radius:4px;box-shadow:5px 5px 0 var(--c-pink);font-size:.82rem;padding:16px 22px;text-transform:uppercase;transition:transform .08s,box-shadow .08s}
.primary:hover{filter:none;background:#FFD84D}
.primary:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--c-pink)}
.secondary{border:3px solid var(--c-blue);color:var(--c-blue);border-radius:4px;font-size:.75rem;box-shadow:4px 4px 0 #000;text-transform:uppercase}
.secondary:hover{background:rgba(0,229,255,.12)}
.secondary:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}
.danger{color:var(--bad);border-color:var(--bad)}
.ghost,.chip{border:2px solid var(--line);border-radius:4px;font-size:.62rem;padding:10px 12px;color:var(--ink)}
.ghost:hover,.chip:hover{border-color:var(--c-pink);color:var(--c-pink)}
.chip[aria-pressed="true"]{background:var(--c-pink);color:#0B0620;border-color:var(--c-pink);box-shadow:0 0 14px rgba(255,79,216,.6)}
.link{font-size:.62rem;color:var(--c-blue);text-decoration:none;border-bottom:2px dotted}
.link:hover{color:var(--c-orange)}
.opt{font-size:.9rem;border-radius:4px;border:3px solid var(--c-blue);color:var(--ink);background:var(--surface);box-shadow:4px 4px 0 #000;line-height:1.4;padding:6px}
.opt:hover{background:#21164A;border-color:var(--c-pink)}
.opt:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}
kbd{font-family:var(--vt);font-size:.95rem;border-color:var(--line)}
.icon{border-radius:4px;border:2px solid var(--line)}
.lvl{font-size:.55rem;border:2px solid var(--c-green);color:var(--c-green);border-radius:4px;padding:5px 7px;box-shadow:0 0 10px rgba(57,255,106,.35)}
.hud .gname{font-family:var(--px);font-size:.6rem}
.hud .score{font-size:1.05rem;color:var(--c-orange);text-shadow:0 0 10px rgba(255,196,0,.7)}
.bar{height:10px;border-radius:0;background:#1E1442;border:2px solid var(--line)}
.bar i{background:repeating-linear-gradient(90deg,var(--c-green) 0 10px,transparent 10px 13px);box-shadow:0 0 10px rgba(57,255,106,.6)}
.streak{font-size:.6rem;border-radius:4px;border:2px solid var(--c-orange);color:var(--c-orange);background:transparent}
/* kartlar ve paneller */
.gcard,.card,.pane,.field,.story,.receipt,.bal,.chart,.cmd,.shp,.spanel,.mirrorbox,.dotp,.maze,.stats,.extra{border-radius:6px}
.gcard{border:2px solid var(--line);box-shadow:5px 5px 0 #000;transition:transform .1s,border-color .1s}
.gcard:hover{border-color:var(--c-pink);transform:translate(-2px,-2px);box-shadow:7px 7px 0 #000}
.gcard b{font-family:var(--px);font-size:.72rem;line-height:1.5}
.gcard>svg{filter:drop-shadow(0 0 6px currentColor)}
.gcard .sc{font-family:var(--vt);font-size:1.1rem}
.gcard .sc b{font-family:var(--px);font-size:.62rem;color:var(--c-orange)}
.gcard .secondary{font-size:.66rem}
.plan li{border-bottom:2px dashed var(--line)}.plan{border-top:2px dashed var(--line)}
.plan .t b{font-family:var(--px);font-size:.72rem;line-height:1.6}
.plan .t span{font-size:1.15rem}
.plan .g svg,.intro .glyph svg,.result .glyph svg{filter:drop-shadow(0 0 8px currentColor)}
.done-tag{font-size:.55rem}
.card{border:3px solid var(--c-blue);box-shadow:0 0 22px rgba(0,229,255,.35),inset 0 0 18px rgba(0,229,255,.12)}
.card svg{fill:var(--ink)}
.stats div{background:var(--surface)}
.stats dt{font-size:1.1rem}
.stats dd{font-family:var(--px);font-size:.85rem;color:var(--c-orange);margin-top:6px}
.extra li b{font-family:var(--px);font-size:.62rem}
.result .num{font-size:clamp(2rem,10vw,3.4rem)}
.msg{font-family:var(--px);font-size:.72rem;line-height:1.7;color:var(--c-green);text-shadow:0 0 10px rgba(57,255,106,.45)}
.stage.good::after,.stage.bad::after{font-family:var(--px);font-size:1.6rem;text-shadow:0 0 12px currentColor}
.pstat{border-top:3px solid var(--c-pink)}
.pstat b{font-size:1.5rem;color:var(--c-orange)}
.week i{border-radius:3px;font-family:var(--vt);font-size:.95rem}
.week i.on{background:var(--c-green);border-color:var(--c-green);color:#0B0620}
.sw{border-radius:4px}.sw::after{border-radius:2px}
/* büyük sayı ve harfler */
.bigch,.word,.spatial .w,.expr,.seq,.pane .num,.slots i,.sq,.frac b,.tl,.sc,.cwc,.nk,.arrows{font-family:var(--px)}

<script>
/* ===== Kıvılcım çekirdek: DOM'suz, deterministik, test edilebilir ===== */
const Core=(function(){
  const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
  /* Doğru cevap puanı: seviye ve seri (combo) ile artar, seri bonusu 6'da tavan yapar. */
  function points(level,combo){return 10+2*(Math.max(1,level)-1)+5*clamp(combo-1,0,6)}
  /* Oturum ham verisinden kayıt alanlarını üretir. */
  function summarize(r){
    const total=r.correct+r.mistakes;
    const acc=r.accuracy!=null?r.accuracy:(total?r.correct/total:0);
    const rt=mean(r.rts||[]);
    return{score:Math.max(0,Math.round(r.score)),accuracy:Math.round(clamp(acc,0,1)*1000)/1000,
      reactionTime:rt==null?null:Math.round(rt),level:r.maxLevel,mistakes:r.mistakes};
  }
  /* Adaptif zorluk: yalnızca mevcut başlangıç seviyesinde oynanan son 3 oyuna bakar.
     En az 2 oyun gerekir; böylece tek bir iyi ya da kötü oyun seviyeyi oynatmaz. */
  function nextStartLevel(cur,history,max){
    const w=history.filter(h=>h.startLevel===cur).slice(-3);
    if(w.length<2)return cur;
    const a=mean(w.map(h=>h.accuracy));
    if(a>0.9)return Math.min(max,cur+1);
    if(a<0.6)return Math.max(1,cur-1);
    return cur;
  }
  /* Geçmişle karşılaştırmalı kısa mesaj. prev: aynı oyunun bir önceki kaydı. */
  function compare(cur,prev,prevBest){
    if(!prev)return'İlk sonucun kaydedildi. Sonraki oyunlarda seni kendinle kıyaslayacağız.';
    if(cur.score>prevBest)return'Bu oyunda önceki en yüksek skorunu geçtin!';
    if(cur.reactionTime&&prev.reactionTime){
      const d=(prev.reactionTime-cur.reactionTime)/prev.reactionTime;
      if(d>=0.03)return`Önceki oyuna göre tepki süren %${Math.round(d*100)} iyileşti.`;
    }
    if(cur.accuracy>prev.accuracy+0.02)return`Doğruluğun önceki oyuna göre ${Math.round((cur.accuracy-prev.accuracy)*100)} puan arttı.`;
    if(prevBest&&cur.score>=prevBest*0.9)return'En yüksek skoruna çok yakınsın.';
    return'Her oyun aynı gitmez; asıl farkı düzenli oynamak yaratır.';
  }
  const fmtSec=ms=>ms==null?'—':(ms/1000).toFixed(2).replace('.',',')+' sn';
  const fmtPct=a=>'%'+Math.round(a*100);
  /* Tekrar üretilebilir rastgelelik (testler için). */
  function rng(seed){let x=seed>>>0||1;return()=>{x^=x<<13;x>>>=0;x^=x>>17;x^=x<<5;x>>>=0;return x/4294967296}}
  return{mean,clamp,points,summarize,nextStartLevel,compare,fmtSec,fmtPct,rng};
})();
if(typeof module!=='undefined')module.exports=Core;
</script>
<script>
/* ===== Kıvılcım uygulama kabuğu ===== */
const K=(function(){
'use strict';
const app=document.getElementById('app');
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- şekiller ---------- */
const SHAPES={
  circle:'<circle cx="50" cy="50" r="38"/>',

  triangle:'<polygon points="50,10 92,86 8,86"/>',

  star:'<polygon points="50,8 61,38 94,38 67,57 77,89 50,70 23,89 33,57 6,38 39,38"/>',
  cross:'<path d="M38 10h24v28h28v24H62v28H38V62H10V38h28z"/>',
  hex:'<polygon points="50,6 88,28 88,72 50,94 12,72 12,28"/>',
  ring:'<path fill-rule="evenodd" d="M50 10a40 40 0 1 0 .01 0zM50 32a18 18 0 1 1-.01 0z"/>',
  half:'<path d="M10 62a40 40 0 0 1 80 0z"/><rect x="10" y="68" width="80" height="16" rx="4"/>',
  tee:'<path d="M8 14h84v28H64v44H36V42H8z"/>'
};
const svg=(k,fill,cls)=>`<svg ${cls?`class="${cls}"`:''} viewBox="0 0 100 100" aria-hidden="true" fill="${fill}">${SHAPES[k]}</svg>`;

/* ---------- kategoriler ve oyun kayıt defteri ---------- */
const CATS=[
  {id:'hafiza',emoji:'🧠',name:'Hafıza',color:'var(--c-green)'},
  {id:'dikkat',emoji:'⚡',name:'Dikkat',color:'var(--c-red)'},
  {id:'esneklik',emoji:'🔄',name:'Esneklik',color:'var(--c-pink)'},
  {id:'problem',emoji:'🧩',name:'Problem Çözme',color:'var(--c-orange)'},
  {id:'gorsel',emoji:'👁️',name:'Görsel Algı',color:'var(--c-blue)'},
  {id:'uzamsal',emoji:'🗺️',name:'Uzamsal Akıl Yürütme',color:'var(--c-sky)'}
];
const GAMES={},IDS=[];
/* Yeni oyun eklemek için yalnızca register() çağrısı yeterli; başka kod değişmez. */
function register(def){
  const cat=CATS.find(c=>c.id===def.cat);
  def.color=cat?cat.color:'var(--ink)';def.maxLevel=def.maxLevel||10;
  def.keys=def.keys||'Fare ya da dokunmayla oynanır.';
  def.stats=def.stats||(()=>[]);
  GAMES[def.id]=def;if(!IDS.includes(def.id))IDS.push(def.id);
}

/* ---------- depolama: veriler yalnızca bu tarayıcıda ---------- */
const KEY='kivilcim.v1';
const uid=()=>'u-'+Math.random().toString(36).slice(2,10);
const defaults=()=>({userId:uid(),settings:{sound:true,cb:false},seen:{},history:[],levels:{},workout:null});
let S=defaults();
try{
  const raw=localStorage.getItem(KEY);
  if(raw){const p=JSON.parse(raw);S=Object.assign(defaults(),p);S.settings=Object.assign(defaults().settings,p.settings||{});S.levels=S.levels||{}}
}catch(e){}
/* v1 kayıtlarını yeni veri modeline taşı */
S.history=(S.history||[]).map((h,i)=>h.gameId?h:{id:'r'+(h.t||i),userId:S.userId,gameId:h.g,score:h.s,accuracy:h.acc,
  reactionTime:h.rt==null?null:h.rt,level:1,startLevel:1,mistakes:null,timestamp:h.t||Date.now(),input:h.input||'fare',extra:{}});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
save();
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>ymd(new Date());
const dayOf=h=>ymd(new Date(h.timestamp));
const hist=g=>S.history.filter(h=>h.gameId===g);
function best(g,input){const a=hist(g).filter(h=>!input||h.input===input).map(h=>h.score);return a.length?Math.max(...a):null}
function last(g){const a=hist(g);return a.length?a[a.length-1]:null}
function startLevel(g){return Core.clamp(S.levels[g]||1,1,GAMES[g].maxLevel)}
function streak(){
  const days=new Set(S.history.map(dayOf));const d=new Date();
  if(!days.has(ymd(d)))d.setDate(d.getDate()-1);
  let n=0;while(days.has(ymd(d))){n++;d.setDate(d.getDate()-1)}return n;
}
function workout(){
  const w=S.workout;
  if(!w||w.date!==today()||!w.games.every(g=>GAMES[g])){
    S.workout={date:today(),games:shuffle(IDS.slice()).slice(0,3),done:[]};save();
  }
  return S.workout;
}
const INPUT_LABEL={dokunmatik:'Dokunmatik',fare:'Fare',klavye:'Klavye'};

/* ---------- giriş yöntemi, klavye ve ses ---------- */
let inputKind=matchMedia('(pointer: coarse)').matches?'dokunmatik':'fare';
let keyHandler=null;
document.addEventListener('pointerdown',e=>{inputKind=(e.pointerType==='touch'||e.pointerType==='pen')?'dokunmatik':'fare'},true);
document.addEventListener('keydown',e=>{if(!['Tab','Shift','Alt','Control','Meta'].includes(e.key))inputKind='klavye';if(keyHandler)keyHandler(e)});
let ac=null;
function beep(ok){
  if(!S.settings.sound)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
    o.type='sine';o.frequency.setValueAtTime(ok?660:200,t);if(ok)o.frequency.linearRampToValueAtTime(880,t+.08);
    g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);
    o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.17);
  }catch(e){}
}

/* ---------- ortak görünüm parçaları ---------- */
function topbar(){
  return `<header class="top">
    <button class="brand" data-go="home" aria-label="Kıvılcım ana sayfa"><span class="mark">${svg('square','var(--c-blue)')}${svg('circle','var(--c-green)')}${svg('triangle','var(--c-red)')}</span>Kıvılcım</button>
    <nav class="nav"><button class="ghost" data-go="progress">İlerleme</button><button class="ghost" data-go="settings">Ayarlar</button></nav>
  </header>`;
}
function bindNav(){$$('[data-go]').forEach(b=>b.onclick=()=>VIEWS[b.dataset.go]())}
function show(html){
  if(current){current.stop();current=null}
  keyHandler=null;app.innerHTML=html;bindNav();window.scrollTo(0,0);
  const h=$('h1',app);if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true})}
}
let current=null;

/* ---------- ana sayfa ---------- */
let catFilter='all';
function home(){
  const w=workout(),st=streak();
  const allDone=w.games.every(g=>w.done.includes(g));
  const started=w.done.length>0;
  const rows=w.games.map((g,i)=>{const G=GAMES[g],d=w.done.includes(g);
    return `<li class="${d?'done':''}"><span class="g">${svg(G.glyph,G.color)}</span>
      <span class="t"><b>${G.name}</b><span>${G.skill}, ${G.len}</span></span>
      ${d?'<span class="done-tag">✓ Tamamlandı</span>':`<button class="link" data-swap="${i}" aria-label="${G.name} yerine başka oyun seç">Değiştir</button>`}</li>`}).join('');
  const card=g=>{const G=GAMES[g],b=best(g),l=last(g);
    return `<article class="gcard">${svg(G.glyph,G.color)}<b>${G.name}</b><span class="skill">${G.skill}</span>
      <p>${G.desc}</p>
      <div class="sc"><span>En yüksek <b>${b??'—'}</b></span><span>Son <b>${l?l.score:'—'}</b></span><span>Seviye <b>${startLevel(g)}</b></span></div>
      <button class="secondary" data-play="${g}" aria-label="${G.name} oyna">Oyna</button></article>`};
  const cats=CATS.filter(c=>catFilter==='all'||c.id===catFilter).map(c=>{
    const ids=IDS.filter(g=>GAMES[g].cat===c.id);if(!ids.length)return'';
    return `<section class="cat"><h3><i aria-hidden="true">${c.emoji}</i>${c.name}</h3><div class="games2">${ids.map(card).join('')}</div></section>`}).join('');
  show(`${topbar()}
  <main>
    <section>
      <h1 class="big">${allDone?'Bugünkü antrenman tamam.':'Bugünün antrenmanı'}</h1>
      <p class="sub">${allDone?'Yarın yeni bir seçki seni bekliyor. İstersen aşağıdan dilediğin oyunu tekrar oynayabilirsin.':'Üç oyun, yaklaşık beş dakika. Canın istemeyen bir oyun varsa değiştir.'}</p>
      ${st>0?`<p class="streak">${st} günlük seri</p>`:''}
      <ol class="plan">${rows}</ol>
      ${allDone?'':`<button class="primary" id="startW">${started?'Antrenmana devam et':'Antrenmana başla'}</button>`}
    </section>
    <section class="all">
      <h2>Tüm oyunlar</h2>
      <div class="chips" role="group" aria-label="Kategoriye göre süz">
        <button class="chip" data-cat="all" aria-pressed="${catFilter==='all'}">Tümü</button>
        ${CATS.map(c=>`<button class="chip" data-cat="${c.id}" aria-pressed="${catFilter===c.id}">${c.emoji} ${c.name}</button>`).join('')}
      </div>
      ${cats}
    </section>
    <p class="note">Kayıt yok, ücret yok, kilitli oyun yok. İlerlemen yalnızca bu tarayıcıda saklanır. Bu oyunlar tıbbi ya da psikolojik bir değerlendirme yapmaz; skorlar yalnızca oyun içi performansını gösterir.</p>
  </main>`);
  $$('[data-swap]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.swap;const pool=IDS.filter(g=>!w.games.includes(g));
    if(!pool.length)return;w.games[i]=pick(pool);save();home();
    const nb=$(`[data-swap="${i}"]`);if(nb)nb.focus();
  });
  $$('[data-cat]').forEach(b=>b.onclick=()=>{catFilter=b.dataset.cat;const y=window.scrollY;home();window.scrollTo(0,y);$(`[data-cat="${catFilter}"]`).focus()});
  $$('[data-play]').forEach(b=>b.onclick=()=>intro(b.dataset.play,false));
  const sw=$('#startW');if(sw)sw.onclick=()=>{const next=w.games.find(g=>!w.done.includes(g));intro(next,true)};
}

/* ---------- tanıtım (tutorial) ---------- */
function intro(id,fromW,afterPractice){
  const G=GAMES[id],seen=S.seen[id],lv=startLevel(id);
  const steps=G.tutorial();
  show(`${topbar()}
  <main class="intro">
    <div class="glyph">${svg(G.glyph,G.color)}</div>
    <h1>${G.name}</h1>

      :`<ol class="steps">${steps.map(s=>`<li>${s}</li>`).join('')}</ol>`}

    <div class="row">
      ${!seen&&!afterPractice
        ?`<button class="primary" id="prac">Deneme turunu oyna</button><button class="link" id="go">Denemeyi atla</button>`
        :`<button class="primary" id="go">Oyunu başlat</button>${afterPractice?'':'<button class="secondary" id="prac">Deneme turu</button>'}`}
      <button class="link" data-go="home">Ana sayfa</button>
    </div>

  const p=$('#prac');if(p)p.onclick=()=>play(id,fromW,true);
  $('#go').onclick=()=>play(id,fromW,false);
}

/* ---------- saat (duraklatılabilir) ---------- */
function Clock(ms,onTick,onEnd){
  let left=ms,lastT=null,paused=false,done=false,raf;
  const f=t=>{if(done)return;if(lastT!==null&&!paused)left-=t-lastT;lastT=t;
    if(left<=0){done=true;onTick(0);onEnd();return}onTick(left/ms);raf=requestAnimationFrame(f)};
  raf=requestAnimationFrame(f);
  return{pause(){paused=true},resume(){paused=false},stop(){done=true;cancelAnimationFrame(raf)},get left(){return left}};
}

/* ---------- GameSession: tüm oyunların ortak motoru ---------- */
function play(id,fromW,practice){
  const G=GAMES[id];
  const lv0=practice?1:startLevel(id);
  show(`<main class="play">
    <div class="hud">
      <button class="icon" id="quit" aria-label="Oyundan çık">✕</button>
      <span class="gname">${G.name}${practice?' (deneme)':''}</span>
      <span class="lvl" id="lvl">Seviye ${lv0}</span>
      <button class="icon" id="snd" aria-label="Sesi aç ya da kapat" aria-pressed="${S.settings.sound}">${S.settings.sound?'🔊':'🔇'}</button>
      <span class="score" aria-live="off">0</span>
    </div>
    <div class="bar" aria-hidden="true"><i></i></div>
    <div class="pbody">
      <div class="stage" aria-live="polite"></div>
      <div class="side"><div class="opts"></div><p class="hint" aria-live="polite"></p></div>
    </div>
  </main>`);
  const root=$('.play');
  const s=new Session(G,root,practice,lv0,fromW);
  current=s;
  $('#quit').onclick=()=>{s.stop();current=null;fromW?home():intro(id,fromW)};
  $('#snd').onclick=e=>{S.settings.sound=!S.settings.sound;save();e.currentTarget.textContent=S.settings.sound?'🔊':'🔇';e.currentTarget.setAttribute('aria-pressed',S.settings.sound)};
  try{G.run(s)}catch(err){console.error(err);s.stop();current=null;home()}
}

class Session{
  constructor(G,root,practice,level,fromW){
    Object.assign(this,{G,root,practice,level,startLevel:level,maxLevel:level,fromW,
      score:0,correct:0,mistakes:0,combo:0,bestCombo:0,rts:[],inputs:{},extra:{},accuracy:null,
      stopped:false,ended:false,_t:[],_raf:[],_clock:null});
    this.stage=$('.stage',root);this.opts=$('.opts',root);this.hintEl=$('.hint',root);
    this.barEl=$('.bar i',root);this.scoreEl=$('.score',root);this.lvlEl=$('#lvl',root);
  }
  get alive(){return!this.stopped&&!this.ended}
  hint(t,strong){this.hintEl.innerHTML=t||'';this.hintEl.classList.toggle('strong',!!strong)}
  setLevel(n){
    n=Core.clamp(n,1,this.G.maxLevel);if(this.practice)n=Math.min(n,2);
    if(n===this.level)return;const up=n>this.level;this.level=n;this.maxLevel=Math.max(this.maxLevel,n);
    this.lvlEl.textContent='Seviye '+n;if(up){this.lvlEl.classList.remove('up');void this.lvlEl.offsetWidth;this.lvlEl.classList.add('up')}
  }
  _input(){this.inputs[inputKind]=(this.inputs[inputKind]||0)+1}
  hit(o={}){
    if(!this.alive)return 0;
    this.correct++;this.combo++;this.bestCombo=Math.max(this.bestCombo,this.combo);
    const pts=o.points!=null?o.points:Core.points(this.level,this.combo);
    if(!this.practice){this.score+=pts;this.scoreEl.textContent=this.score}
    if(o.rt!=null)this.rts.push(o.rt);
    this._input();if(o.sound!==false)beep(true);return pts;
  }
  miss(o={}){
    if(!this.alive)return;
    this.mistakes++;this.combo=0;
    if(!this.practice&&o.penalty){this.score=Math.max(0,this.score-o.penalty);this.scoreEl.textContent=this.score}
    this._input();if(o.sound!==false)beep(false);
  }
  addRt(ms){if(ms!=null)this.rts.push(ms)}
  bonus(p){if(this.practice||!this.alive)return;this.score=Math.max(0,this.score+p);this.scoreEl.textContent=this.score}
  flash(kind,ms=320,el=this.stage){
    el.classList.remove('good','bad');void el.offsetWidth;el.classList.add(kind);
    this.later(()=>el.classList.remove(kind),ms);
  }
  progress(f){this.barEl.style.transform=`scaleX(${Core.clamp(f,0,1)})`}
  later(fn,ms){const id=setTimeout(()=>{if(this.alive)fn()},ms);this._t.push(id);return id}
  every(fn,ms){const id=setInterval(()=>{if(this.alive)fn()},ms);this._t.push(id);return id}
  loop(fn){
    let lastT=null;const self=this,idx=this._raf.length;
    const f=t=>{if(!self.alive)return;const dt=lastT==null?0:Math.min(.05,(t-lastT)/1000);lastT=t;if(fn(dt,t)===false)return;self._raf[idx]=requestAnimationFrame(f)};
    this._raf.push(requestAnimationFrame(f));
  }
  timer(ms,onEnd){
    this._clock=Clock(ms,f=>{if(this.alive)this.progress(f)},()=>{if(this.alive)(onEnd||(()=>this.end()))()});
    return this._clock;
  }
  pause(){this._clock&&this._clock.pause()}
  resume(){this._clock&&this._clock.resume()}
  key(fn){keyHandler=e=>{if(this.alive)fn(e)}}
  _clear(){this._t.forEach(t=>{clearTimeout(t);clearInterval(t)});this._raf.forEach(cancelAnimationFrame);this._clock&&this._clock.stop();keyHandler=null}
  stop(){if(this.stopped)return;this.stopped=true;this._clear();this.G.cleanup&&this.G.cleanup(this)}
  end(){
    if(!this.alive)return;this.ended=true;this._clear();
    const id=this.G.id;
    if(this.practice){S.seen[id]=true;save();intro(id,this.fromW,true);return}
    S.seen[id]=true;
    const sum=Core.summarize(this);
    const input=Object.keys(this.inputs).sort((a,b)=>this.inputs[b]-this.inputs[a])[0]||inputKind;
    const prev=last(id),prevBest=best(id);
    const rec={id:'r'+Date.now().toString(36)+rnd(1e4),userId:S.userId,gameId:id,...sum,startLevel:this.startLevel,
      timestamp:Date.now(),input,extra:Object.assign({bestCombo:this.bestCombo},this.extra)};
    S.history.push(rec);
    const nl=Core.nextStartLevel(this.startLevel,hist(id),this.G.maxLevel);
    S.levels[id]=nl;
    if(this.fromW){const w=workout();if(w.games.includes(id)&&!w.done.includes(id))w.done.push(id)}
    save();
    result(id,this.fromW,rec,prev,prevBest,nl);
  }
}

/* ---------- ortak soru-cevap döngüsü (seçenekli oyunlar için) ---------- */
function quiz(s,cfg){
  let item=null,busy=true,shown=0,n=0,pc=0,timeUp=false;
  const st=cfg.state||{};
  function render(){
    item=cfg.gen(st,s);
    s.stage.innerHTML=item.html;
    s.opts.innerHTML=(item.options||[]).map(o=>`<button class="opt" data-v="${esc(o.value)}">${o.label}${o.keyLabel?`<kbd>${o.keyLabel}</kbd>`:''}</button>`).join('');
    $$('.opt',s.opts).forEach(b=>b.onclick=()=>answer(b.dataset.v));
    if(!s.practice||item.noScore)s.hint(item.cap||'');
    shown=performance.now();busy=false;
    cfg.onShow&&cfg.onShow(item,st);
  }
  function answer(v){
    if(busy||!s.alive)return;busy=true;
    const rt=performance.now()-shown,right=v===String(item.correct);
    if(!item.noScore){
      n++;
      if(right){s.hit({rt});st.correct=(st.correct||0)+1}else s.miss();
      s.stage.classList.add(right?'good':'bad');
      if(s.practice)s.hint((right?'Doğru. ':'Yanlış. ')+(item.explain||''),true);
      else if(!right&&cfg.showWrong)s.hint('Doğru cevap: '+item.correctLabel,true);
      cfg.after&&cfg.after(item,right,rt,st,s);
    }
    if(!right||item.noScore)s.pause(); /* süre yalnızca yanlıştan sonra durur */
    const wait=item.noScore?120:s.practice?(right?900:2200):right?(cfg.okWait||300):(cfg.badWait||700);
    s.later(()=>{
      s.stage.classList.remove('good','bad');
      if(s.practice&&!item.noScore&&++pc>=cfg.practiceN){s.end();return}
      if(!s.practice&&cfg.rounds){s.progress(1-n/cfg.rounds);if(n>=cfg.rounds){s.end();return}}
      if(timeUp){s.end();return}
      s.resume();render();
    },wait);
  }
  s.key(e=>{
    if(!item||busy)return;
    const o=(item.options||[]).find(o=>o.key===e.key||(o.alt&&o.alt.includes(e.key)));
    if(o){e.preventDefault();answer(String(o.value))}
  });
  if(s.practice){s.progress(1);s.barEl.style.opacity='.25';s.hint('Deneme turu: süre yok, puan sayılmaz.')}
  render();
  if(!s.practice&&cfg.duration)s.timer(cfg.duration,()=>{timeUp=true;if(!busy)s.end()});
  if(!s.practice&&cfg.rounds)s.progress(1);
}
const YN=[{label:'Hayır',value:'n',key:'ArrowLeft',keyLabel:'←'},{label:'Evet',value:'y',key:'ArrowRight',keyLabel:'→'}];

/* ---------- sonuç ekranı ---------- */
function result(id,fromW,rec,prev,prevBest,nextLv){

  else if(nextLv<rec.startLevel)lvMsg=`Zorluğu biraz azalttık; bir sonraki oyuna seviye ${nextLv}'den başlayacaksın.`;
  const extra=G.stats(rec.extra,rec).filter(Boolean);
  show(`${topbar()}
  <main class="result">

      <div><dt>Ortalama tepki</dt><dd>${Core.fmtSec(rec.reactionTime)}</dd></div>

    <p class="msg">${msg}</p>
    <p class="fine">${lvMsg?lvMsg+' ':''}${INPUT_LABEL[rec.input]} ile oynadın; en yüksek skorun bu giriş yönteminde ${Math.max(rec.score,best(id,rec.input)||0)}.</p>
    <div class="row">

/* ---------- ilerleme ---------- */
function spark(vals){
  if(vals.length<2)return'';
  const w=150,h=40,mx=Math.max(...vals),mn=Math.min(...vals);
  const pts=vals.map((v,i)=>`${(4+i/(vals.length-1)*(w-8)).toFixed(1)},${(h-4-(mx===mn?.5:(v-mn)/(mx-mn))*(h-8)).toFixed(1)}`).join(' ');
  const lp=pts.split(' ').pop().split(',');
  return`<svg class="spark" viewBox="0 0 ${w} ${h}" role="img" aria-label="Son ${vals.length} skorun gidişatı"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${lp[0]}" cy="${lp[1]}" r="3.5" fill="currentColor"/></svg>`;
}
function chart(title,sub,vals,fmt,invert){
  const v=vals.filter(x=>x!=null);
  if(v.length<2)return`<div class="chart"><b>${title}</b><span>Grafik için en az iki oyun gerekli.</span></div>`;
  const W=300,H=110,P=14,mx=Math.max(...v),mn=Math.min(...v);
  const y=x=>{const f=mx===mn?.5:(x-mn)/(mx-mn);return(H-P-(invert?1-f:f)*(H-2*P)).toFixed(1)};
  const xs=i=>(P+i/(v.length-1)*(W-2*P)).toFixed(1);
  const pts=v.map((x,i)=>`${xs(i)},${y(x)}`).join(' ');
  return`<div class="chart"><b>${title}</b><span>${sub}. Son: ${fmt(v[v.length-1])}, en iyi: ${fmt(invert?mn:mx)}</span>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${title} grafiği">
      <line x1="${P}" x2="${W-P}" y1="${H-P}" y2="${H-P}" stroke="var(--line)" stroke-width="1.5"/>
      <polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      ${v.map((x,i)=>`<circle cx="${xs(i)}" cy="${y(x)}" r="3" fill="currentColor"/>`).join('')}
    </svg></div>`;
}
function progress(){
  const H=S.history;
  if(!H.length){
    show(`${topbar()}<main class="empty"><h1 class="big">İlerleme</h1><p class="sub">Henüz oyun oynamadın. İlk antrenmanını bitirdiğinde skorların ve serin burada görünecek.</p><button class="primary" data-go="home">Antrenmana git</button></main>`);return;

  const played=IDS.filter(g=>hist(g).length),unplayed=IDS.filter(g=>!hist(g).length);
  const row=g=>{const G=GAMES[g],hs=hist(g);
    if(!hs.length)return`<div class="pgame">${svg(G.glyph,G.color,'gl')}<div><b>${G.name}</b><span>Henüz oynanmadı</span></div><span></span></div>`;
    return`<button class="pgame" data-detail="${g}">${svg(G.glyph,G.color,'gl')}<div><b>${G.name}</b><span>${hs.length} oyun. En yüksek ${best(g)}, seviye ${startLevel(g)}.</span></div>${spark(hs.slice(-12).map(h=>h.score))}</button>`};
  show(`${topbar()}<main>
    <h1 class="big">İlerleme</h1>
    <p class="sub">Bir oyuna dokunarak skor, doğruluk, tepki süresi ve seviye grafiklerini gör.</p>
    <div class="pgrid">
      <div class="pstat"><b>${streak()}</b><span>günlük seri</span></div>
      <div class="pstat"><b>${H.length}</b><span>toplam oyun</span></div>
      <div class="pstat"><span>Son 7 gün</span><div class="week">${wk.join('')}</div></div>
    </div>
    <h2 class="sec">Oynadıkların</h2>
    ${played.map(row).join('')}
    ${unplayed.length?`<h2 class="sec" style="margin-top:32px">Henüz denemediklerin</h2>${unplayed.map(row).join('')}`:''}
  </main>`);
  $$('[data-detail]').forEach(b=>b.onclick=()=>detail(b.dataset.detail));
}
function detail(g){
  const G=GAMES[g],hs=hist(g).slice(-20);
  const d=h=>new Date(h.timestamp);
  show(`${topbar()}<main>
    <button class="link" data-go="progress">İlerlemeye dön</button>
    <h1 class="big">${G.name}</h1>

    <div class="charts">
      ${chart('Skor','Yüksek daha iyi',hs.map(h=>h.score),x=>x)}
      ${chart('Doğruluk','Yüksek daha iyi',hs.map(h=>h.accuracy),Core.fmtPct)}
      ${chart('Ortalama tepki','Grafikte yukarı daha hızlı demek',hs.map(h=>h.reactionTime),Core.fmtSec,true)}
      ${chart('Seviye','Ulaşılan en yüksek seviye',hs.map(h=>h.level),x=>x)}
    </div>
    <h2 class="sec">Oyun geçmişi</h2>
    <div class="tscroll"><table class="sessions"><thead><tr><th>Tarih</th><th>Skor</th><th>Doğruluk</th><th>Tepki</th><th>Seviye</th><th>Hata</th></tr></thead>
    <tbody>${hs.slice().reverse().map(h=>`<tr><td>${d(h).toLocaleDateString('tr-TR')} ${d(h).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}</td><td>${h.score}</td><td>${Core.fmtPct(h.accuracy)}</td><td>${Core.fmtSec(h.reactionTime)}</td><td>${h.level}</td><td>${h.mistakes??'—'}</td></tr>`).join('')}</tbody></table></div>
    <div class="row" style="margin-top:24px"><button class="primary" id="pl">Oyna</button></div>
  </main>`);
  $('#pl').onclick=()=>intro(g,false);
}

register({id:'hafiza',name:'Hafıza ızgarası',cat:'hafiza',skill:'Görsel hafıza',glyph:'circle',len:'8 tur',maxLevel:12,
  desc:'Kısa süre yanan kareleri hatırla ve aynılarını seç.',
